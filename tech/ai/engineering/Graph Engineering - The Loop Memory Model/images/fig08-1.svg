<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#555B66"/></marker><marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#B5524A"/></marker></defs>
<rect width="1500" height="640" fill="#FFFFFF"/>
<text x="750" y="58" font-size="34" text-anchor="middle" fill="#2B2F36" font-weight="bold">그래프 만들기: 파싱과 추출, 그리고 네 단계</text>
<rect x="60" y="100" width="640" height="180" rx="14" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2.5"/>
<text x="380" y="137" font-size="22" text-anchor="middle" fill="#2B2F36" font-weight="bold">파싱한다 (성숙한 저장소의 약 70%)</text>
<text x="380" y="179" font-size="19" text-anchor="middle" fill="#2B2F36">스키마가 있는 것: 노드 머리말과 Edges</text>
<text x="380" y="209" font-size="19" text-anchor="middle" fill="#2B2F36">spec.md의 요구사항과 시나리오</text>
<text x="380" y="239" font-size="19" text-anchor="middle" fill="#2B2F36">커밋 메타데이터와 트레일러</text>
<text x="380" y="269" font-size="19" text-anchor="middle" fill="#2B2F36">테스트 이름 (시나리오 ID와 대응)</text>
<rect x="800" y="100" width="640" height="180" rx="14" fill="#FBF0DC" stroke="#B8862B" stroke-width="2.5"/>
<text x="1120" y="137" font-size="22" text-anchor="middle" fill="#2B2F36" font-weight="bold">추출한다 (진짜 산문만)</text>
<text x="1120" y="179" font-size="19" text-anchor="middle" fill="#2B2F36">노드 본문과 결과 서술</text>
<text x="1120" y="209" font-size="19" text-anchor="middle" fill="#2B2F36">제안서의 서사</text>
<text x="1120" y="239" font-size="19" text-anchor="middle" fill="#2B2F36">에이전트 실행 기록과 보고서</text>
<text x="1120" y="269" font-size="19" text-anchor="middle" fill="#2B2F36">외부 문서, RFC, 사고 보고서</text>
<text x="750" y="322" font-size="22" text-anchor="middle" fill="#2B2F36" font-weight="bold">규칙: 형식을 만들어 둔 것은 모델로 다시 추출하지 않는다</text>
<rect x="60" y="360" width="290" height="200" rx="14" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2.5"/>
<text x="205" y="422" font-size="22" text-anchor="middle" fill="#2B2F36" font-weight="bold">1 추출</text>
<text x="205" y="464" font-size="19" text-anchor="middle" fill="#2B2F36">문서당 호출 1회</text>
<text x="205" y="494" font-size="19" text-anchor="middle" fill="#2B2F36">싼 모델, 스키마 강제</text>
<text x="205" y="524" font-size="19" text-anchor="middle" fill="#2B2F36">술어는 닫힌 집합</text>
<rect x="420" y="360" width="290" height="200" rx="14" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2.5"/>
<text x="565" y="422" font-size="22" text-anchor="middle" fill="#2B2F36" font-weight="bold">2 해소</text>
<text x="565" y="464" font-size="19" text-anchor="middle" fill="#2B2F36">싸게 후보 좁히기</text>
<text x="565" y="494" font-size="19" text-anchor="middle" fill="#2B2F36">강한 모델이 판정</text>
<text x="565" y="524" font-size="19" text-anchor="middle" fill="#2B2F36">병합은 supersedes</text>
<rect x="780" y="360" width="290" height="200" rx="14" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2.5"/>
<text x="925" y="422" font-size="22" text-anchor="middle" fill="#2B2F36" font-weight="bold">3 조립</text>
<text x="925" y="464" font-size="19" text-anchor="middle" fill="#2B2F36">속성 그래프에 적재</text>
<text x="925" y="494" font-size="19" text-anchor="middle" fill="#2B2F36">출처와 실행 ID 보존</text>
<text x="925" y="524" font-size="19" text-anchor="middle" fill="#2B2F36">층(layer) 부여</text>
<rect x="1140" y="360" width="290" height="200" rx="14" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2.5"/>
<text x="1285" y="422" font-size="22" text-anchor="middle" fill="#2B2F36" font-weight="bold">4 질의</text>
<text x="1285" y="464" font-size="19" text-anchor="middle" fill="#2B2F36">시작 노드에서 출발</text>
<text x="1285" y="494" font-size="19" text-anchor="middle" fill="#2B2F36">홉, 술어, 시점, 예산</text>
<text x="1285" y="524" font-size="19" text-anchor="middle" fill="#2B2F36">안정적 간선 ID</text>
<line x1="352" y1="460" x2="418" y2="460" stroke="#555B66" stroke-width="3" marker-end="url(#a)"/>
<line x1="712" y1="460" x2="778" y2="460" stroke="#555B66" stroke-width="3" marker-end="url(#a)"/>
<line x1="1072" y1="460" x2="1138" y2="460" stroke="#555B66" stroke-width="3" marker-end="url(#a)"/>
<text x="750" y="605" font-size="19" text-anchor="middle" fill="#2B2F36">각 단계의 결과는 근거를 따라갈 수 있어야 하고, 잘못된 병합은 되돌릴 수 있어야 한다</text>
</svg>