<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="640" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">여섯 개 프롬프트가 일하는 자리</text>
<rect x="40" y="110" width="450" height="110" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="265.0" y="142.0" text-anchor="middle">G4 추출</text>
<text class="b" x="265.0" y="172.0" text-anchor="middle">인덱스 빌드: 산문에서</text>
<text class="b" x="265.0" y="202.0" text-anchor="middle">엔티티와 관계를 뽑는다</text>
<rect x="525" y="110" width="450" height="110" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="750.0" y="142.0" text-anchor="middle">G5 해소 중재</text>
<text class="b" x="750.0" y="172.0" text-anchor="middle">인덱스 빌드: 후보 묶음을</text>
<text class="b" x="750.0" y="202.0" text-anchor="middle">병합할지 판단한다</text>
<rect x="1010" y="110" width="450" height="110" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="1235.0" y="142.0" text-anchor="middle">G1 그래프 조정</text>
<text class="b" x="1235.0" y="172.0" text-anchor="middle">단계 3¼: 새 노드 만들기가</text>
<text class="b" x="1235.0" y="202.0" text-anchor="middle">기존과 같은지 가린다</text>
<rect x="40" y="330" width="450" height="110" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="265.0" y="362.0" text-anchor="middle">G2 한정 컨텍스트 조립</text>
<text class="b" x="265.0" y="392.0" text-anchor="middle">단계 5: 일꾼에게 줄 부분 그래프를</text>
<text class="b" x="265.0" y="422.0" text-anchor="middle">예산 안에서 직렬화한다</text>
<rect x="525" y="330" width="450" height="110" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="750.0" y="362.0" text-anchor="middle">G6 약속 선언</text>
<text class="b" x="750.0" y="392.0" text-anchor="middle">단계 5: 일꾼이 실행 전에</text>
<text class="b" x="750.0" y="422.0" text-anchor="middle">자기 범위와 예산을 선언한다</text>
<rect x="1010" y="330" width="450" height="110" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="h" x="1235.0" y="362.0" text-anchor="middle">G3 근거 기반 평가자</text>
<text class="b" x="1235.0" y="392.0" text-anchor="middle">단계 6: 그래프에 비춰</text>
<text class="b" x="1235.0" y="422.0" text-anchor="middle">변경을 승인하거나 수정 요구</text>
<line x1="1235" y1="222" x2="1235" y2="328" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="750" y1="222" x2="750" y2="328" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="750.0" y="470.0" text-anchor="middle">위에서 아래로: 색인과 조정이 끝난 그래프에서 컨텍스트가 나오고, 평가자가 결과를 가른다</text>
<text class="s" x="750.0" y="505.0" text-anchor="middle">린트와 불변식 검사는 CI의 관문이고, near와 컨텍스트 조립은 조언일 뿐 빌드를 실패시키지 않는다.</text>
<text class="s" x="750.0" y="540.0" text-anchor="middle">(프롬프트 본문은 옮기지 않았다. 용도와 입출력만 정리했다.)</text>
</svg>
