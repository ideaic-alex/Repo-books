<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="Malgun Gothic, sans-serif">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#555"/></marker></defs>
<rect width="1500" height="760" fill="#fff"/>
<text x="750" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#222">스펙 주도 개발: 스펙이 코드와 테스트를 이끄는 순환 고리</text>

<g font-size="19" text-anchor="middle" fill="#222">
<rect x="25" y="100" width="250" height="190" rx="14" fill="#e3f2fd" stroke="#64b5f6" stroke-width="2"/>
<text x="150" y="135" font-size="22" font-weight="bold">1 요구사항 수집</text>
<text x="150" y="180">AI가 초안을 돕고</text><text x="150" y="208">사람이 검토한다</text>

<rect x="325" y="100" width="250" height="190" rx="14" fill="#fff3e0" stroke="#ffb74d" stroke-width="3"/>
<text x="450" y="135" font-size="22" font-weight="bold">2 스펙 코어</text>
<text x="450" y="175">요구사항 카탈로그</text><text x="450" y="203">엔터티 모델</text><text x="450" y="231">시스템 유스케이스(UC)</text>
<text x="450" y="268" font-size="16" fill="#c25e00">단일 진실의 원천</text>

<rect x="625" y="100" width="250" height="190" rx="14" fill="#e8f5e9" stroke="#81c784" stroke-width="2"/>
<text x="750" y="135" font-size="22" font-weight="bold">3 AI 에이전트 생성</text>
<text x="750" y="175">입력: UC + 요구사항</text><text x="750" y="203">+ 가이드라인 파일</text><text x="750" y="231">+ 스킬·MCP 서버</text>

<rect x="925" y="100" width="250" height="190" rx="14" fill="#f3e5f5" stroke="#ba68c8" stroke-width="2"/>
<text x="1050" y="135" font-size="22" font-weight="bold">4 코드 + 테스트</text>
<text x="1050" y="175">테스트도 같은 UC에서</text><text x="1050" y="203">도출한다</text>

<rect x="1225" y="100" width="250" height="190" rx="14" fill="#ffebee" stroke="#e57373" stroke-width="2"/>
<text x="1350" y="135" font-size="22" font-weight="bold">5 사람 검토</text>
<text x="1350" y="175">스펙을 먼저 보고</text><text x="1350" y="203">코드를 나중에 본다</text>
<text x="1350" y="250" font-size="16" fill="#555">최종 책임은 사람</text>
</g>

<g stroke="#555" stroke-width="3" fill="none" marker-end="url(#a)">
<line x1="275" y1="195" x2="323" y2="195"/><line x1="575" y1="195" x2="623" y2="195"/>
<line x1="875" y1="195" x2="923" y2="195"/><line x1="1175" y1="195" x2="1223" y2="195"/>
<path d="M1350,292 L1350,360 L450,360 L450,294" stroke="#d84315" stroke-dasharray="9 6"/>
</g>
<text x="900" y="350" text-anchor="middle" font-size="19" fill="#d84315" font-weight="bold">규칙이 바뀌면 스펙부터 고치고, 영향받는 부분만 코드에 동기화 (재생성 아님)</text>

<rect x="25" y="410" width="1450" height="120" rx="14" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2"/>
<text x="750" y="445" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">추적성: 모든 변경을 ID로 거슬러 올라간다</text>
<g font-size="19" text-anchor="middle" fill="#222">
<rect x="130" y="468" width="250" height="44" rx="10" fill="#fff" stroke="#999"/><text x="255" y="497">FR · NFR · C 요구사항</text>
<rect x="625" y="468" width="250" height="44" rx="10" fill="#fff" stroke="#999"/><text x="750" y="497">UC 유스케이스</text>
<rect x="1120" y="468" width="250" height="44" rx="10" fill="#fff" stroke="#999"/><text x="1245" y="497">코드 · 테스트</text>
</g>
<g stroke="#777" stroke-width="2.5" marker-end="url(#a)"><line x1="380" y1="490" x2="623" y2="490"/><line x1="875" y1="490" x2="1118" y2="490"/></g>

<g font-size="18" fill="#222">
<text x="40" y="580" font-weight="bold" font-size="20">책의 구성</text>
<text x="40" y="612">1~2장 왜 필요한가, 프로세스와 산출물  |  3~4장 요구사항에서 실행 가능한 스펙까지  |  5~6장 스펙이 코드·테스트를 이끄는 실무</text>
<text x="40" y="644">7장 도구(Kiro, Spec Kit)  |  8장 작업 관리자 사례 10단계  |  9장 팀 규모 확장  |  10장 모범 사례와 함정</text>
</g>
<text x="40" y="710" font-size="16" fill="#777">출처: Simon Martinelli, 『Spec-Driven Development: From Specs to Code with AI Agents』 학습 노트</text>
</svg>
