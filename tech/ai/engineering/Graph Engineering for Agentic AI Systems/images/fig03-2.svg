<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="690" viewBox="0 0 1500 690">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="690" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">네 가지 질문: 이 일에 그래프가 필요한가</text>
<rect x="60" y="110" width="600" height="80" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="360.0" y="142.65" text-anchor="middle">1. 사람이 모든 출력을 읽고 난 뒤에</text>
<text class="b" x="360.0" y="170.65" text-anchor="middle">무언가 행동하는가?</text>
<rect x="60" y="230" width="600" height="80" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="360.0" y="262.65" text-anchor="middle">2. 끝을 사람 아닌 것이 판정할 수 있는가?</text>
<text class="b" x="360.0" y="290.65" text-anchor="middle">(테스트, 스키마, 루브릭, 다른 모델)</text>
<rect x="60" y="350" width="600" height="80" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="360.0" y="382.65" text-anchor="middle">3. 한 에이전트의 컨텍스트와</text>
<text class="b" x="360.0" y="410.65" text-anchor="middle">한 도메인 안에 들어가는가?</text>
<rect x="60" y="470" width="600" height="80" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="360.0" y="502.65" text-anchor="middle">4. 서로 독립적인 가지가</text>
<text class="b" x="360.0" y="530.65" text-anchor="middle">동시에 돌아야 하는가?</text>
<line x1="360" y1="190" x2="360" y2="230" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="b" x="380" y="216" text-anchor="start">아니오</text>
<line x1="360" y1="310" x2="360" y2="350" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="b" x="380" y="336" text-anchor="start">예</text>
<line x1="360" y1="430" x2="360" y2="470" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="b" x="380" y="456" text-anchor="start">아니오</text>
<line x1="660" y1="150" x2="738" y2="150" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="b" x="699" y="140" text-anchor="middle">예</text>
<rect x="740" y="110" width="700" height="80" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="1090.0" y="142.65" text-anchor="middle">예: 프롬프트로 충분하다</text>
<text class="b" x="1090.0" y="170.65" text-anchor="middle">프롬프트, 검색, 도구 설명을 먼저 개선한다</text>
<line x1="660" y1="270" x2="738" y2="270" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="b" x="699" y="260" text-anchor="middle">아니오</text>
<rect x="740" y="230" width="700" height="80" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="b" x="1090.0" y="262.65" text-anchor="middle">아니오: 정지 조건이 없고 예산만 있다</text>
<text class="b" x="1090.0" y="290.65" text-anchor="middle">순환을 만들기 전에 검증기부터 만든다</text>
<line x1="660" y1="390" x2="738" y2="390" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="b" x="699" y="380" text-anchor="middle">예</text>
<rect x="740" y="350" width="700" height="80" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="1090.0" y="382.65" text-anchor="middle">예: 루프를 만든다</text>
<text class="b" x="1090.0" y="410.65" text-anchor="middle">하나의 추론 흐름이 가정을 가장 싸게 일관되게 유지한다</text>
<line x1="660" y1="510" x2="738" y2="475" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="b" x="692" y="480" text-anchor="middle">예</text>
<rect x="740" y="440" width="700" height="70" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="1090.0" y="467.65" text-anchor="middle">예: 그래프 문제다</text>
<text class="b" x="1090.0" y="495.65" text-anchor="middle">노드, 엣지, 공유 상태, 실패 경로를 선언한다</text>
<line x1="660" y1="510" x2="738" y2="565" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="b" x="692" y="560" text-anchor="middle">아니오</text>
<rect x="740" y="530" width="700" height="70" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="1090.0" y="557.65" text-anchor="middle">아니오: 루프의 도구를 먼저 늘린다</text>
<text class="b" x="1090.0" y="585.65" text-anchor="middle">에이전트를 더하기 전에</text>
<text class="s" x="750" y="645" text-anchor="middle">첫 번째 아니오가 대개 정답이다. 이 일, 이번 주에 던지는 질문이지 승급 사다리가 아니다.</text>
</svg>
