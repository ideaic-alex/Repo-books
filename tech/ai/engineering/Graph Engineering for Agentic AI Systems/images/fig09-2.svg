<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" style="font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B2F36"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B5524A"/></marker>
  </defs>
  <rect width="1500" height="640" fill="#FFFFFF"/>
  <text x="750" y="48" text-anchor="middle" font-size="34" font-weight="bold" fill="#2B2F36">오염된 쓰기의 폭발 반경과 차단선</text>
  <text x="750" y="82" text-anchor="middle" font-size="19" fill="#2B2F36">그럴듯하게 틀린 값은 상태를 타고 하류로 번진다</text>

  <rect x="40" y="120" width="190" height="80" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2.5"/>
  <text x="135" y="153" text-anchor="middle" font-size="19" fill="#2B2F36">나쁜 노드</text>
  <text x="135" y="181" text-anchor="middle" font-size="16" fill="#B5524A">그럴듯한 오답 기록</text>

  <rect x="300" y="110" width="380" height="100" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
  <text x="490" y="152" text-anchor="middle" font-size="22" font-weight="bold" fill="#2B2F36">공유 상태 S</text>
  <text x="490" y="184" text-anchor="middle" font-size="16" fill="#2B2F36">모든 하류 노드가 사실로 읽는다</text>

  <rect x="760" y="120" width="160" height="80" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
  <text x="840" y="167" text-anchor="middle" font-size="19" fill="#2B2F36">리뷰 노드</text>
  <rect x="990" y="120" width="160" height="80" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
  <text x="1070" y="167" text-anchor="middle" font-size="19" fill="#2B2F36">환불 노드</text>
  <rect x="1220" y="120" width="240" height="80" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
  <text x="1340" y="153" text-anchor="middle" font-size="19" fill="#2B2F36">외부 세계</text>
  <text x="1340" y="181" text-anchor="middle" font-size="16" fill="#B5524A">결제, 이메일, 병합</text>

  <line x1="230" y1="160" x2="296" y2="160" stroke="#B5524A" stroke-width="3" marker-end="url(#r)"/>
  <line x1="680" y1="160" x2="756" y2="160" stroke="#B5524A" stroke-width="3" marker-end="url(#r)"/>
  <line x1="920" y1="160" x2="986" y2="160" stroke="#B5524A" stroke-width="3" marker-end="url(#r)"/>
  <line x1="1150" y1="160" x2="1216" y2="160" stroke="#B5524A" stroke-width="3" marker-end="url(#r)"/>

  <text x="750" y="272" text-anchor="middle" font-size="22" font-weight="bold" fill="#2B2F36">차단선 다섯 가지</text>

  <rect x="40" y="300" width="270" height="250" rx="12" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
  <text x="175" y="340" text-anchor="middle" font-size="22" font-weight="bold" fill="#2B2F36">없는 도구</text>
  <text x="175" y="385" text-anchor="middle" font-size="16" fill="#2B2F36">노드별로 도구를 묶어</text>
  <text x="175" y="412" text-anchor="middle" font-size="16" fill="#2B2F36">닿을 수 있는 외부</text>
  <text x="175" y="439" text-anchor="middle" font-size="16" fill="#2B2F36">시스템 자체를 줄인다</text>

  <rect x="330" y="300" width="270" height="250" rx="12" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
  <text x="465" y="340" text-anchor="middle" font-size="22" font-weight="bold" fill="#2B2F36">거부하는 스키마</text>
  <text x="465" y="385" text-anchor="middle" font-size="16" fill="#2B2F36">돈, 신원, 도구 인자가</text>
  <text x="465" y="412" text-anchor="middle" font-size="16" fill="#2B2F36">지나는 키는 검증하고</text>
  <text x="465" y="439" text-anchor="middle" font-size="16" fill="#2B2F36">틀린 타입은 거부한다</text>

  <rect x="620" y="300" width="270" height="250" rx="12" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
  <text x="755" y="340" text-anchor="middle" font-size="22" font-weight="bold" fill="#2B2F36">Send 상한</text>
  <text x="755" y="385" text-anchor="middle" font-size="16" fill="#2B2F36">개수, 토큰, 시간에</text>
  <text x="755" y="412" text-anchor="middle" font-size="16" fill="#2B2F36">상한을 두고 n-1개로</text>
  <text x="755" y="439" text-anchor="middle" font-size="16" fill="#2B2F36">병합하고 진행한다</text>

  <rect x="910" y="300" width="270" height="250" rx="12" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
  <text x="1045" y="340" text-anchor="middle" font-size="22" font-weight="bold" fill="#2B2F36">서킷 브레이커</text>
  <text x="1045" y="385" text-anchor="middle" font-size="16" fill="#2B2F36">죽은 도구는 차단하고</text>
  <text x="1045" y="412" text-anchor="middle" font-size="16" fill="#2B2F36">백오프와 지터로</text>
  <text x="1045" y="439" text-anchor="middle" font-size="16" fill="#2B2F36">재시도 폭풍을 막는다</text>

  <rect x="1200" y="300" width="260" height="250" rx="12" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
  <text x="1330" y="340" text-anchor="middle" font-size="22" font-weight="bold" fill="#2B2F36">격리 포크</text>
  <text x="1330" y="385" text-anchor="middle" font-size="16" fill="#2B2F36">오염 이전 체크포인트에서</text>
  <text x="1330" y="412" text-anchor="middle" font-size="16" fill="#2B2F36">분기해 깨끗한 상태로</text>
  <text x="1330" y="439" text-anchor="middle" font-size="16" fill="#2B2F36">이어 간다</text>

  <text x="750" y="600" text-anchor="middle" font-size="19" fill="#2B2F36">킬 스위치는 배포 없이 켜져야 하고, 새 스레드 생성과 자동 재개를 함께 멈춘다</text>
</svg>
