<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="700" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">여섯 신호로 점수 매기기: 루프로 충분한가</text>
<rect x="40" y="90" width="240" height="50" rx="10" fill="#F2F3F5" stroke="#7A808C" stroke-width="2"/>
<text class="h" x="160.0" y="126" text-anchor="middle">신호</text>
<rect x="300" y="90" width="550" height="50" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="575.0" y="126" text-anchor="middle">루프로 충분(왼쪽)</text>
<rect x="870" y="90" width="590" height="50" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="1165.0" y="126" text-anchor="middle">그래프를 고려(오른쪽)</text>
<rect x="40" y="156" width="240" height="62" rx="10" fill="#F2F3F5" stroke="#7A808C" stroke-width="2"/>
<text class="b" x="160.0" y="192" text-anchor="middle">형태</text>
<rect x="300" y="156" width="550" height="62" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="575.0" y="192" text-anchor="middle">기계가 볼 수 있는 결승선이 있는 한 가지 일</text>
<rect x="870" y="156" width="590" height="62" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="1165.0" y="192" text-anchor="middle">도구·실패 방식·완료 기준이 다른 전문 영역</text>
<rect x="40" y="234" width="240" height="62" rx="10" fill="#F2F3F5" stroke="#7A808C" stroke-width="2"/>
<text class="b" x="160.0" y="270" text-anchor="middle">병렬성</text>
<rect x="300" y="234" width="550" height="62" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="575.0" y="270" text-anchor="middle">순차 작업</text>
<rect x="870" y="234" width="590" height="62" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="1165.0" y="270" text-anchor="middle">독립 소스를 팬아웃한 뒤 합류</text>
<rect x="40" y="312" width="240" height="62" rx="10" fill="#F2F3F5" stroke="#7A808C" stroke-width="2"/>
<text class="b" x="160.0" y="348" text-anchor="middle">도구</text>
<rect x="300" y="312" width="550" height="62" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="575.0" y="348" text-anchor="middle">처음부터 끝까지 같은 도구와 모델</text>
<rect x="870" y="312" width="590" height="62" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="1165.0" y="348" text-anchor="middle">단계마다 모델·도구가 달라 목록이 거짓이 됨</text>
<rect x="40" y="390" width="240" height="62" rx="10" fill="#F2F3F5" stroke="#7A808C" stroke-width="2"/>
<text class="b" x="160.0" y="426" text-anchor="middle">통제</text>
<rect x="300" y="390" width="550" height="62" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="575.0" y="426" text-anchor="middle">에이전트가 자유롭게 움직여도 안전</text>
<rect x="870" y="390" width="590" height="62" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="1165.0" y="426" text-anchor="middle">경로가 허용 목록이어야 함(분류 후 환불)</text>
<rect x="40" y="468" width="240" height="62" rx="10" fill="#F2F3F5" stroke="#7A808C" stroke-width="2"/>
<text class="b" x="160.0" y="504" text-anchor="middle">실패 격리</text>
<rect x="300" y="468" width="550" height="62" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="575.0" y="504" text-anchor="middle">나쁜 단계는 재시도로 충분</text>
<rect x="870" y="468" width="590" height="62" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="1165.0" y="504" text-anchor="middle">쓰기 집합이 실제로 다를 때만 격리</text>
<rect x="40" y="546" width="240" height="62" rx="10" fill="#F2F3F5" stroke="#7A808C" stroke-width="2"/>
<text class="b" x="160.0" y="582" text-anchor="middle">검증자</text>
<rect x="300" y="546" width="550" height="62" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="575.0" y="582" text-anchor="middle">루프 안의 테스트·스키마·루브릭</text>
<rect x="870" y="546" width="590" height="62" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="1165.0" y="582" text-anchor="middle">작성자와 컨텍스트를 나눈 독립 검증자</text>
<text class="s" x="750" y="660" text-anchor="middle">왼쪽 4개 이상이면 루프 유지. 오른쪽 4개 이상이어도 저장소가 아니라 냅킨 스케치까지만 허가된다.</text>
<text class="s" x="750" y="686" text-anchor="middle">일곱 번째 신호는 일의 성질이 아니라 팀의 능력이다: 추적, 지출 상한, 재개, 버전 관리를 운영할 수 있는가.</text>
</svg>
