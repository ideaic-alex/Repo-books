<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="700" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">머리말: 네 추천인이 공통으로 짚는 것</text>
<rect x="500" y="270" width="500" height="150" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="750.0" y="317.65" text-anchor="middle">그래프 엔지니어링</text>
<text class="b" x="750.0" y="351.65" text-anchor="middle">선언된 토폴로지를 직접 소유하는 일</text>
<text class="b" x="750.0" y="385.65" text-anchor="middle">노드 · 합법적 엣지 · 공유 상태 · 게이트</text>
<rect x="40" y="100" width="420" height="160" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="250.0" y="136" text-anchor="middle">Yale Li (WDTA)</text>
<text class="b" x="250.0" y="172" text-anchor="middle">허용된 경로와 승인 게이트를</text>
<text class="b" x="250.0" y="200" text-anchor="middle">선언하고 검증할 수 있어야</text>
<text class="b" x="250.0" y="228" text-anchor="middle">감사하고 개선할 수 있다</text>
<rect x="1040" y="100" width="420" height="160" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="1250.0" y="136" text-anchor="middle">Matthew Versaggi</text>
<text class="b" x="1250.0" y="172" text-anchor="middle">데모와 운영 가능한 시스템의 차이는</text>
<text class="b" x="1250.0" y="200" text-anchor="middle">토폴로지를 소유했는가에 있다</text>
<text class="b" x="1250.0" y="228" text-anchor="middle">도달 가능성과 사람 게이트가 통제면</text>
<rect x="40" y="470" width="420" height="160" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="250.0" y="506" text-anchor="middle">Iftach Orr (Alice)</text>
<text class="b" x="250.0" y="542" text-anchor="middle">엣지는 타입 있는 산출물의 계약</text>
<text class="b" x="250.0" y="570" text-anchor="middle">노드마다 신원과 권한이 따로</text>
<text class="b" x="250.0" y="598" text-anchor="middle">스킬과 MCP 서버는 공격면이 된다</text>
<rect x="1040" y="470" width="420" height="160" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="1250.0" y="506" text-anchor="middle">Melan Xu (WDTA)</text>
<text class="b" x="1250.0" y="542" text-anchor="middle">보안과 거버넌스는 설계 안에 둔다</text>
<text class="b" x="1250.0" y="570" text-anchor="middle">세 종류의 그래프를 구분해</text>
<text class="b" x="1250.0" y="598" text-anchor="middle">설계 리뷰의 범주 오류를 막는다</text>
<line x1="460" y1="240" x2="520" y2="290" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1040" y1="240" x2="980" y2="290" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="460" y1="490" x2="520" y2="400" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1040" y1="490" x2="980" y2="400" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="750" y="670" text-anchor="middle">공통 결론: 그래프를 그리고, 버전 관리하고, 운영하라. 모든 일이 다중 노드 그래프를 요구하지는 않는다.</text>
</svg>
