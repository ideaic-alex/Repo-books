<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" style="font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B2F36"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B5524A"/></marker>
  </defs>
  <rect width="1500" height="640" fill="#FFFFFF"/>
  <text x="750" y="48" text-anchor="middle" font-size="34" font-weight="bold" fill="#2B2F36">재개는 노드를 처음부터 다시 실행한다</text>
  <text x="750" y="82" text-anchor="middle" font-size="19" fill="#2B2F36">부수 효과를 인터럽트 앞에 두느냐, 뒤의 별도 노드로 빼느냐의 차이</text>

  <rect x="40" y="110" width="660" height="500" rx="14" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
  <text x="370" y="148" text-anchor="middle" font-size="22" font-weight="bold" fill="#2B2F36">나쁜 배치: 한 노드 안에 섞음</text>

  <rect x="110" y="180" width="520" height="70" rx="10" fill="#FFFFFF" stroke="#B5524A" stroke-width="2"/>
  <text x="370" y="222" text-anchor="middle" font-size="19" fill="#2B2F36">1) 카드 청구 (부수 효과)</text>
  <rect x="110" y="300" width="520" height="70" rx="10" fill="#FFFFFF" stroke="#B5524A" stroke-width="2"/>
  <text x="370" y="342" text-anchor="middle" font-size="19" fill="#2B2F36">2) interrupt: 사람의 승인 대기</text>
  <rect x="110" y="420" width="520" height="70" rx="10" fill="#FFFFFF" stroke="#B5524A" stroke-width="2"/>
  <text x="370" y="462" text-anchor="middle" font-size="19" fill="#2B2F36">3) 승인 값을 받아 계속</text>
  <line x1="370" y1="250" x2="370" y2="296" stroke="#2B2F36" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="370" y1="370" x2="370" y2="416" stroke="#2B2F36" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M630,455 C690,455 690,215 636,215" fill="none" stroke="#B5524A" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#r)"/>
  <text x="400" y="535" text-anchor="middle" font-size="19" fill="#B5524A">재개하면 1번부터 다시 실행</text>
  <text x="370" y="570" text-anchor="middle" font-size="19" fill="#B5524A">승인할 때마다 이중 청구가 일어난다</text>

  <rect x="800" y="110" width="660" height="500" rx="14" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
  <text x="1130" y="148" text-anchor="middle" font-size="22" font-weight="bold" fill="#2B2F36">좋은 배치: 대기와 실행을 분리</text>

  <rect x="860" y="180" width="540" height="70" rx="10" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="2"/>
  <text x="1130" y="222" text-anchor="middle" font-size="19" fill="#2B2F36">게이트 노드: 순수한 일시 정지</text>
  <rect x="860" y="300" width="540" height="70" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
  <text x="1130" y="342" text-anchor="middle" font-size="19" fill="#2B2F36">체크포인트 저장 (다음 슈퍼 스텝)</text>
  <rect x="860" y="420" width="540" height="70" rx="10" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="2"/>
  <text x="1130" y="462" text-anchor="middle" font-size="19" fill="#2B2F36">적용 노드: 멱등 키로 한 번만 실행</text>
  <line x1="1130" y1="250" x2="1130" y2="296" stroke="#2B2F36" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1130" y1="370" x2="1130" y2="416" stroke="#2B2F36" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1130" y="535" text-anchor="middle" font-size="19" fill="#3C8D5A">실행한 사실을 상태에 남기고, 재생 시 건너뛴다</text>
  <text x="1130" y="570" text-anchor="middle" font-size="19" fill="#3C8D5A">같은 단계를 두 번 받아도 세상은 한 번만 바뀐다</text>
</svg>
