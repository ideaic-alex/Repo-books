<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="720" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">루프는 노드 하나짜리 실행 그래프다</text>
<rect x="40" y="100" width="620" height="400" rx="14" fill="none" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="350" y="140" text-anchor="middle">노드 하나: 루프</text>
<circle cx="260" cy="320" r="60" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="260" y="326.65" text-anchor="middle">v</text>
<path d="M 225 270 C 170 180, 350 180, 295 270" fill="none" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="b" x="260" y="200" text-anchor="middle">자기 엣지 (v, v)</text>
<line x1="322" y1="320" x2="430" y2="320" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="432" y="285" width="190" height="70" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="527.0" y="313.65" text-anchor="middle">정지 엣지</text>
<text class="b" x="527.0" y="339.65" text-anchor="middle">END로 흡수</text>
<text class="b" x="350" y="410" text-anchor="middle">S = 루프의 스크래치패드</text>
<text class="b" x="350" y="442" text-anchor="middle">T = 반복 횟수(한 노드의 시계)</text>
<text class="b" x="350" y="474" text-anchor="middle">런이 고를 수 있는 것: 다시 실행 또는 정지</text>
<rect x="700" y="100" width="760" height="400" rx="14" fill="none" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="1080" y="140" text-anchor="middle">팬아웃 후 팬인: 루프가 될 수 없는 모양</text>
<rect x="720" y="270" width="110" height="70" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="775.0" y="311.65" text-anchor="middle">PR 입력</text>
<rect x="880" y="190" width="150" height="52" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="955.0" y="222.65" text-anchor="middle">보안 검토</text>
<line x1="830" y1="305" x2="878" y2="216" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1030" y1="216" x2="1088" y2="305" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="880" y="279" width="150" height="52" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="955.0" y="311.65" text-anchor="middle">성능 검토</text>
<line x1="830" y1="305" x2="878" y2="305" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1030" y1="305" x2="1088" y2="305" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="880" y="368" width="150" height="52" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="955.0" y="400.65" text-anchor="middle">테스트 검토</text>
<line x1="830" y1="305" x2="878" y2="394" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1030" y1="394" x2="1088" y2="305" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1090" y="270" width="130" height="70" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="1155.0" y="311.65" text-anchor="middle">결과 종합</text>
<line x1="1220" y1="305" x2="1268" y2="305" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1270" y="270" width="170" height="70" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="1355.0" y="311.65" text-anchor="middle">사람 확인</text>
<text class="b" x="1080" y="430" text-anchor="middle">같은 슈퍼스텝에 준비된 노드가 둘 이상이면 팬아웃이다</text>
<text class="b" x="1080" y="462" text-anchor="middle">루프가 병렬을 흉내 내면 숨은 3노드 그래프다</text>
<text class="b" x="1080" y="494" text-anchor="middle">숨은 그래프도 선언해서 버전 관리해야 한다</text>
<rect x="60" y="535" width="1380" height="150" rx="14" fill="none" stroke="#B8862B" stroke-width="2" stroke-dasharray="10 7"/>
<text class="h" x="100" y="572" text-anchor="start">포함 관계: 그래프가 루프를 품는다 (그래프 ⊃ 루프)</text>
<circle cx="135" cy="637" r="38" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="135" y="643.65" text-anchor="middle">루프</text>
<text class="b" x="200" y="625" text-anchor="start">팬아웃은 처리량을 늘릴 뿐 판단력을 늘리지 않는다.</text>
<text class="b" x="200" y="660" text-anchor="start">같은 모델의 리뷰어 셋은 한 의견의 세 배 복제다. 하나는 테스트, 다른 모델, 사람이어야 한다.</text>
</svg>
