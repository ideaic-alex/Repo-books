<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="700" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">루프와 그래프: 경로를 누가 정하는가</text>
<rect x="40" y="100" width="620" height="470" rx="14" fill="none" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="350" y="140" text-anchor="middle">루프 (노드 하나와 자기 엣지)</text>
<circle cx="250" cy="300" r="60" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="250" y="306.65" text-anchor="middle">에이전트</text>
<path d="M 215 250 C 160 160, 340 160, 285 250" fill="none" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="b" x="250" y="205" text-anchor="middle">반복</text>
<line x1="312" y1="300" x2="430" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="432" y="265" width="190" height="70" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="527.0" y="293.65" text-anchor="middle">종료</text>
<text class="b" x="527.0" y="319.65" text-anchor="middle">(검증 통과)</text>
<text class="b" x="350" y="410" text-anchor="middle">목표와 기준만 정한다</text>
<text class="b" x="350" y="442" text-anchor="middle">경로는 에이전트가 고른다</text>
<text class="b" x="350" y="474" text-anchor="middle">한 번에 한 가지 일만 한다</text>
<text class="b" x="350" y="506" text-anchor="middle">순차, 재시도, 수정은 노드 안에서</text>
<rect x="700" y="100" width="760" height="470" rx="14" fill="none" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="1080" y="140" text-anchor="middle">그래프 (허용된 경로를 선언)</text>
<rect x="720" y="250" width="110" height="80" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="775.0" y="296.65" text-anchor="middle">분류</text>
<rect x="880" y="180" width="140" height="56" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="950.0" y="214.65" text-anchor="middle">조사 A</text>
<line x1="830" y1="290" x2="878" y2="208" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1020" y1="208" x2="1068" y2="290" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="880" y="262" width="140" height="56" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="950.0" y="296.65" text-anchor="middle">조사 B</text>
<line x1="830" y1="290" x2="878" y2="290" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1020" y1="290" x2="1068" y2="290" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="880" y="344" width="140" height="56" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="950.0" y="378.65" text-anchor="middle">조사 C</text>
<line x1="830" y1="290" x2="878" y2="372" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1020" y1="372" x2="1068" y2="290" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1070" y="250" width="110" height="80" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="1125.0" y="296.65" text-anchor="middle">종합</text>
<line x1="1180" y1="290" x2="1218" y2="290" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1220" y="250" width="220" height="80" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="1330.0" y="283.65" text-anchor="middle">사람 승인</text>
<text class="b" x="1330.0" y="309.65" text-anchor="middle">후 환불 실행</text>
<text class="b" x="1080" y="440" text-anchor="middle">허용된 경로를 엣지로 선언한다</text>
<text class="b" x="1080" y="472" text-anchor="middle">자유는 각 노드 안에 남는다</text>
<text class="b" x="1080" y="504" text-anchor="middle">팬아웃 후 조인은 루프가 못 하는 동작</text>
<text class="b" x="1080" y="536" text-anchor="middle">비용은 채팅 대비 약 15배 토큰(책이 인용)</text>
<rect x="40" y="600" width="1420" height="70" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="750.0" y="641.65" text-anchor="middle">루프는 노드가 하나뿐인 그래프다. 그래프가 루프를 대체하는 것이 아니라 루프를 품는다.</text>
</svg>
