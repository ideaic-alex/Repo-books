<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="580" viewBox="0 0 1500 580">
  <style>
    text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
    .t{font-size:34px;font-weight:700}
    .h{font-size:21px;font-weight:700}
    .b{font-size:17px}
    .s{font-size:16px;fill:#666}
  </style>
  <rect width="1500" height="580" fill="#FFFFFF"/>
  <text class="t" x="750" y="62" text-anchor="middle">ChatGPT 출시 전후의 흐름 (2022~2023)</text>

  <rect x="30" y="110" width="220" height="200" rx="12" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
  <text class="h" x="140" y="146" text-anchor="middle">2022.10</text>
  <text class="b" x="140" y="184" text-anchor="middle">몬터레이 오프사이트</text>
  <text class="b" x="140" y="212" text-anchor="middle">직원 약 300명</text>
  <text class="b" x="140" y="240" text-anchor="middle">(전년엔 200명 미만)</text>

  <rect x="274" y="110" width="220" height="200" rx="12" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
  <text class="h" x="384" y="146" text-anchor="middle">2022.11 초</text>
  <text class="b" x="384" y="184" text-anchor="middle">앤스로픽 챗봇 소문</text>
  <text class="b" x="384" y="212" text-anchor="middle">GPT-3.5 기반으로</text>
  <text class="b" x="384" y="240" text-anchor="middle">2주 뒤 출시 결정</text>

  <rect x="518" y="110" width="220" height="200" rx="12" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
  <text class="h" x="628" y="146" text-anchor="middle">2022.11.30</text>
  <text class="b" x="628" y="184" text-anchor="middle">ChatGPT 공개</text>
  <text class="b" x="628" y="212" text-anchor="middle">'저강도 연구 프리뷰'</text>
  <text class="b" x="628" y="240" text-anchor="middle">서버 10만 명분 준비</text>

  <rect x="762" y="110" width="220" height="200" rx="12" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
  <text class="h" x="872" y="146" text-anchor="middle">5일 / 2개월</text>
  <text class="b" x="872" y="184" text-anchor="middle">사용자 100만 명</text>
  <text class="b" x="872" y="212" text-anchor="middle">두 달 만에 1억 명</text>
  <text class="b" x="872" y="240" text-anchor="middle">GPU와 서버 비상</text>

  <rect x="1006" y="110" width="220" height="200" rx="12" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
  <text class="h" x="1116" y="146" text-anchor="middle">2023.2~3</text>
  <text class="b" x="1116" y="184" text-anchor="middle">유료 ChatGPT, API,</text>
  <text class="b" x="1116" y="212" text-anchor="middle">Whisper API, GPT-4</text>
  <text class="b" x="1116" y="240" text-anchor="middle">연이어 출시</text>

  <rect x="1250" y="110" width="220" height="200" rx="12" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
  <text class="h" x="1360" y="146" text-anchor="middle">2023 한 해</text>
  <text class="b" x="1360" y="184" text-anchor="middle">채용 상한 초과</text>
  <text class="b" x="1360" y="212" text-anchor="middle">신뢰안전팀 해체</text>
  <text class="b" x="1360" y="240" text-anchor="middle">조직 긴장 고조</text>

  <path d="M250 210 L274 210 M494 210 L518 210 M738 210 L762 210 M982 210 L1006 210 M1226 210 L1250 210" stroke="#4A5260" stroke-width="3" fill="none"/>

  <rect x="30" y="360" width="1440" height="180" rx="14" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
  <text class="h" x="60" y="400">직원들이 가장 놀란 점</text>
  <text class="b" x="60" y="438">· GPT-3.5는 이미 개발자에게 공개돼 있었고 GPT-3보다 능력이 크게 오른 것도 아니었다.</text>
  <text class="b" x="60" y="470">· 달라진 것은 대화형 화면이었는데, 그것만으로 전 세계가 반응했다.</text>
  <text class="b" x="60" y="502">· 올트먼은 인기를 예상했지만 실제보다 약 10분의 1 규모로 봤다고 말했다.</text>
</svg>
