  <text class="s" x="902" y="230" text-anchor="middle">보고 기준으로 채택</text>
  <line x1="1015" y1="190" x2="1033" y2="190" stroke="#4A5260" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="1036" y="110" width="220" height="160" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
  <text class="h" x="1146" y="155" text-anchor="middle">2023 말</text>
  <text class="b" x="1146" y="195" text-anchor="middle">EU AI법</text>
  <text class="s" x="1146" y="230" text-anchor="middle">기준 10의 25제곱</text>
  <line x1="1259" y1="190" x2="1277" y2="190" stroke="#4A5260" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="1280" y="110" width="220" height="160" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
