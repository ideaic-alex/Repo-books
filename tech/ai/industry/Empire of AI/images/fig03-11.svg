  <text class="s" x="1390" y="230" text-anchor="middle">10의 26제곱, 거부됨</text>
  <rect x="60" y="360" width="700" height="130" rx="10" fill="#F6E6E6" stroke="#B04A4A" stroke-width="2"/>
  <text class="h" x="410" y="398" text-anchor="middle">닫힌 쪽 (Closed)</text>
