<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="580" viewBox="0 0 1560 580">
  <style>
    text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
    .t{font-size:32px;font-weight:700}
    .h{font-size:21px;font-weight:700}
    .b{font-size:18px}
    .s{font-size:16px;fill:#666}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5260"/></marker></defs>
  <rect width="1560" height="580" fill="#FFFFFF"/>
  <text class="t" x="780" y="62" text-anchor="middle">계산량 기준이 정책이 되기까지 (13장)</text>
  <rect x="60" y="110" width="220" height="160" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
  <text class="h" x="170" y="155" text-anchor="middle">2022.10</text>
  <text class="b" x="170" y="195" text-anchor="middle">AI 칩 수출통제</text>
  <text class="s" x="170" y="230" text-anchor="middle">미 상무부, 대중국</text>
  <line x1="283" y1="190" x2="301" y2="190" stroke="#4A5260" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="304" y="110" width="220" height="160" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
  <text class="h" x="414" y="155" text-anchor="middle">2023.5</text>
