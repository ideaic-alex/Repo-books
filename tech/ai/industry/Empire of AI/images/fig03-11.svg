  <text class="s" x="414" y="230" text-anchor="middle">허가제·감사 제안</text>
  <line x1="527" y1="190" x2="545" y2="190" stroke="#4A5260" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="548" y="110" width="220" height="160" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
