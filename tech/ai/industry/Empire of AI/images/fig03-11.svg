  <text class="b" x="658" y="195" text-anchor="middle">프런티어 백서</text>
  <text class="s" x="658" y="230" text-anchor="middle">기준 10의 26제곱</text>
  <line x1="771" y1="190" x2="789" y2="190" stroke="#4A5260" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="792" y="110" width="220" height="160" rx="10" fill="#F6E6E6" stroke="#B04A4A" stroke-width="2"/>
