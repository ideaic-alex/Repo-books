<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <style>
    text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
    .t{font-size:32px;font-weight:700}
    .h{font-size:21px;font-weight:700}
    .b{font-size:18px}
    .s{font-size:15px;fill:#666}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5260"/></marker></defs>
  <rect width="1500" height="760" fill="#FFFFFF"/>
  <text class="t" x="750.0" y="56" text-anchor="middle">2023년 가을, 이사회로 이어진 대화 8번</text>
  <rect x="50" y="100" width="170" height="62" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text class="h" x="135.0" y="138" text-anchor="middle">9월 29일</text>
  <rect x="240" y="100" width="270" height="62" rx="8" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
  <text class="h" x="375.0" y="138" text-anchor="middle">무라티 - 토너</text>
  <rect x="530" y="100" width="920" height="62" rx="8" fill="#FFFFFF" stroke="#3E8A5A" stroke-width="2"/>
  <text class="b" x="544" y="136" text-anchor="start">커피 만남. 올트먼이 너무 빨리 출시하라고 밀어붙여 걱정이라고 전함</text>
  <rect x="50" y="176" width="170" height="62" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text class="h" x="135.0" y="214" text-anchor="middle">10월 4일</text>
  <rect x="240" y="176" width="270" height="62" rx="8" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
  <text class="h" x="375.0" y="214" text-anchor="middle">수츠케버 - 토너</text>
  <rect x="530" y="176" width="920" height="62" rx="8" fill="#FFFFFF" stroke="#3B6EA8" stroke-width="2"/>
  <text class="b" x="544" y="212" text-anchor="start">첫 통화. 극도로 긴장해 "직접 답하기 망설여진다"며 운만 뗌</text>
  <rect x="50" y="252" width="170" height="62" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text class="h" x="135.0" y="290" text-anchor="middle">10월 15일</text>
  <rect x="240" y="252" width="270" height="62" rx="8" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
  <text class="h" x="375.0" y="290" text-anchor="middle">무라티 - 토너</text>
  <rect x="530" y="252" width="920" height="62" rx="8" fill="#FFFFFF" stroke="#3E8A5A" stroke-width="2"/>
  <text class="b" x="544" y="288" text-anchor="start">올트먼 측근을 7번째 이사로 들이지 말라고 당부</text>
  <rect x="50" y="328" width="170" height="62" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text class="h" x="135.0" y="366" text-anchor="middle">10월 16일</text>
  <rect x="240" y="328" width="270" height="62" rx="8" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
  <text class="h" x="375.0" y="366" text-anchor="middle">수츠케버 - 토너</text>
  <rect x="530" y="328" width="920" height="62" rx="8" fill="#FFFFFF" stroke="#3B6EA8" stroke-width="2"/>
  <text class="b" x="544" y="364" text-anchor="start">문제의 뿌리는 올트먼이라고 말하고, "플랜 B"를 암시</text>
  <rect x="50" y="404" width="170" height="62" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text class="h" x="135.0" y="442" text-anchor="middle">10월 20일</text>
  <rect x="240" y="404" width="270" height="62" rx="8" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
  <text class="h" x="375.0" y="442" text-anchor="middle">무라티 - 토너</text>
  <rect x="530" y="404" width="920" height="62" rx="8" fill="#FFFFFF" stroke="#3E8A5A" stroke-width="2"/>
  <text class="b" x="544" y="440" text-anchor="start">마이크로소프트·파코츠키 사례 설명, 기록을 남기는 중이라고 밝힘</text>
  <rect x="50" y="480" width="170" height="62" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text class="h" x="135.0" y="518" text-anchor="middle">10월 23일</text>
  <rect x="240" y="480" width="270" height="62" rx="8" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
  <text class="h" x="375.0" y="518" text-anchor="middle">수츠케버 - 토너</text>
  <rect x="530" y="480" width="920" height="62" rx="8" fill="#FFFFFF" stroke="#3B6EA8" stroke-width="2"/>
  <text class="b" x="544" y="516" text-anchor="start">올트먼 대신 무라티를 임시 CEO로 세우자고 제안</text>
  <rect x="50" y="556" width="170" height="62" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text class="h" x="135.0" y="594" text-anchor="middle">10월 25일</text>
  <rect x="240" y="556" width="270" height="62" rx="8" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
  <text class="h" x="375.0" y="594" text-anchor="middle">올트먼 - 토너</text>
  <rect x="530" y="556" width="920" height="62" rx="8" fill="#FFFFFF" stroke="#B8862B" stroke-width="2"/>
  <text class="b" x="544" y="592" text-anchor="start">15분 통화. 토너가 공저한 논문이 문제라고 항의</text>
  <rect x="50" y="632" width="170" height="62" rx="8" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text class="h" x="135.0" y="670" text-anchor="middle">10월 26일</text>
  <rect x="240" y="632" width="270" height="62" rx="8" fill="#F9E6E4" stroke="#B5483E" stroke-width="2"/>
  <text class="h" x="375.0" y="670" text-anchor="middle">수츠케버 - 맥콜리</text>
  <rect x="530" y="632" width="920" height="62" rx="8" fill="#FFFFFF" stroke="#B5483E" stroke-width="2"/>
  <text class="b" x="544" y="668" text-anchor="start">"맥콜리가 토너는 나가야 한다고 했다"는 올트먼 말이 거짓임을 확인</text>
  <text class="s" x="750" y="730" text-anchor="middle">초록=무라티, 파랑=수츠케버, 노랑=올트먼 본인, 빨강=거짓말이 드러난 순간</text>
</svg>
