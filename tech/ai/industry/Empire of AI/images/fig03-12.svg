  <text class="s" x="1222" y="270" text-anchor="middle">사전에 사과 메일</text>
  <line x1="1323" y1="230" x2="1337" y2="230" stroke="#4A5260" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="1340" y="150" width="195" height="160" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
  <text class="h" x="1437" y="195" text-anchor="middle">2025.1</text>
  <text class="b" x="1437" y="235" text-anchor="middle">소송 제기</text>
  <text class="s" x="1437" y="270" text-anchor="middle">가족은 강하게 부인</text>
  <text class="s" x="800" y="360" text-anchor="middle">학대 주장은 가족이 부인하며, 저자도 어린 시절 주장은 알 수 없다고 밝힌다</text>
</svg>
