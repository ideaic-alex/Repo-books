  <line x1="1170" y1="259" x2="1170" y2="290" stroke="#9AA1AB" stroke-width="2"/>
  <rect x="1285" y="290" width="190" height="150" rx="10" fill="#F8E6E3" stroke="#B5473A" stroke-width="2"/>
  <text class="b" x="1380.0" y="344.72" text-anchor="middle">Anthropic</text>
  <text class="b" x="1380.0" y="370.72" text-anchor="middle">공익법인</text>
  <text class="b" x="1380.0" y="396.72" text-anchor="middle">설립 발표</text>
  <circle cx="1380" cy="250" r="9" fill="#B5473A"/>
  <text class="h" x="1380" y="215" text-anchor="middle">2021.5</text>
  <line x1="1380" y1="259" x2="1380" y2="290" stroke="#9AA1AB" stroke-width="2"/>
  <rect x="60" y="490" width="1380" height="90" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
  <text class="h" x="750.0" y="528.98" text-anchor="middle">같은 시기의 굵직한 변화</text>
  <text class="b" x="750.0" y="557.94" text-anchor="middle">Applied 부서 신설(2020.1부터), 로보틱스 팀 해체(2020 늦여름), MS 추가 투자 협상(이익 상한 6배)이 겹쳤다</text>
