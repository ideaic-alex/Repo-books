  <line x1="330" y1="259" x2="330" y2="290" stroke="#9AA1AB" stroke-width="2"/>
  <rect x="445" y="290" width="190" height="150" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
  <text class="b" x="540.0" y="344.72" text-anchor="middle">브록먼이</text>
