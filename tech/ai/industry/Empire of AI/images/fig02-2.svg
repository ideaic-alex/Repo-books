  <line x1="750" y1="259" x2="750" y2="290" stroke="#9AA1AB" stroke-width="2"/>
  <rect x="865" y="290" width="190" height="150" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
