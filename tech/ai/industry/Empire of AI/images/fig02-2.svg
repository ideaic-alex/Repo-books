<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <style>
    text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
    .t{font-size:34px;font-weight:700}
    .h{font-size:22px;font-weight:700}
    .b{font-size:19px}
    .s{font-size:16px;fill:#666}
  </style>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4A5260"/></marker></defs>
  <rect width="1500" height="620" fill="#FFFFFF"/>
  <text class="t" x="750.0" y="62" text-anchor="middle">6장 연표: 올트먼의 OpenAI 전임에서 Anthropic 창업까지</text>
  <line x1="40" y1="250" x2="1460" y2="250" stroke="#9AA1AB" stroke-width="4"/>
  <rect x="25" y="290" width="190" height="150" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
