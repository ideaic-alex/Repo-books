<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540">
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#555"/></marker></defs>
<rect width="1500" height="540" fill="#FFFFFF"/>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#222}</style>
<text x="750" y="58" font-size="34" font-weight="bold" text-anchor="middle">포트폴리오 4단계 전략</text>
<rect x="40" y="130" width="320" height="170" rx="10" fill="#E8F0F9" stroke="#3A6EA5" stroke-width="2.5"/>
<text x="200.0" y="177.0" font-size="22" font-weight="bold" text-anchor="middle">1단계 프레임워크</text>
<text x="200.0" y="207.0" font-size="20"  text-anchor="middle">섹션 구분</text>
<text x="200.0" y="237.0" font-size="20"  text-anchor="middle">고유 이름 부여</text>
<text x="200.0" y="267.0" font-size="20"  text-anchor="middle">기능은 아직 없음</text>
<rect x="410" y="130" width="320" height="170" rx="10" fill="#E6F4EA" stroke="#3C8D55" stroke-width="2.5"/>
<text x="570.0" y="192.0" font-size="22" font-weight="bold" text-anchor="middle">2단계 기능</text>
<text x="570.0" y="222.0" font-size="20"  text-anchor="middle">실제 경력과 성과</text>
<text x="570.0" y="252.0" font-size="20"  text-anchor="middle">사례 데이터 입력</text>
<rect x="780" y="130" width="320" height="170" rx="10" fill="#FFF3E0" stroke="#D98324" stroke-width="2.5"/>
<text x="940.0" y="192.0" font-size="22" font-weight="bold" text-anchor="middle">3단계 디자인</text>
<text x="940.0" y="222.0" font-size="20"  text-anchor="middle">참고 자료 제시</text>
<text x="940.0" y="252.0" font-size="20"  text-anchor="middle">WordPress 테마 활용</text>
<rect x="1150" y="130" width="310" height="170" rx="10" fill="#F3E5F5" stroke="#8E4A9E" stroke-width="2.5"/>
<text x="1305.0" y="192.0" font-size="22" font-weight="bold" text-anchor="middle">4단계 검증</text>
<text x="1305.0" y="222.0" font-size="20"  text-anchor="middle">PRD 대조, 링크 점검</text>
<text x="1305.0" y="252.0" font-size="20"  text-anchor="middle">발견된 문제 수정</text>
<rect x="40" y="380" width="1420" height="100" rx="10" fill="#FDECEA" stroke="#C0453A" stroke-width="2.5"/>
<text x="750.0" y="422.0" font-size="22" font-weight="bold" text-anchor="middle">모든 단계에서 반복되는 짧은 순환</text>
<text x="750.0" y="452.0" font-size="20"  text-anchor="middle">요청, 생성, 검토, 수정을 거듭하며 결과를 다듬는다</text>
