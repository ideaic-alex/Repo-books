    <text x="910" y="244">클라이언트</text>
    <text x="910" y="272">(요청하는 쪽)</text>
    <rect x="1180" y="170" width="260" height="120" rx="10" fill="#E6F4EA" stroke="#1B6B3A" stroke-width="2.5"/>
