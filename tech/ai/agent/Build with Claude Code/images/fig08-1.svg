<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#37474F"/></marker>
  </defs>
  <rect width="1500" height="780" fill="#FFFFFF"/>
  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" fill="#222" text-anchor="middle">
    <text x="750" y="55" font-size="34" font-weight="bold">API와 MCP, 그리고 클라이언트-서버 구조</text>

    <text x="370" y="130" font-size="26" font-weight="bold">API 방식: 요청하고 답을 받는다</text>
    <rect x="60" y="170" width="260" height="110" rx="10" fill="#E8F0F9" stroke="#1F4E79" stroke-width="2.5"/>
    <text x="190" y="215" font-weight="bold">내 프로그램</text>
    <text x="190" y="247">글 생성을 요청</text>
    <rect x="460" y="170" width="260" height="110" rx="10" fill="#FFF3E0" stroke="#B26A00" stroke-width="2.5"/>
    <text x="590" y="215" font-weight="bold">AI 모델</text>
    <text x="590" y="247">글로 답변만 한다</text>
    <line x1="320" y1="210" x2="458" y2="210" stroke="#37474F" stroke-width="3" marker-end="url(#a)"/>
    <line x1="458" y1="250" x2="322" y2="250" stroke="#37474F" stroke-width="3" marker-end="url(#a)"/>
    <rect x="160" y="320" width="460" height="90" rx="10" fill="#FDECEA" stroke="#B3261E" stroke-width="2.5"/>
