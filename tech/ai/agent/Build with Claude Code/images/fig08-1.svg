    <text x="1100" y="200" font-size="19">요청</text>
    <text x="1100" y="290" font-size="19">결과</text>

    <line x1="1310" y1="290" x2="930" y2="400" stroke="#37474F" stroke-width="3" marker-end="url(#a)"/>
    <line x1="1310" y1="290" x2="1170" y2="400" stroke="#37474F" stroke-width="3" marker-end="url(#a)"/>
    <line x1="1310" y1="290" x2="1390" y2="400" stroke="#37474F" stroke-width="3" marker-end="url(#a)"/>
    <rect x="820" y="402" width="220" height="90" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/>
    <text x="930" y="440" font-weight="bold">Notion</text>
    <text x="930" y="472">문서 생성</text>
    <rect x="1060" y="402" width="220" height="90" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/>
