<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800">
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#37474F"/></marker>
  </defs>
  <rect width="1500" height="800" fill="#FFFFFF"/>
  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" fill="#222" text-anchor="middle">
    <text x="750" y="55" font-size="34" font-weight="bold">MCP, 스킬, 플러그인, 마켓플레이스의 관계</text>

    <rect x="60" y="110" width="400" height="190" rx="10" fill="#E6F4EA" stroke="#1B6B3A" stroke-width="2.5"/>
    <text x="260" y="152" font-size="24" font-weight="bold">MCP 서버</text>
    <text x="260" y="196">외부 서비스에 접속하는 연결 부품</text>
    <text x="260" y="228">예: Notion, GitHub, Supabase</text>
    <text x="260" y="260">설치: claude mcp add</text>

    <rect x="60" y="360" width="400" height="190" rx="10" fill="#FFF3E0" stroke="#B26A00" stroke-width="2.5"/>
    <text x="260" y="402" font-size="24" font-weight="bold">에이전트 스킬</text>
    <text x="260" y="446">맥락에 따라 자동 호출되는 프롬프트</text>
    <text x="260" y="478">저장: .claude/skills/이름/</text>
    <text x="260" y="510">파일: SKILL.md</text>

    <rect x="610" y="190" width="400" height="260" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/>
    <text x="810" y="236" font-size="24" font-weight="bold">플러그인</text>
    <text x="810" y="282">MCP와 스킬 등을 묶은 꾸러미</text>
    <text x="810" y="314">하나의 기능으로 제공된다</text>
    <text x="810" y="358">예: Playwright 플러그인</text>
    <text x="810" y="390">(안쪽은 MCP 서버)</text>
    <text x="810" y="422">설치: /plugin</text>

    <rect x="1060" y="150" width="380" height="340" rx="10" fill="#E8F0F9" stroke="#1F4E79" stroke-width="2.5"/>
    <text x="1250" y="196" font-size="24" font-weight="bold">마켓플레이스</text>
    <text x="1250" y="242">플러그인과 스킬을 찾아</text>
    <text x="1250" y="274">설치하는 공유 공간</text>
    <text x="1250" y="326">공식 마켓플레이스</text>
    <text x="1250" y="358">anthropics-skills</text>
    <text x="1250" y="406">개발자는 올리고</text>
    <text x="1250" y="438">사용자는 골라 설치한다</text>

    <line x1="462" y1="205" x2="608" y2="270" stroke="#37474F" stroke-width="3" marker-end="url(#a)"/>
    <line x1="462" y1="455" x2="608" y2="370" stroke="#37474F" stroke-width="3" marker-end="url(#a)"/>
    <line x1="1058" y1="320" x2="1012" y2="320" stroke="#37474F" stroke-width="3" marker-end="url(#a)"/>
    <text x="1035" y="300" font-size="19">제공</text>

    <rect x="60" y="610" width="1380" height="140" rx="10" fill="#FDECEA" stroke="#B3261E" stroke-width="2.5"/>
    <text x="750" y="660" font-size="24" font-weight="bold">쉬운 비유</text>
    <text x="750" y="702">MCP와 스킬은 재료, 플러그인은 재료를 담은 키트, 마켓플레이스는 키트를 파는 장터</text>
  </g>
</svg>
