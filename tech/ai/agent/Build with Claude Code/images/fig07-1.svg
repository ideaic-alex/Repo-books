<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="730" viewBox="0 0 1500 730" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#37474F"/></marker></defs>
<rect width="1500" height="730" fill="#fff"/>
<text x="750" y="55" font-size="34" font-weight="bold" text-anchor="middle" fill="#212121">서브에이전트 파일 구조와 권한 나누기</text>
<g stroke-width="2.5" font-size="21" fill="#212121">
<rect x="45" y="100" width="640" height="540" rx="10" fill="#E8F0F9" stroke="#1565C0"/>
<text x="365" y="145" font-weight="bold" text-anchor="middle">.claude/agents/code-bug-analyzer.md</text>
<rect x="75" y="170" width="580" height="230" rx="10" fill="#FFF3E0" stroke="#EF6C00"/>
<text x="365" y="210" font-weight="bold" text-anchor="middle">위쪽: 설정 블록 (frontmatter)</text>
<text x="105" y="255">name: 에이전트 이름 (필수)</text>
<text x="105" y="295">description: 언제 쓰는지 (필수)</text>
<text x="105" y="335">tools: 쓸 수 있는 도구 (선택)</text>
<text x="105" y="375">model: 실행 모델 (선택)</text>
<rect x="75" y="425" width="580" height="190" rx="10" fill="#E6F4EA" stroke="#2E7D32"/>
<text x="365" y="465" font-weight="bold" text-anchor="middle">아래쪽: 본문 지시문</text>
<text x="365" y="510" text-anchor="middle">에이전트가 따를 역할과 규칙을</text>
<text x="365" y="548" text-anchor="middle">평범한 문장으로 적는다</text>
<text x="365" y="586" text-anchor="middle">예) 심각도별로 묶어 보고하라</text>
<rect x="800" y="100" width="655" height="150" rx="10" fill="#F3E5F5" stroke="#6A1B9A"/>
<text x="1127" y="143" font-weight="bold" text-anchor="middle">code-bug-analyzer (검토 담당)</text>
<text x="1127" y="185" text-anchor="middle">도구: Read, Grep, Glob (읽기 전용)</text>
<text x="1127" y="222" text-anchor="middle">모델: opus / 코드를 고치지 못한다</text>
<rect x="800" y="285" width="655" height="150" rx="10" fill="#FDECEA" stroke="#C62828"/>
<text x="1127" y="328" font-weight="bold" text-anchor="middle">performance-optimizer (수정 담당)</text>
<text x="1127" y="370" text-anchor="middle">도구: Read, Grep, Glob, Edit, Write, Bash</text>
<text x="1127" y="407" text-anchor="middle">파일을 고치고 명령도 실행한다</text>
<rect x="800" y="470" width="655" height="150" rx="10" fill="#E6F4EA" stroke="#2E7D32"/>
<text x="1127" y="513" font-weight="bold" text-anchor="middle">ux-design-advisor (화면 담당)</text>
<text x="1127" y="555" text-anchor="middle">화면 배치와 사용 흐름을 살펴</text>
<text x="1127" y="592" text-anchor="middle">쓰기 쉬운 앱으로 다듬는다</text>
</g>
<g stroke="#37474F" stroke-width="3" fill="none" marker-end="url(#a)">
<line x1="687" y1="370" x2="798" y2="175"/>
</g>
<text x="745" y="695" font-size="21" text-anchor="middle" fill="#37474F">역할마다 파일 하나, 도구와 모델은 따로 정한다</text>
</svg>
