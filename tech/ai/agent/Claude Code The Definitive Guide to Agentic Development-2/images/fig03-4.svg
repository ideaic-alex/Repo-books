<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">
  <style>
    text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
    .t{font-size:34px;font-weight:700}
    .h{font-size:23px;font-weight:700}
    .b{font-size:19px}
    .s{font-size:17px;fill:#555}
    .n{font-size:22px;font-weight:700;fill:#FFFFFF}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A5260"/></marker>
  </defs>
  <rect width="1500" height="720" fill="#FFFFFF"/>
  <text class="t" x="750" y="62" text-anchor="middle">CLAUDE.md는 덮어쓰지 않고 겹쳐 쌓인다</text>

  <!-- 왼쪽: 네 위치 -->
  <rect x="60" y="110" width="760" height="112" rx="14" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
  <circle cx="60" cy="110" r="22" fill="#6B7280"/><text class="n" x="60" y="118" text-anchor="middle">1</text>
  <text class="h" x="100" y="155">조직 배포용 (managed CLAUDE.md)</text>
  <text class="s" x="100" y="190">회사가 시스템 폴더에 배포 · 그 PC의 모든 사용자 · 예: 보안 규칙</text>

  <rect x="60" y="242" width="760" height="112" rx="14" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
  <circle cx="60" cy="242" r="22" fill="#3B6EA8"/><text class="n" x="60" y="250" text-anchor="middle">2</text>
  <text class="h" x="100" y="287">홈 폴더  ~/.claude/CLAUDE.md</text>
  <text class="s" x="100" y="322">나의 모든 프로젝트 · 예: 답변 언어, 커밋 메시지 스타일</text>

  <rect x="60" y="374" width="760" height="112" rx="14" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
  <circle cx="60" cy="374" r="22" fill="#3E8A5A"/><text class="n" x="60" y="382" text-anchor="middle">3</text>
  <text class="h" x="100" y="419">프로젝트 루트  ./CLAUDE.md</text>
  <text class="s" x="100" y="454">이 저장소 · 팀이 함께 씀 · 예: 빌드·테스트 명령, 브랜치 규칙</text>

  <rect x="60" y="506" width="760" height="112" rx="14" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
  <circle cx="60" cy="506" r="22" fill="#B8862B"/><text class="n" x="60" y="514" text-anchor="middle">4</text>
  <text class="h" x="100" y="551">하위 폴더  ./api/CLAUDE.md</text>
  <text class="s" x="100" y="586">그 폴더에서 일할 때만 · 예: API 모듈 전용 규칙</text>

  <!-- 화살표 -->
  <line x1="822" y1="166" x2="974" y2="226" stroke="#4A5260" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="822" y1="298" x2="974" y2="316" stroke="#4A5260" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="822" y1="430" x2="974" y2="406" stroke="#4A5260" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="822" y1="562" x2="974" y2="496" stroke="#4A5260" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 오른쪽: 합쳐진 결과 -->
  <rect x="980" y="110" width="460" height="508" rx="14" fill="#FFFFFF" stroke="#2B2F36" stroke-width="2"/>
  <text class="h" x="1210" y="160" text-anchor="middle">Claude가 실제로 보는 지시</text>
  <rect x="1010" y="190" width="400" height="76" fill="#ECEEF1" stroke="#6B7280" stroke-width="1.5"/>
  <text class="b" x="1210" y="235" text-anchor="middle">조직 규칙</text>
  <rect x="1010" y="280" width="400" height="76" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="1.5"/>
  <text class="b" x="1210" y="325" text-anchor="middle">+ 나의 선호</text>
  <rect x="1010" y="370" width="400" height="76" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="1.5"/>
  <text class="b" x="1210" y="415" text-anchor="middle">+ 프로젝트 지식</text>
  <rect x="1010" y="460" width="400" height="76" fill="#FBF0DC" stroke="#B8862B" stroke-width="1.5"/>
  <text class="b" x="1210" y="505" text-anchor="middle">+ 폴더별 규칙</text>
  <text class="s" x="1210" y="582" text-anchor="middle">모두 합쳐서 한꺼번에 읽는다</text>

  <text class="b" x="750" y="680" text-anchor="middle">범위가 넓은 것(1)에서 좁은 것(4)으로 · 어느 파일도 다른 파일을 지우지 않는다</text>
</svg>
