<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="580" viewBox="0 0 1500 580">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.h2{font-size:20px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="580" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">콘텐츠 사업의 수익화 시점 (책의 기준 예)</text>
<line x1="60" y1="190" x2="1440" y2="190" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="h" x="150" y="150" text-anchor="middle">시작부터</text>
<circle cx="150" cy="190" r="10" fill="#3B6EA8"/>
<line x1="150" y1="204" x2="150" y2="258" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="15" y="262" width="270" height="170" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="150.0" y="328" text-anchor="middle">컨설팅과 서비스</text>
<text class="b" x="150.0" y="358" text-anchor="middle">독자 수와 무관</text>
<text class="b" x="150.0" y="388" text-anchor="middle">건당 단가 가장 큼</text>
<text class="h" x="450" y="150" text-anchor="middle">2~3개월</text>
<circle cx="450" cy="190" r="10" fill="#3B6EA8"/>
<line x1="450" y1="204" x2="450" y2="258" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="315" y="262" width="270" height="170" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="450.0" y="328" text-anchor="middle">제휴 마케팅</text>
<text class="b" x="450.0" y="358" text-anchor="middle">참여하는 구독자</text>
<text class="b" x="450.0" y="388" text-anchor="middle">500명 이상(책)</text>
<text class="h" x="750" y="150" text-anchor="middle">3~6개월</text>
<circle cx="750" cy="190" r="10" fill="#3B6EA8"/>
<line x1="750" y1="204" x2="750" y2="258" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="615" y="262" width="270" height="170" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="750.0" y="328" text-anchor="middle">디지털 상품</text>
<text class="b" x="750.0" y="358" text-anchor="middle">스폰서십 4~6개월</text>
<text class="b" x="750.0" y="388" text-anchor="middle">구독자 1천 명(책)</text>
<text class="h" x="1050" y="150" text-anchor="middle">6~12개월</text>
<circle cx="1050" cy="190" r="10" fill="#3B6EA8"/>
<line x1="1050" y1="204" x2="1050" y2="258" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="915" y="262" width="270" height="170" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="1050.0" y="328" text-anchor="middle">유료 커뮤니티</text>
<text class="b" x="1050.0" y="358" text-anchor="middle">강의와 교육</text>
<text class="b" x="1050.0" y="388" text-anchor="middle">참여 독자 2천 명(책)</text>
<text class="h" x="1350" y="150" text-anchor="middle">12개월 이후</text>
<circle cx="1350" cy="190" r="10" fill="#3B6EA8"/>
<line x1="1350" y1="204" x2="1350" y2="258" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1215" y="262" width="270" height="170" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="b" x="1350.0" y="328" text-anchor="middle">광고</text>
<text class="b" x="1350.0" y="358" text-anchor="middle">월 방문자</text>
<text class="b" x="1350.0" y="388" text-anchor="middle">1만 명 이상(책)</text>
<text class="b" x="750" y="480" text-anchor="middle">왼쪽일수록 작은 독자로도 시작하고, 오른쪽일수록 큰 독자층이 필요하다.</text>
<text class="s" x="750" y="530" text-anchor="middle">독자 규모와 시점은 책이 든 기준이며, 실제 결과는 분야와 사람에 따라 크게 다르다.</text>
</svg>
