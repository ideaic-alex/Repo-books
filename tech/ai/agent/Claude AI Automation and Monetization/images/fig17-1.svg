<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.h2{font-size:20px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="680" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">운영 성숙도 다섯 단계</text>
<rect x="40" y="430" width="270" height="200" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="175.0" y="468" text-anchor="middle">1 반응형</text>
<text class="b" x="175.0" y="498" text-anchor="middle">전부 수작업</text>
<text class="b" x="175.0" y="528" text-anchor="middle">문서가 없다</text>
<text class="b" x="175.0" y="558" text-anchor="middle">다음: 매주</text>
<text class="b" x="175.0" y="588" text-anchor="middle">절차 1개 문서화</text>
<rect x="325" y="400" width="270" height="230" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="460.0" y="438" text-anchor="middle">2 문서화</text>
<text class="b" x="460.0" y="468" text-anchor="middle">절차서만 있다</text>
<text class="b" x="460.0" y="498" text-anchor="middle">실제론 안 지킴</text>
<text class="b" x="460.0" y="528" text-anchor="middle">다음: 절차서를</text>
<text class="b" x="460.0" y="558" text-anchor="middle">필수 경로로</text>
<rect x="610" y="370" width="270" height="260" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="745.0" y="408" text-anchor="middle">3 체계화</text>
<text class="b" x="745.0" y="438" text-anchor="middle">품질이 예측된다</text>
<text class="b" x="745.0" y="468" text-anchor="middle">전달이 안정적</text>
<text class="b" x="745.0" y="498" text-anchor="middle">다음: 반복 단계</text>
<text class="b" x="745.0" y="528" text-anchor="middle">자동화 시작</text>
<rect x="895" y="340" width="270" height="290" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="1030.0" y="378" text-anchor="middle">4 자동화</text>
<text class="b" x="1030.0" y="408" text-anchor="middle">AI와 도구가 처리</text>
<text class="b" x="1030.0" y="438" text-anchor="middle">나는 판단과 관계</text>
<text class="b" x="1030.0" y="468" text-anchor="middle">다음: 역할이 분명한</text>
<text class="b" x="1030.0" y="498" text-anchor="middle">팀원 추가</text>
<rect x="1180" y="310" width="270" height="320" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="1315.0" y="348" text-anchor="middle">5 확장형</text>
<text class="b" x="1315.0" y="378" text-anchor="middle">내가 병목이 아님</text>
<text class="b" x="1315.0" y="408" text-anchor="middle">시간은 덜 늘어남</text>
<text class="b" x="1315.0" y="438" text-anchor="middle">다음: 전략, 제휴,</text>
<text class="b" x="1315.0" y="468" text-anchor="middle">상품 개발</text>
<line x1="100" y1="250" x2="1400" y2="130" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="b" x="300" y="175" text-anchor="middle">오를수록 매출 대비 내 시간이 줄어든다</text>
</svg>
