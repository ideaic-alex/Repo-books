<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="620" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">프롬프트 라이브러리의 다섯 범주와 공통 뼈대</text>
<rect x="100" y="105" width="1300" height="110" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="750.0" y="139" text-anchor="middle">공통 뼈대</text>
<text class="b" x="200" y="180" text-anchor="middle">역할 지정</text>
<text class="b" x="450" y="180" text-anchor="middle">입력 칸</text>
<text class="b" x="700" y="180" text-anchor="middle">출력 항목</text>
<text class="b" x="980" y="180" text-anchor="middle">형식·분량 제한</text>
<text class="b" x="1280" y="180" text-anchor="middle">모르면 확인 필요 표시</text>
<text class="b" x="325" y="180" text-anchor="middle">→</text>
<text class="b" x="575" y="180" text-anchor="middle">→</text>
<text class="b" x="840" y="180" text-anchor="middle">→</text>
<text class="b" x="1130" y="180" text-anchor="middle">→</text>
<rect x="40" y="290" width="270" height="150" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="175.0" y="324" text-anchor="middle">고객 소통</text>
<text class="b" x="175.0" y="354" text-anchor="middle">진행 보고</text>
<text class="b" x="175.0" y="382" text-anchor="middle">어려운 대화 준비</text>
<line x1="175" y1="218" x2="175" y2="288" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="330" y="290" width="270" height="150" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="465.0" y="324" text-anchor="middle">사업 개발</text>
<text class="b" x="465.0" y="354" text-anchor="middle">프로필 최적화</text>
<text class="b" x="465.0" y="382" text-anchor="middle">사례 연구 작성</text>
<line x1="465" y1="218" x2="465" y2="288" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="620" y="290" width="270" height="150" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="755.0" y="324" text-anchor="middle">콘텐츠 제작</text>
<text class="b" x="755.0" y="354" text-anchor="middle">장문 글</text>
<text class="b" x="755.0" y="382" text-anchor="middle">이메일 시퀀스</text>
<line x1="755" y1="218" x2="755" y2="288" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="910" y="290" width="270" height="150" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="h" x="1045.0" y="324" text-anchor="middle">분석과 조사</text>
<text class="b" x="1045.0" y="354" text-anchor="middle">경쟁 포지셔닝</text>
<text class="b" x="1045.0" y="382" text-anchor="middle">전략적 결정</text>
<line x1="1045" y1="218" x2="1045" y2="288" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1200" y="290" width="270" height="150" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="1335.0" y="324" text-anchor="middle">운영과 시스템</text>
<text class="b" x="1335.0" y="354" text-anchor="middle">회의 정리</text>
<text class="b" x="1335.0" y="382" text-anchor="middle">성과 평가 요약</text>
<line x1="1335" y1="218" x2="1335" y2="288" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="750" y="500" text-anchor="middle">프롬프트 본문은 옮기지 않고 범주와 구성 요소만 정리했다.</text>
<text class="b" x="750" y="545" text-anchor="middle">견본을 내 상황에 맞춰 고치고, 시험하고, 버전 이력을 남기며 라이브러리를 키운다.</text>
<text class="b" x="750" y="585" text-anchor="middle">고객·인사 정보를 넣기 전에는 개인정보와 계약을 먼저 확인한다.</text>
</svg>
