<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="700" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">프로덕션 워크플로: 설계 과정과 네 패턴</text>
<text class="h" x="750" y="108" text-anchor="middle">다섯 단계 설계 과정</text>
<rect x="40" y="125" width="250" height="120" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="165" y="170" text-anchor="middle">1 정의</text>
<text class="b" x="165" y="205" text-anchor="middle">업무 명세서 작성</text>
<rect x="332.5" y="125" width="250" height="120" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="457.5" y="170" text-anchor="middle">2 지도화</text>
<text class="b" x="457.5" y="205" text-anchor="middle">단계와 점검 지점</text>
<rect x="625" y="125" width="250" height="120" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="750" y="170" text-anchor="middle">3 구축</text>
<text class="b" x="750" y="205" text-anchor="middle">단계별 프롬프트</text>
<rect x="917.5" y="125" width="250" height="120" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="h" x="1042.5" y="170" text-anchor="middle">4 스트레스 테스트</text>
<text class="b" x="1042.5" y="205" text-anchor="middle">경계 사례 시험</text>
<rect x="1210" y="125" width="250" height="120" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="1335" y="170" text-anchor="middle">5 자동화</text>
<text class="b" x="1335" y="205" text-anchor="middle">단계를 연결</text>
<line x1="292" y1="185" x2="330" y2="185" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="584.5" y1="185" x2="622" y2="185" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="877" y1="185" x2="915" y2="185" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1169.5" y1="185" x2="1207" y2="185" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="h" x="750" y="310" text-anchor="middle">네 가지 파이프라인 패턴</text>
<rect x="40" y="330" width="340" height="190" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="210" y="375" text-anchor="middle">변환</text>
<text class="b" x="210" y="415" text-anchor="middle">기존 내용을 다른 형태로</text>
<text class="b" x="210" y="445" text-anchor="middle">원본이 닻이 되어 안정적</text>
<text class="b" x="210" y="475" text-anchor="middle">출력 형식에 공을 들임</text>
<rect x="400" y="330" width="340" height="190" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="570" y="375" text-anchor="middle">생성</text>
<text class="b" x="570" y="415" text-anchor="middle">명세에서 새 내용 만들기</text>
<text class="b" x="570" y="445" text-anchor="middle">변동이 커서 예시가 중요</text>
<text class="b" x="570" y="475" text-anchor="middle">브랜드 목소리를 예시에 담음</text>
<rect x="760" y="330" width="340" height="190" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="930" y="375" text-anchor="middle">분석</text>
<text class="b" x="930" y="415" text-anchor="middle">정보에서 판단과 통찰</text>
<text class="b" x="930" y="445" text-anchor="middle">사고의 사슬을 활용</text>
<text class="b" x="930" y="475" text-anchor="middle">추론 과정도 산출물</text>
<rect x="1120" y="330" width="340" height="190" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="h" x="1290" y="375" text-anchor="middle">오케스트레이션</text>
<text class="b" x="1290" y="415" text-anchor="middle">분류하고 경로를 배분</text>
<text class="b" x="1290" y="445" text-anchor="middle">라우팅 정확도가 관건</text>
<text class="b" x="1290" y="475" text-anchor="middle">하류 전체 품질에 영향</text>
<rect x="40" y="550" width="1420" height="70" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="750" y="592" text-anchor="middle">세 겹 오류 처리: 입력 검증, 품질 하한 점검, 우아한 성능 저하</text>
<text class="s" x="750" y="665" text-anchor="middle">모든 복잡한 시스템은 네 패턴의 조합이나 변형이라고 책은 설명한다.</text>
</svg>
