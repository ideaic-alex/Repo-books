<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="560" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">세 층 상품 포트폴리오</text>
<rect x="40" y="120" width="440" height="210" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="260.0" y="158" text-anchor="middle">입문층</text>
<text class="b" x="260.0" y="190" text-anchor="middle">프롬프트 모음</text>
<text class="b" x="260.0" y="218" text-anchor="middle">체크리스트, 템플릿</text>
<text class="s" x="260.0" y="246" text-anchor="middle">역할: 신뢰 쌓기</text>
<text class="s" x="260.0" y="270" text-anchor="middle">구매 부담이 가장 낮음</text>
<line x1="482" y1="225" x2="566" y2="225" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="530" y="120" width="440" height="210" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="750.0" y="158" text-anchor="middle">핵심층</text>
<text class="b" x="750.0" y="190" text-anchor="middle">가이드, 미니 강의</text>
<text class="b" x="750.0" y="218" text-anchor="middle">시스템 청사진</text>
<text class="s" x="750.0" y="246" text-anchor="middle">역할: 주된 매출</text>
<text class="s" x="750.0" y="270" text-anchor="middle">가격은 중간</text>
<line x1="972" y1="225" x2="1056" y2="225" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1020" y="120" width="440" height="210" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="1240.0" y="158" text-anchor="middle">프리미엄층</text>
<text class="b" x="1240.0" y="190" text-anchor="middle">정식 강의, 마스터클래스</text>
<text class="b" x="1240.0" y="218" text-anchor="middle">완성형 시스템</text>
<text class="s" x="1240.0" y="246" text-anchor="middle">역할: 충성 독자 전환</text>
<text class="s" x="1240.0" y="270" text-anchor="middle">가격이 가장 높음</text>
<line x1="260" y1="345" x2="1240" y2="345" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="b" x="750" y="385" text-anchor="middle">구매 준비도와 신뢰가 높아지는 방향</text>
<rect x="300" y="415" width="900" height="80" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="b" x="750.0" y="453" text-anchor="middle">가격 범위와 월 매출 목표는 책의 예일 뿐, 자기 시장에서 확인한다</text>
<text class="s" x="750" y="538" text-anchor="middle">상품 하나에 의존하지 않고 가격대가 다른 상품이 서로 받쳐 주게 한다.</text>
</svg>
