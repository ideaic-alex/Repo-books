<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="580" viewBox="0 0 1500 580">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="580" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">리드 정보 브리핑 파이프라인</text>
<rect x="50" y="110" width="215" height="190" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<circle cx="78" cy="140" r="16" fill="#FFFFFF" stroke="#3B6EA8" stroke-width="2"/>
<text class="s" x="78" y="147" text-anchor="middle">1</text>
<text class="h" x="171.5" y="150" text-anchor="middle">양식 도구</text>
<text class="b" x="157.5" y="210" text-anchor="middle">리드 정보 수집</text>
<text class="b" x="157.5" y="242" text-anchor="middle">이름, 회사, 직책</text>
<line x1="267" y1="205.0" x2="285" y2="205.0" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="287" y="110" width="215" height="190" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<circle cx="315" cy="140" r="16" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="2"/>
<text class="s" x="315" y="147" text-anchor="middle">2</text>
<text class="h" x="408.5" y="150" text-anchor="middle">Make/Zapier</text>
<text class="b" x="394.5" y="210" text-anchor="middle">회사명과 주소를</text>
<text class="b" x="394.5" y="242" text-anchor="middle">변수로 추출</text>
<line x1="504" y1="205.0" x2="522" y2="205.0" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="524" y="110" width="215" height="190" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<circle cx="552" cy="140" r="16" fill="#FFFFFF" stroke="#B8862B" stroke-width="2"/>
<text class="s" x="552" y="147" text-anchor="middle">3</text>
<text class="h" x="645.5" y="150" text-anchor="middle">Claude API</text>
<text class="b" x="631.5" y="210" text-anchor="middle">회사 분석</text>
<text class="b" x="631.5" y="242" text-anchor="middle">브리프 작성</text>
<line x1="741" y1="205.0" x2="759" y2="205.0" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="761" y="110" width="215" height="190" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<circle cx="789" cy="140" r="16" fill="#FFFFFF" stroke="#B8862B" stroke-width="2"/>
<text class="s" x="789" y="147" text-anchor="middle">4</text>
<text class="h" x="882.5" y="150" text-anchor="middle">Claude API</text>
<text class="b" x="868.5" y="210" text-anchor="middle">브리프를 참조한</text>
<text class="b" x="868.5" y="242" text-anchor="middle">첫 메시지 초안</text>
<line x1="978" y1="205.0" x2="996" y2="205.0" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="998" y="110" width="215" height="190" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<circle cx="1026" cy="140" r="16" fill="#FFFFFF" stroke="#B5524A" stroke-width="2"/>
<text class="s" x="1026" y="147" text-anchor="middle">5</text>
<text class="h" x="1119.5" y="150" text-anchor="middle">이메일 도구</text>
<text class="b" x="1105.5" y="210" text-anchor="middle">브리프와 초안을</text>
<text class="b" x="1105.5" y="242" text-anchor="middle">영업함으로 발송</text>
<line x1="1215" y1="205.0" x2="1233" y2="205.0" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1235" y="110" width="215" height="190" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<circle cx="1263" cy="140" r="16" fill="#FFFFFF" stroke="#B5524A" stroke-width="2"/>
<text class="s" x="1263" y="147" text-anchor="middle">6</text>
<text class="h" x="1356.5" y="150" text-anchor="middle">CRM</text>
<text class="b" x="1342.5" y="210" text-anchor="middle">연락처를 만들고</text>
<text class="b" x="1342.5" y="242" text-anchor="middle">브리프를 메모에 첨부</text>
<rect x="50" y="330" width="215" height="46" rx="23" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="157.5" y="360" text-anchor="middle">트리거</text>
<rect x="287" y="330" width="215" height="46" rx="23" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="394.5" y="360" text-anchor="middle">라우팅</text>
<rect x="524" y="330" width="452" height="46" rx="23" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="750.0" y="360" text-anchor="middle">처리 (Claude)</text>
<rect x="998" y="330" width="452" height="46" rx="23" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="b" x="1224.0" y="360" text-anchor="middle">전달</text>
<text class="b" x="750" y="440" text-anchor="middle">영업 담당자가 알림을 보기 전에 브리프와 초안이 받은편지함에 도착해 있다.</text>
<text class="b" x="750" y="476" text-anchor="middle">초안을 보낼지는 사람이 확인하고 결정한다. 처음 실행들은 직접 지켜본다.</text>
<text class="s" x="750" y="536" text-anchor="middle">6단계 구성은 책의 예를 새로 그린 것이다. 리드 개인정보는 처리 규정에 맞춰 다룬다.</text>
</svg>
