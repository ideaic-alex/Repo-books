<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="620" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">계속 배우기의 네 영역</text>
<rect x="550" y="250" width="400" height="140" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="750.0" y="290" text-anchor="middle">만드는 일</text>
<text class="b" x="750.0" y="322" text-anchor="middle">읽은 것은 시스템 개선에 적용</text>
<text class="b" x="750.0" y="350" text-anchor="middle">소비보다 구축이 목적</text>
<rect x="50" y="100" width="400" height="135" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="250.0" y="140" text-anchor="middle">1 AI 기술</text>
<text class="b" x="250.0" y="172" text-anchor="middle">Anthropic 릴리스 노트와 문서</text>
<text class="b" x="250.0" y="200" text-anchor="middle">새 기능은 기존 시스템에 시험</text>
<rect x="1050" y="100" width="400" height="135" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="1250.0" y="140" text-anchor="middle">2 사업과 전략</text>
<text class="b" x="1250.0" y="172" text-anchor="middle">포지셔닝, 가치 기반 가격</text>
<text class="b" x="1250.0" y="200" text-anchor="middle">영업 체계, 고객 관리</text>
<rect x="50" y="410" width="400" height="135" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="h" x="250.0" y="450" text-anchor="middle">3 내 전문 분야</text>
<text class="b" x="250.0" y="482" text-anchor="middle">학회, 업계지, 협회, 현장 사람</text>
<text class="b" x="250.0" y="510" text-anchor="middle">투자 효과가 가장 큰 학습</text>
<rect x="1050" y="410" width="400" height="135" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="1250.0" y="450" text-anchor="middle">4 동료 학습</text>
<text class="b" x="1250.0" y="482" text-anchor="middle">실무자 커뮤니티를 여럿 구독</text>
<text class="b" x="1250.0" y="510" text-anchor="middle">한 곳에는 직접 기여</text>
<line x1="452" y1="200" x2="548" y2="285" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1048" y1="200" x2="952" y2="285" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="452" y1="445" x2="548" y2="360" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1048" y1="445" x2="952" y2="360" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="750" y="590" text-anchor="middle">고신호 출처 소수만 구독하고, 행동으로 이어지지 않는 것은 끊는다는 것이 책의 조언이다.</text>
</svg>
