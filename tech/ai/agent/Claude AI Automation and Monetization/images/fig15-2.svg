<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.h2{font-size:20px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="640" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">복잡한 일을 위한 세 가지 프롬프트 패턴</text>
<rect x="30" y="105" width="200" height="150" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="130.0" y="143" text-anchor="middle">적대적 검토</text>
<text class="s" x="130" y="190" text-anchor="middle">중요한 제안서</text>
<text class="s" x="130" y="213" text-anchor="middle">전략 문서</text>
<rect x="260" y="105" width="220" height="150" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="370.0" y="143" text-anchor="middle">생성</text>
<text class="b" x="370.0" y="173" text-anchor="middle">평소 프롬프트로</text>
<text class="b" x="370.0" y="203" text-anchor="middle">초안을 만든다</text>
<line x1="482" y1="180" x2="503" y2="180" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="505" y="105" width="220" height="150" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="615.0" y="143" text-anchor="middle">비판</text>
<text class="b" x="615.0" y="173" text-anchor="middle">회의적 전문가로</text>
<text class="b" x="615.0" y="203" text-anchor="middle">약점을 찾는다</text>
<line x1="727" y1="180" x2="748" y2="180" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="750" y="105" width="220" height="150" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="860.0" y="143" text-anchor="middle">수정</text>
<text class="b" x="860.0" y="173" text-anchor="middle">지적을 반영해</text>
<text class="b" x="860.0" y="203" text-anchor="middle">완성본만 출력</text>
<rect x="30" y="280" width="200" height="150" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="130.0" y="318" text-anchor="middle">관점 행렬</text>
<text class="s" x="130" y="365" text-anchor="middle">균형 잡힌 분석</text>
<text class="s" x="130" y="388" text-anchor="middle">의사결정</text>
<rect x="260" y="280" width="220" height="150" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="370.0" y="318" text-anchor="middle">낙관</text>
<text class="b" x="370.0" y="348" text-anchor="middle">가장 좋은 경우</text>
<line x1="482" y1="355" x2="503" y2="355" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="505" y="280" width="220" height="150" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="615.0" y="318" text-anchor="middle">회의</text>
<text class="b" x="615.0" y="348" text-anchor="middle">가장 센 반대</text>
<line x1="727" y1="355" x2="748" y2="355" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="750" y="280" width="220" height="150" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="860.0" y="318" text-anchor="middle">실용</text>
<text class="b" x="860.0" y="348" text-anchor="middle">현실적 타협</text>
<line x1="972" y1="355" x2="993" y2="355" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="995" y="280" width="220" height="150" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="1105.0" y="318" text-anchor="middle">장기</text>
<text class="b" x="1105.0" y="348" text-anchor="middle">몇 년 뒤 영향</text>
<line x1="1217" y1="355" x2="1238" y2="355" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1240" y="280" width="220" height="150" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="1350.0" y="318" text-anchor="middle">종합</text>
<text class="b" x="1350.0" y="348" text-anchor="middle">균형 잡힌 결론</text>
<text class="b" x="1350.0" y="378" text-anchor="middle">과 권고</text>
<rect x="30" y="455" width="200" height="150" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="130.0" y="493" text-anchor="middle">반복 다듬기</text>
<text class="s" x="130" y="540" text-anchor="middle">창작과 전략 글</text>
<rect x="260" y="455" width="220" height="150" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="370.0" y="493" text-anchor="middle">1패스</text>
<text class="b" x="370.0" y="523" text-anchor="middle">완성도 우선</text>
<text class="b" x="370.0" y="553" text-anchor="middle">다듬지 않는다</text>
<line x1="482" y1="530" x2="503" y2="530" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="505" y="455" width="220" height="150" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="615.0" y="493" text-anchor="middle">2패스</text>
<text class="b" x="615.0" y="523" text-anchor="middle">구체화, 압축,</text>
<text class="b" x="615.0" y="553" text-anchor="middle">예시 보강</text>
<line x1="727" y1="530" x2="748" y2="530" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="750" y="455" width="220" height="150" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="860.0" y="493" text-anchor="middle">3패스</text>
<text class="b" x="860.0" y="523" text-anchor="middle">첫 문단과 끝맺음</text>
<text class="b" x="860.0" y="553" text-anchor="middle">불필요 문장 삭제</text>
<text class="s" x="750" y="625" text-anchor="middle">세 패턴 모두 한 번에 완성하려 하지 않고 검토와 수정 단계를 프롬프트 구조 안에 넣는 방식이다.</text>
</svg>
