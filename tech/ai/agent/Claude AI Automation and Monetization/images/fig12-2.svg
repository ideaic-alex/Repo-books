<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="600" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">수입원 분산과 안정성</text>
<rect x="60" y="100" width="620" height="100" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="370.0" y="138" text-anchor="middle">리테이너 고객</text>
<text class="s" x="370.0" y="166" text-anchor="middle">안정성 높음: 계약 기반</text>
<line x1="684" y1="150" x2="860" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="60" y="215" width="620" height="100" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="370.0" y="253" text-anchor="middle">프로젝트 고객</text>
<text class="s" x="370.0" y="281" text-anchor="middle">안정성 중간: 파이프라인 필요</text>
<line x1="684" y1="265" x2="860" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="60" y="330" width="620" height="100" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="370.0" y="368" text-anchor="middle">디지털 상품</text>
<text class="s" x="370.0" y="396" text-anchor="middle">안정성 낮음에서 중간: 홍보 필요</text>
<line x1="684" y1="380" x2="860" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="60" y="445" width="620" height="100" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="b" x="370.0" y="483" text-anchor="middle">제휴와 소개 수수료</text>
<text class="s" x="370.0" y="511" text-anchor="middle">안정성 낮음: 변동이 큼</text>
<line x1="684" y1="495" x2="860" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="870" y="200" width="570" height="200" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="1155.0" y="238" text-anchor="middle">서로 다른 수입원 세 가지 이상</text>
<text class="b" x="1155.0" y="270" text-anchor="middle">한 고객이나 한 시장 변화의</text>
<text class="b" x="1155.0" y="298" text-anchor="middle">충격을 줄이는 구조</text>
<text class="s" x="1155.0" y="326" text-anchor="middle">합계 목표는 책의 예이며 보장이 아니다</text>
<text class="s" x="750" y="578" text-anchor="middle">비율을 따라 하기보다 종류가 다른 수입원을 섞는다는 원리를 가져간다.</text>
</svg>
