<line x1="1156" y1="412" x2="1169" y2="412" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1170" y="350" width="290" height="125" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h2" x="1315.0" y="388" text-anchor="middle">8주 첫 사례</text>
<text class="b" x="1315.0" y="418" text-anchor="middle">사례 연구 작성과 공개</text>
<text class="b" x="1315.0" y="448" text-anchor="middle">목표: 사례 공개</text>
<line x1="130" y1="477" x2="130" y2="498" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="30" y="500" width="200" height="125" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="130.0" y="538" text-anchor="middle">3개월</text>
<text class="b" x="130.0" y="568" text-anchor="middle">통하는 것 키우기</text>
<rect x="255" y="500" width="290" height="125" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h2" x="400.0" y="538" text-anchor="middle">9주 두 번째 수입원</text>
<text class="b" x="400.0" y="568" text-anchor="middle">보완 상품이나 상위 티어</text>
<text class="b" x="400.0" y="598" text-anchor="middle">목표: 둘째 수입원 가동</text>
<line x1="546" y1="562" x2="559" y2="562" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="560" y="500" width="290" height="125" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h2" x="705.0" y="538" text-anchor="middle">10주 가격 인상</text>
<text class="b" x="705.0" y="568" text-anchor="middle">신규 고객 가격 인상</text>
<text class="b" x="705.0" y="598" text-anchor="middle">목표: 새 가격 적용</text>
<line x1="851" y1="562" x2="864" y2="562" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="865" y="500" width="290" height="125" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h2" x="1010.0" y="538" text-anchor="middle">11주 소개 엔진</text>
<text class="b" x="1010.0" y="568" text-anchor="middle">만족 고객에 소개 요청</text>
<text class="b" x="1010.0" y="598" text-anchor="middle">목표: 첫 소개 접수</text>
<line x1="1156" y1="562" x2="1169" y2="562" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1170" y="500" width="290" height="125" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h2" x="1315.0" y="538" text-anchor="middle">12주 점검과 계획</text>
<text class="b" x="1315.0" y="568" text-anchor="middle">90일 점검, 자동화 1개</text>
<text class="b" x="1315.0" y="598" text-anchor="middle">목표: 월 목표 평가</text>
<line x1="130" y1="177" x2="130" y2="198" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="30" y="650" width="1440" height="75" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="h" x="750.0" y="688" text-anchor="middle">91일부터: 복리 단계</text>
<text class="b" x="750.0" y="718" text-anchor="middle">쌓아 온 시스템, 콘텐츠, 관계가 들어간 노력보다 더 돌려주기 시작한다</text>
</svg>
