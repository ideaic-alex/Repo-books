<text class="b" x="1315.0" y="268" text-anchor="middle">첫 계약과 납품</text>
<text class="b" x="1315.0" y="298" text-anchor="middle">목표: 첫 유료 고객</text>
<line x1="130" y1="327" x2="130" y2="348" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="30" y="350" width="200" height="125" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
