<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.h2{font-size:20px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="760" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">90일 실행 로드맵</text>
<rect x="30" y="95" width="1440" height="80" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="750.0" y="133" text-anchor="middle">사전 1주: 기초 다지기</text>
<text class="b" x="750.0" y="163" text-anchor="middle">수입원 하나 정하기, 포지셔닝 문장, 핵심 시스템 첫 판 시험, 첫 후보 목록, 월별 목표</text>
<rect x="30" y="200" width="200" height="125" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="130.0" y="238" text-anchor="middle">1개월</text>
<text class="b" x="130.0" y="268" text-anchor="middle">모델 검증</text>
<rect x="255" y="200" width="290" height="125" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h2" x="400.0" y="238" text-anchor="middle">1주 첫 접촉</text>
<text class="b" x="400.0" y="268" text-anchor="middle">맞춤 연락 시작</text>
<text class="b" x="400.0" y="298" text-anchor="middle">목표: 통화 예약</text>
<line x1="546" y1="262" x2="559" y2="262" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="560" y="200" width="290" height="125" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h2" x="705.0" y="238" text-anchor="middle">2주 첫 대화</text>
<text class="b" x="705.0" y="268" text-anchor="middle">발견 통화로 요구 파악</text>
<text class="b" x="705.0" y="298" text-anchor="middle">목표: 유력 후보 확보</text>
<line x1="851" y1="262" x2="864" y2="262" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="865" y="200" width="290" height="125" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
