<text class="h2" x="400.0" y="388" text-anchor="middle">5주 체계화</text>
<text class="b" x="400.0" y="418" text-anchor="middle">절차 문서화, 정비</text>
<text class="b" x="400.0" y="448" text-anchor="middle">목표: 절차서 완성</text>
<line x1="546" y1="412" x2="559" y2="412" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="560" y="350" width="290" height="125" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
