<text class="b" x="705.0" y="418" text-anchor="middle">연락량 확대, 글 추가</text>
<text class="b" x="705.0" y="448" text-anchor="middle">목표: 진행 대화 다수</text>
<line x1="851" y1="412" x2="864" y2="412" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="865" y="350" width="290" height="125" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h2" x="1010.0" y="388" text-anchor="middle">7주 두 번째 수익</text>
<text class="b" x="1010.0" y="418" text-anchor="middle">두 번째 고객 전환</text>
