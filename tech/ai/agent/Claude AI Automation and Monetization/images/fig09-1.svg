<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="540" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">AI 에이전시의 네 구성 요소</text>
<rect x="400" y="95" width="700" height="90" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="750.0" y="133" text-anchor="middle">시스템이 먼저, 고객은 그다음</text>
<text class="b" x="750.0" y="165" text-anchor="middle">네 요소를 처음부터 함께 설계한다</text>
<line x1="202" y1="190" x2="202" y2="262" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="30" y="265" width="345" height="170" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="202.5" y="303" text-anchor="middle">1. 생산 시스템</text>
<text class="b" x="202.5" y="335" text-anchor="middle">Claude 파이프라인</text>
<text class="b" x="202.5" y="363" text-anchor="middle">초기: 본인이 운영</text>
<text class="b" x="202.5" y="391" text-anchor="middle">Claude: 주된 생산자</text>
<line x1="567" y1="190" x2="567" y2="262" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="395" y="265" width="345" height="170" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="567.5" y="303" text-anchor="middle">2. 고객 성공</text>
<text class="b" x="567.5" y="335" text-anchor="middle">온보딩과 관계 관리</text>
<text class="b" x="567.5" y="363" text-anchor="middle">고객 8~12곳당 1명</text>
<text class="b" x="567.5" y="391" text-anchor="middle">Claude: 소통 초안</text>
<line x1="932" y1="190" x2="932" y2="262" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="760" y="265" width="345" height="170" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="h" x="932.5" y="303" text-anchor="middle">3. 품질 관리</text>
<text class="b" x="932.5" y="335" text-anchor="middle">모든 산출물 검토</text>
<text class="b" x="932.5" y="363" text-anchor="middle">본인 또는 선임 팀원</text>
<text class="b" x="932.5" y="391" text-anchor="middle">Claude: 자체 검토</text>
<line x1="1297" y1="190" x2="1297" y2="262" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1125" y="265" width="345" height="170" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="1297.5" y="303" text-anchor="middle">4. 사업 개발</text>
<text class="b" x="1297.5" y="335" text-anchor="middle">영업, 마케팅, 제휴</text>
<text class="b" x="1297.5" y="363" text-anchor="middle">초기: 본인이 담당</text>
<text class="b" x="1297.5" y="391" text-anchor="middle">Claude: 제안서 초안</text>
<text class="s" x="750" y="518" text-anchor="middle">고객 수 기준(8~12곳)은 책의 예이며 규모와 업종에 따라 달라진다.</text>
</svg>
