<text class="b" x="1240.0" y="227.0" text-anchor="middle">공개, 사내 비공개, 벤더 공식</text>
<rect x="1000" y="330" width="480" height="160" rx="10" fill="#FBE6E6" stroke="#B04A4A" stroke-width="2"/>
