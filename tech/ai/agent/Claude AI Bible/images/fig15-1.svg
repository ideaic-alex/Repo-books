<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="640" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">15장 Skill, 플러그인, 마켓플레이스의 관계</text>
<rect x="20" y="110" width="340" height="80" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="190.0" y="142.0" text-anchor="middle">Skill</text>
<text class="b" x="190.0" y="172.0" text-anchor="middle">작업 지침 폴더</text>
<rect x="20" y="210" width="340" height="80" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="190.0" y="242.0" text-anchor="middle">MCP 서버</text>
<text class="b" x="190.0" y="272.0" text-anchor="middle">외부 연결 설정</text>
<rect x="20" y="310" width="340" height="80" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
