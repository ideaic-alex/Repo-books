<line x1="362" y1="250" x2="498" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="362" y1="350" x2="498" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="362" y1="450" x2="498" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="862" y1="190" x2="998" y2="190" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1240" y1="272" x2="1240" y2="328" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="500" y="540" width="980" height="70" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="990.0" y="582.0" text-anchor="middle">진열대(마켓플레이스)는 하나로, 열쇠(자격 증명)는 필요한 만큼만</text>
