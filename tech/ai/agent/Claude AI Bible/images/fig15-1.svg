<text class="b" x="680.0" y="277.0" text-anchor="middle">매니페스트(이름·버전·</text>
<text class="b" x="680.0" y="307.0" text-anchor="middle">설명·구성요소 위치)</text>
<text class="b" x="680.0" y="337.0" text-anchor="middle">+ 조각들을 한 묶음으로</text>
