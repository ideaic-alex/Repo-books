<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="640" fill="#FFFFFF"/>
<text class="t" x="750.0" y="62" text-anchor="middle">Chrome 에이전트의 안전 흐름</text>
<rect x="40" y="110" width="400" height="130" rx="10" fill="#FBE6E6" stroke="#B04A4A" stroke-width="2"/>
<text class="h" x="240.0" y="152.0" text-anchor="middle">웹 페이지 내용</text>
<text class="b" x="240.0" y="182.0" text-anchor="middle">신뢰할 수 없음</text>
<text class="b" x="240.0" y="212.0" text-anchor="middle">숨은 지시가 있을 수 있음</text>
<rect x="550" y="110" width="400" height="130" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="750.0" y="152.0" text-anchor="middle">Claude 에이전트</text>
<text class="b" x="750.0" y="182.0" text-anchor="middle">페이지는 읽을 내용</text>
<text class="b" x="750.0" y="212.0" text-anchor="middle">명령은 사용자 목표뿐</text>
<rect x="1060" y="110" width="400" height="130" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="1260.0" y="152.0" text-anchor="middle">확인 프롬프트</text>
<text class="b" x="1260.0" y="182.0" text-anchor="middle">제출, 변경 같은 행동 전</text>
<text class="b" x="1260.0" y="212.0" text-anchor="middle">사람이 읽고 승인</text>
<line x1="442" y1="175" x2="548" y2="175" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="952" y1="175" x2="1058" y2="175" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="550" y="300" width="400" height="110" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="750.0" y="347.0" text-anchor="middle">사용자의 목표</text>
<text class="b" x="750.0" y="377.0" text-anchor="middle">유일한 권위</text>
<line x1="750" y1="298" x2="750" y2="242" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="30" y="470" width="450" height="140" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="255.0" y="517.0" text-anchor="middle">로그인은 사람이</text>
<text class="b" x="255.0" y="547.0" text-anchor="middle">비밀번호를 프롬프트에</text>
<text class="b" x="255.0" y="577.0" text-anchor="middle">넘기지 않는다</text>
<rect x="525" y="470" width="450" height="140" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="750.0" y="517.0" text-anchor="middle">피해 범위 분리</text>
<text class="b" x="750.0" y="547.0" text-anchor="middle">민감한 계정이 열린</text>
<text class="b" x="750.0" y="577.0" text-anchor="middle">창에서는 쓰지 않는다</text>
<rect x="1020" y="470" width="450" height="140" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="1245.0" y="517.0" text-anchor="middle">작게 쪼개 감독</text>
<text class="b" x="1245.0" y="547.0" text-anchor="middle">되돌릴 수 없는 버튼은</text>
<text class="b" x="1245.0" y="577.0" text-anchor="middle">내 손으로</text>
</svg>
