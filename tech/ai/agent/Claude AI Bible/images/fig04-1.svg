<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}.big{font-size:44px;font-weight:700;fill:#B04A4A}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="660" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">채팅 구독과 API 계정은 별개다</text>
<text class="b" x="750" y="100" text-anchor="middle">판별 질문: 내가 쓰는가, 소프트웨어가 쓰는가?</text>
<rect x="40" y="130" width="620" height="330" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="350" y="176" text-anchor="middle">채팅 구독 (Pro, Max, Team)</text>
<text class="b" x="350" y="230" text-anchor="middle">누가: 사람이 앱에서 직접 대화</text>
<text class="b" x="350" y="274" text-anchor="middle">과금: 월 고정 요금, 플랜 한도 안에서</text>
<text class="b" x="350" y="318" text-anchor="middle">시작: claude.ai에서 가입</text>
<text class="b" x="350" y="362" text-anchor="middle">쓰임: 일상 업무, 데스크톱 고급 도구</text>
<text class="b" x="350" y="406" text-anchor="middle">비용 예측이 쉬움</text>
<text class="big" x="750" y="310" text-anchor="middle">≠</text>
<rect x="840" y="130" width="620" height="330" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="1150" y="176" text-anchor="middle">API 계정 (Anthropic Platform)</text>
<text class="b" x="1150" y="230" text-anchor="middle">누가: 코드와 자동화가 호출</text>
<text class="b" x="1150" y="274" text-anchor="middle">과금: 토큰 단위 종량제</text>
<text class="b" x="1150" y="318" text-anchor="middle">시작: 구독과 별도로 가입</text>
<text class="b" x="1150" y="362" text-anchor="middle">쓰임: 에이전트, 자동화, 맞춤 연동</text>
<text class="b" x="1150" y="406" text-anchor="middle">결제, 한도, 크레딧을 구독과 공유하지 않음</text>
<rect x="250" y="510" width="1000" height="100" rx="10" fill="#FBE6E6" stroke="#B04A4A" stroke-width="2"/>
<text class="h" x="750" y="552" text-anchor="middle">API를 쓴다면</text>
<text class="b" x="750" y="586" text-anchor="middle">코드를 쓰기 전에 지출 한도(spending cap)부터 설정한다</text>
</svg>
