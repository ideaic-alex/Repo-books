<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="560" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">분업과 검증: 열두 사례의 공통 구조</text>
<rect x="50" y="110" width="400" height="130" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="250" y="155" text-anchor="middle">Claude(에이전트)</text>
<text class="b" x="250" y="188" text-anchor="middle">분량 많은 기계적 작업</text>
<text class="b" x="250" y="216" text-anchor="middle">요약, 분류, 초안</text>
<line x1="452" y1="175" x2="548" y2="175" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="550" y="110" width="400" height="130" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="750" y="155" text-anchor="middle">싼 검증 장치</text>
<text class="b" x="750" y="188" text-anchor="middle">근거 인용, 출처 표기</text>
<text class="b" x="750" y="216" text-anchor="middle">불확실하면 표시</text>
<line x1="952" y1="175" x2="1048" y2="175" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1050" y="110" width="400" height="130" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="1250" y="155" text-anchor="middle">사람</text>
<text class="b" x="1250" y="188" text-anchor="middle">판단, 확인, 서명</text>
<text class="b" x="1250" y="216" text-anchor="middle">책임은 사람에게 남는다</text>
<text class="h" x="750" y="305" text-anchor="middle">책이 정리한 다섯 가지 교훈</text>
<rect x="35" y="330" width="270" height="110" rx="10" fill="#F3F7FC" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="170" y="372" text-anchor="middle">1 역할 분담</text>
<text class="b" x="170" y="408" text-anchor="middle">기계적 일 vs 판단</text>
<rect x="325" y="330" width="270" height="110" rx="10" fill="#F3F7FC" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="460" y="372" text-anchor="middle">2 도구 선택</text>
<text class="b" x="460" y="408" text-anchor="middle">일의 모양에 맞춤</text>
<rect x="615" y="330" width="270" height="110" rx="10" fill="#F3F7FC" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="750" y="372" text-anchor="middle">3 사람 올리기</text>
<text class="b" x="750" y="408" text-anchor="middle">내보내지 않기</text>
<rect x="905" y="330" width="270" height="110" rx="10" fill="#F3F7FC" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="1040" y="372" text-anchor="middle">4 검증</text>
<text class="b" x="1040" y="408" text-anchor="middle">중요한 부분 확인</text>
<rect x="1195" y="330" width="270" height="110" rx="10" fill="#F3F7FC" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="1330" y="372" text-anchor="middle">5 검증 설계</text>
<text class="b" x="1330" y="408" text-anchor="middle">확인을 싸게</text>
<rect x="250" y="480" width="1000" height="50" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="b" x="750" y="512" text-anchor="middle">따라 할 때는 도구가 아니라 이 모양을 가져온다</text>
</svg>
