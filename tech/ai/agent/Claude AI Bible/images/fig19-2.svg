<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="700" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">비전과 도구를 결합한 송장 처리 흐름</text>
<rect x="30" y="110" width="451" height="120" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="255.5" y="157.0" text-anchor="middle">송장 PDF 도착</text>
<text class="b" x="255.5" y="187.0" text-anchor="middle">이메일 첨부</text>
<line x1="483" y1="170" x2="523" y2="170" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="525" y="110" width="451" height="120" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="750.5" y="157.0" text-anchor="middle">비전으로 읽기</text>
<text class="b" x="750.5" y="187.0" text-anchor="middle">거래처, 금액, 기한</text>
<line x1="977" y1="170" x2="1017" y2="170" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1019" y="110" width="451" height="120" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="1244.5" y="142.0" text-anchor="middle">도구로 확인</text>
<text class="b" x="1244.5" y="172.0" text-anchor="middle">거래처 존재</text>
<text class="b" x="1244.5" y="202.0" text-anchor="middle">구매 주문 금액 일치</text>
<line x1="1250" y1="232" x2="1250" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1000" y="305" width="470" height="100" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="1235.0" y="342.0" text-anchor="middle">일치하는가?</text>
<text class="b" x="1235.0" y="372.0" text-anchor="middle">합계·항목 검산 포함</text>
<line x1="1000" y1="355" x2="660" y2="355" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1235" y1="407" x2="1235" y2="480" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="190" y="305" width="470" height="100" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="425.0" y="342.0" text-anchor="middle">자동 처리</text>
<text class="b" x="425.0" y="372.0" text-anchor="middle">깨끗한 건은 그대로 통과</text>
<rect x="1000" y="485" width="470" height="100" rx="10" fill="#FBE6E6" stroke="#B04A4A" stroke-width="2"/>
<text class="h" x="1235.0" y="522.0" text-anchor="middle">사람 검토 대기열</text>
<text class="b" x="1235.0" y="552.0" text-anchor="middle">불일치·불확실한 건만</text>
<text class="s" x="830" y="345" text-anchor="middle">일치</text>
<text class="s" x="1290" y="450" text-anchor="start">불일치</text>
<rect x="30" y="485" width="700" height="160" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="380.0" y="522.0" text-anchor="middle">역할 분담</text>
<text class="b" x="380.0" y="552.0" text-anchor="middle">비전은 지각(읽기), 도구는 행동</text>
<text class="b" x="380.0" y="582.0" text-anchor="middle">되돌릴 수 없는 행동 앞에는 사람 게이트</text>
<text class="b" x="380.0" y="612.0" text-anchor="middle">한 문서는 한 번에 필요한 정보를 모두 추출</text>
</svg>
