<rect x="30" y="520" width="1440" height="80" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="750" y="553" text-anchor="middle">공통점: 기계적인 일은 Claude, 판단과 검증과 책임은 사람</text>
<text class="s" x="750" y="583" text-anchor="middle">묶음은 노트의 분류이며 책의 순서와 다를 수 있다</text>
