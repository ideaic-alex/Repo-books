<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="520" fill="#FFFFFF"/>
<text class="t" x="750.0" y="62" text-anchor="middle">일에 맞는 입구 고르기</text>
<rect x="40" y="110" width="620" height="105" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="350.0" y="154.5" text-anchor="middle">새 기능 시험, 긴 글, 비교 작업</text>
<text class="b" x="350.0" y="184.5" text-anchor="middle">프로젝트와 기록이 필요한 일</text>
<line x1="662" y1="162" x2="838" y2="162" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="840" y="110" width="620" height="105" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="1150.0" y="154.5" text-anchor="middle">웹 또는 데스크톱</text>
<text class="b" x="1150.0" y="184.5" text-anchor="middle">화면과 키보드가 넉넉한 곳</text>
<rect x="40" y="240" width="620" height="105" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="350.0" y="284.5" text-anchor="middle">작업 중 짧은 질문</text>
<text class="b" x="350.0" y="314.5" text-anchor="middle">다른 창으로 옮기기 싫을 때</text>
<line x1="662" y1="292" x2="838" y2="292" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="840" y="240" width="620" height="105" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="1150.0" y="284.5" text-anchor="middle">데스크톱 전역 단축키</text>
<text class="b" x="1150.0" y="314.5" text-anchor="middle">마찰을 줄여 습관으로</text>
<rect x="40" y="370" width="620" height="105" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="350.0" y="414.5" text-anchor="middle">이동 중, 현물, 손이 바쁠 때</text>
<text class="b" x="350.0" y="444.5" text-anchor="middle">메뉴판, 문서 사진, 운전과 요리</text>
<line x1="662" y1="422" x2="838" y2="422" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="840" y="370" width="620" height="105" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="1150.0" y="414.5" text-anchor="middle">모바일 카메라와 음성</text>
<text class="b" x="1150.0" y="444.5" text-anchor="middle">말로 입력하고 눈으로 읽기</text>
</svg>
