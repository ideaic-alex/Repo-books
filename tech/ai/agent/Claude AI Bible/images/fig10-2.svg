<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="560" fill="#FFFFFF"/>
<text class="t" x="750.0" y="62" text-anchor="middle">예약 작업 하나의 구성 요소</text>
<rect x="30" y="110" width="345" height="140" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="202.5" y="157.0" text-anchor="middle">1. 언제</text>
<text class="b" x="202.5" y="187.0" text-anchor="middle">매일 아침, 매주 월요일</text>
<text class="b" x="202.5" y="217.0" text-anchor="middle">같은 정해진 시각</text>
<line x1="377" y1="180" x2="393" y2="180" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="395" y="110" width="345" height="140" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="567.5" y="157.0" text-anchor="middle">2. 무엇을 읽나</text>
<text class="b" x="567.5" y="187.0" text-anchor="middle">연결 폴더의 파일</text>
<text class="b" x="567.5" y="217.0" text-anchor="middle">또는 커넥터의 데이터</text>
<line x1="742" y1="180" x2="758" y2="180" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="760" y="110" width="345" height="140" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="932.5" y="157.0" text-anchor="middle">3. 어떻게 처리</text>
<text class="b" x="932.5" y="187.0" text-anchor="middle">지표, 비교, 형식을</text>
<text class="b" x="932.5" y="217.0" text-anchor="middle">구체적으로 지시</text>
<line x1="1107" y1="180" x2="1123" y2="180" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1125" y="110" width="345" height="140" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="1297.5" y="157.0" text-anchor="middle">4. 어디에 저장</text>
<text class="b" x="1297.5" y="187.0" text-anchor="middle">저장 위치와</text>
<text class="b" x="1297.5" y="217.0" text-anchor="middle">파일 이름 규칙</text>
<rect x="30" y="310" width="700" height="130" rx="10" fill="#FBE6E6" stroke="#B04A4A" stroke-width="2"/>
<text class="h" x="380.0" y="352.0" text-anchor="middle">경계 문장 (지시문에 반드시)</text>
<text class="b" x="380.0" y="382.0" text-anchor="middle">읽기 전용, 원본 수정 금지,</text>
<text class="b" x="380.0" y="412.0" text-anchor="middle">답장이나 변경 금지</text>
<rect x="770" y="310" width="700" height="130" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="1120.0" y="352.0" text-anchor="middle">운영 습관</text>
<text class="b" x="1120.0" y="382.0" text-anchor="middle">처음 며칠은 실제 데이터와 대조</text>
<text class="b" x="1120.0" y="412.0" text-anchor="middle">결과를 안 읽는 작업은 정리</text>
</svg>
