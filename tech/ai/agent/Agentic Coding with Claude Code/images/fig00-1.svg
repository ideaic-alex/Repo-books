<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#455A64"/></marker></defs>
<rect width="1500" height="660" fill="#fff"/>
<text x="750" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#222">이 책의 세 부분과 11개 장</text>
<g text-anchor="middle" fill="#222">
<rect x="30" y="85" width="450" height="95" rx="10" fill="#E8F0F9" stroke="#1E5AA8" stroke-width="2.5"/>
<text x="255" y="123" font-size="23" font-weight="bold">1부 기초</text>
<text x="255" y="156" font-size="19">컨텍스트 엔지니어링과 Claude Code</text>
<rect x="30" y="205" width="450" height="70" rx="10" fill="#fff" stroke="#1E5AA8" stroke-width="1.8"/><text x="255" y="248" font-size="20">1장 컨텍스트 엔지니어링</text>
<rect x="30" y="295" width="450" height="70" rx="10" fill="#fff" stroke="#1E5AA8" stroke-width="1.8"/><text x="255" y="338" font-size="20">2장 Claude Code 한눈에 보기</text>
<rect x="30" y="385" width="450" height="70" rx="10" fill="#fff" stroke="#1E5AA8" stroke-width="1.8"/><text x="255" y="428" font-size="20">3장 핵심 명령어 둘러보기</text>

<rect x="525" y="85" width="450" height="95" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/>
<text x="750" y="123" font-size="23" font-weight="bold">2부 확장</text>
<text x="750" y="156" font-size="19">프로토콜, 자동화, 구조화된 워크플로</text>
<rect x="525" y="205" width="450" height="70" rx="10" fill="#fff" stroke="#2E7D32" stroke-width="1.8"/><text x="750" y="248" font-size="20">4장 MCP 서버와 플러그인</text>
<rect x="525" y="295" width="450" height="70" rx="10" fill="#fff" stroke="#2E7D32" stroke-width="1.8"/><text x="750" y="338" font-size="20">5장 GitHub로 워크플로 자동화</text>
<rect x="525" y="385" width="450" height="70" rx="10" fill="#fff" stroke="#2E7D32" stroke-width="1.8"/><text x="750" y="428" font-size="20">6장 계획 모드와 멀티 에이전트</text>
<rect x="525" y="475" width="450" height="70" rx="10" fill="#fff" stroke="#2E7D32" stroke-width="1.8"/><text x="750" y="518" font-size="20">7장 서브에이전트 활용</text>
<rect x="525" y="565" width="450" height="70" rx="10" fill="#fff" stroke="#2E7D32" stroke-width="1.8"/><text x="750" y="608" font-size="20">8장 출력 스타일과 상태줄</text>

<rect x="1020" y="85" width="450" height="95" rx="10" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2.5"/>
<text x="1245" y="123" font-size="23" font-weight="bold">3부 심화</text>
<text x="1245" y="156" font-size="19">고급 에이전트와 시스템 설계</text>
<rect x="1020" y="205" width="450" height="70" rx="10" fill="#fff" stroke="#7B1FA2" stroke-width="1.8"/><text x="1245" y="248" font-size="20">9장 에이전트 스킬</text>
<rect x="1020" y="295" width="450" height="70" rx="10" fill="#fff" stroke="#7B1FA2" stroke-width="1.8"/><text x="1245" y="338" font-size="20">10장 Claude Code 데스크톱</text>
<rect x="1020" y="385" width="450" height="70" rx="10" fill="#fff" stroke="#7B1FA2" stroke-width="1.8"/><text x="1245" y="428" font-size="20">11장 딥 에이전트</text>
</g>
<line x1="480" y1="132" x2="525" y2="132" stroke="#455A64" stroke-width="3" marker-end="url(#a)"/>
