<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#555"/></marker></defs>
<rect width="1500" height="720" fill="#fff"/>
<text x="750" y="55" text-anchor="middle" font-size="34" font-weight="bold" fill="#222">되감기(rewind)의 세 가지 선택지</text>
<rect x="450" y="90" width="600" height="90" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/>
<text x="750.0" y="127.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">/rewind 또는 Esc 두 번</text>
<text x="750.0" y="156.5" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">세션 타임라인에서 되돌릴 프롬프트 선택</text>
<line x1="750" y1="182" x2="260" y2="258" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<rect x="60" y="260" width="400" height="150" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/>
<text x="260.0" y="312.35" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">코드와 대화 복원</text>
<text x="260.0" y="342.35" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">파일과 대화를 그 시점으로</text>
<text x="260.0" y="372.35" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">가장 흔한 선택</text>
<line x1="750" y1="182" x2="730" y2="258" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<rect x="530" y="260" width="400" height="150" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/>
<text x="730.0" y="312.35" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">대화만 복원</text>
<text x="730.0" y="342.35" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">파일 변경은 그대로 둠</text>
<text x="730.0" y="372.35" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">대화 맥락만 되돌릴 때</text>
<line x1="750" y1="182" x2="1200" y2="258" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<rect x="1000" y="260" width="400" height="150" rx="10" fill="#F3E5F5" stroke="#7B3F99" stroke-width="2.5"/>
<text x="1200.0" y="312.35" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">코드만 복원</text>
<text x="1200.0" y="342.35" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">대화 기록은 그대로 둠</text>
<text x="1200.0" y="372.35" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">구현을 다시 작업할 때</text>
<rect x="60" y="470" width="1380" height="90" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/>
<text x="750.0" y="522.35" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">체크포인트: 코드를 바꾸는 프롬프트마다 자동 생성 / 세션을 넘어 유지 / 최대 30일 보관</text>
<rect x="60" y="590" width="1380" height="100" rx="10" fill="#FDECEA" stroke="#B3372D" stroke-width="2.5"/>
<text x="750.0" y="632.35" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">한계: Bash 명령 결과와 Claude Code 밖의 수동 수정은 추적되지 않음</text>
<text x="750.0" y="662.35" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">Git을 대신하지 못하는 로컬 단기 실행 취소</text>
</svg>
