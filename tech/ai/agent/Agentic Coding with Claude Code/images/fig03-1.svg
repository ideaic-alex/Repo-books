<text x="1130.0" y="329.35" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">my-company/CLAUDE.md</text>
<rect x="890" y="430" width="480" height="64" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/>
