<text x="420.0" y="559.35" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">5 프로젝트 로컬 메모리</text>
<text x="420.0" y="589.35" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">./CLAUDE.local.md / 개인 전용, Git 무시</text>
