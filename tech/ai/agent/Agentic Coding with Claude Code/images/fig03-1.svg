<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="740" viewBox="0 0 1500 740" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#555"/></marker></defs>
<rect width="1500" height="740" fill="#fff"/>
<text x="750" y="55" text-anchor="middle" font-size="34" font-weight="bold" fill="#222">Claude Code 메모리 계층과 불러오는 방식</text>
<text x="420" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#B3372D">위 단계가 우선 (아래가 덮어쓸 수 없음)</text>
<rect x="40" y="125" width="760" height="84" rx="10" fill="#FDECEA" stroke="#B3372D" stroke-width="2.5"/>
<text x="420.0" y="159.35" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">1 관리형 정책 (최우선)</text>
