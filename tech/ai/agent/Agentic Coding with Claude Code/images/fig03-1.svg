<rect x="40" y="225" width="760" height="84" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/>
<text x="420.0" y="259.35" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">2 사용자 메모리</text>
