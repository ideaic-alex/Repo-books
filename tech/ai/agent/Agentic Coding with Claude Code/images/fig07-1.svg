<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#444"/></marker></defs>
<rect width="1500" height="620" fill="#FFFFFF"/>
<text x="750" y="58" font-size="34" font-weight="bold" text-anchor="middle" fill="#222">서브에이전트의 컨텍스트 흐름</text>
<rect x="40" y="110" width="420" height="330" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/>
<text x="250.0" y="237.35" font-size="21" text-anchor="middle" fill="#222" font-weight="bold">메인 에이전트 스레드</text>
<text x="250.0" y="267.35" font-size="21" text-anchor="middle" fill="#222">대화가 쌓일수록 컨텍스트 증가</text>
<text x="250.0" y="297.35" font-size="21" text-anchor="middle" fill="#222">도구 결과와 시행착오도 누적</text>
<text x="250.0" y="327.35" font-size="21" text-anchor="middle" fill="#222">가볍게 유지하고 싶은 영역</text>
<rect x="580" y="110" width="420" height="330" rx="10" fill="#FFF3E0" stroke="#E08A00" stroke-width="2.5"/>
<text x="790.0" y="222.35" font-size="21" text-anchor="middle" fill="#222" font-weight="bold">서브에이전트</text>
<text x="790.0" y="252.35" font-size="21" text-anchor="middle" fill="#222">새 컨텍스트로 시작</text>
<text x="790.0" y="282.35" font-size="21" text-anchor="middle" fill="#222">받는 것은 프롬프트 한 개뿐</text>
<text x="790.0" y="312.35" font-size="21" text-anchor="middle" fill="#222">자체 시스템 프롬프트와 도구</text>
<text x="790.0" y="342.35" font-size="21" text-anchor="middle" fill="#222">내부 작업은 여기서만 소모</text>
<rect x="1120" y="110" width="340" height="330" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/>
<text x="1290.0" y="237.35" font-size="21" text-anchor="middle" fill="#222" font-weight="bold">결과</text>
<text x="1290.0" y="267.35" font-size="21" text-anchor="middle" fill="#222">압축된 응답 한 개</text>
<text x="1290.0" y="297.35" font-size="21" text-anchor="middle" fill="#222">내부 컨텍스트는 버려진다</text>
<text x="1290.0" y="327.35" font-size="21" text-anchor="middle" fill="#222">메인에는 요약만 남는다</text>
<line x1="460" y1="260" x2="580" y2="260" stroke="#444" stroke-width="3" marker-end="url(#a)"/>
<text x="520" y="235" font-size="20" text-anchor="middle" fill="#333">프롬프트 1개</text>
<line x1="1000" y1="260" x2="1120" y2="260" stroke="#444" stroke-width="3" marker-end="url(#a)"/>
<text x="1060" y="235" font-size="20" text-anchor="middle" fill="#333">응답 1개</text>
<rect x="40" y="480" width="1420" height="100" rx="10" fill="#F3E5F5" stroke="#7B3FA0" stroke-width="2.5"/>
<text x="750.0" y="537.35" font-size="21" text-anchor="middle" fill="#222">효과: 메인 컨텍스트가 작게 유지되어 /compact 와 /clear 를 덜 쓰게 되고, 성능 저하와 비용 증가가 늦어진다</text>
</svg>