<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#444"/></marker></defs>
<rect width="1500" height="560" fill="#FFFFFF"/>
<text x="750" y="58" font-size="34" font-weight="bold" text-anchor="middle" fill="#222">계획 모드: 읽기만 하는 단계와 실행 단계의 분리</text>
<rect x="60" y="110" width="240" height="150" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/>
<text x="180.0" y="163.65" font-size="19" text-anchor="middle" fill="#222" font-weight="bold">1. 조사와 분석</text>
<text x="180.0" y="191.65" font-size="19" text-anchor="middle" fill="#222">코드베이스와 요구사항 읽기</text>
<text x="180.0" y="219.65" font-size="19" text-anchor="middle" fill="#222">문서 검색, MCP 조회</text>
<rect x="440" y="110" width="240" height="150" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/>
<text x="560.0" y="163.65" font-size="19" text-anchor="middle" fill="#222" font-weight="bold">2. 계획서 작성</text>
<text x="560.0" y="191.65" font-size="19" text-anchor="middle" fill="#222">구현 계획 또는</text>
<text x="560.0" y="219.65" font-size="19" text-anchor="middle" fill="#222">스펙 문서를 만든다</text>
<rect x="820" y="110" width="240" height="150" rx="10" fill="#FFF3E0" stroke="#E08A00" stroke-width="2.5"/>
<text x="940.0" y="163.65" font-size="19" text-anchor="middle" fill="#222" font-weight="bold">3. 사람의 검토</text>
<text x="940.0" y="191.65" font-size="19" text-anchor="middle" fill="#222">계획을 보여 주고</text>
<text x="940.0" y="219.65" font-size="19" text-anchor="middle" fill="#222">수정 의견을 받는다</text>
<rect x="1200" y="110" width="240" height="150" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/>
<text x="1320.0" y="163.65" font-size="19" text-anchor="middle" fill="#222" font-weight="bold">4. 승인 후 실행</text>
<text x="1320.0" y="191.65" font-size="19" text-anchor="middle" fill="#222">계획 모드를 나가</text>
<text x="1320.0" y="219.65" font-size="19" text-anchor="middle" fill="#222">비로소 구현을 시작</text>
<line x1="300" y1="185" x2="440" y2="185" stroke="#444" stroke-width="3" marker-end="url(#a)"/>
<line x1="680" y1="185" x2="820" y2="185" stroke="#444" stroke-width="3" marker-end="url(#a)"/>
<line x1="1060" y1="185" x2="1200" y2="185" stroke="#444" stroke-width="3" marker-end="url(#a)"/>
<text x="750" y="305" font-size="22" text-anchor="middle" fill="#333" font-weight="bold">1단계부터 3단계까지가 읽기 전용 구간이고, 승인 전에는 코드가 바뀌지 않는다</text>
<rect x="60" y="350" width="660" height="170" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/>
<text x="390.0" y="412.35" font-size="21" text-anchor="middle" fill="#222" font-weight="bold">계획 모드에서 가능한 일</text>
<text x="390.0" y="442.35" font-size="21" text-anchor="middle" fill="#222">파일 읽기, 코드베이스 분석</text>
<text x="390.0" y="472.35" font-size="21" text-anchor="middle" fill="#222">MCP 호출, 문서 검색, 설계</text>
<rect x="780" y="350" width="660" height="170" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="2.5"/>
<text x="1110.0" y="412.35" font-size="21" text-anchor="middle" fill="#222" font-weight="bold">계획 모드에서 불가능한 일</text>
<text x="1110.0" y="442.35" font-size="21" text-anchor="middle" fill="#222">파일 편집, 생성, 삭제</text>
<text x="1110.0" y="472.35" font-size="21" text-anchor="middle" fill="#222">깃 커밋, 패키지 설치, 실행</text>
</svg>