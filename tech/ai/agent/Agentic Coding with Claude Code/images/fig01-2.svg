<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#455A64"/></marker></defs>
<rect width="1500" height="620" fill="#fff"/>
<text x="750" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#222">시스템 프롬프트의 적정 지점</text>
<line x1="150" y1="105" x2="750" y2="105" stroke="#455A64" stroke-width="3"/>
<line x1="750" y1="105" x2="1350" y2="105" stroke="#455A64" stroke-width="3"/>
<circle cx="750" cy="105" r="9" fill="#2E7D32"/>
<g text-anchor="middle" fill="#222">
<text x="260" y="145" font-size="20">규칙을 하나하나 박아 넣음</text>
<text x="1240" y="145" font-size="20">원칙이 거의 없음</text>
<rect x="40" y="170" width="440" height="410" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="2.5"/>
<text x="260" y="215" font-size="25" font-weight="bold">너무 구체적</text>
<text x="260" y="262" font-size="20">모델을 상태 기계처럼 취급</text>
<text x="260" y="310" font-size="19">예: 사고 해결이면</text><text x="260" y="340" font-size="19">후속 질문 세 개</text>
<text x="260" y="390" font-size="19">모든 경우를 나열하려 함</text>
<text x="260" y="440" font-size="19">새 예외마다 프롬프트 수정</text>
<text x="260" y="490" font-size="19">전부 정해졌다면</text><text x="260" y="520" font-size="19">고정 워크플로로 충분</text>
<rect x="530" y="170" width="440" height="410" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="4"/>
<text x="750" y="215" font-size="25" font-weight="bold">적정 지점</text>
<text x="750" y="262" font-size="20">명확하되 간결하게</text>
<text x="750" y="310" font-size="19">역할과 범위를 분명히</text>
<text x="750" y="360" font-size="19">목표를 주고 도구 선택은 위임</text>
<text x="750" y="410" font-size="19">순서도 대신 사고 틀 제시</text>
<text x="750" y="460" font-size="19">휴리스틱과 한계선 명시</text>
<text x="750" y="510" font-size="19">겹치거나 모순된 지시 없음</text>
<rect x="1020" y="170" width="440" height="410" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2.5"/>
<text x="1240" y="215" font-size="25" font-weight="bold">너무 모호</text>
<text x="1240" y="262" font-size="20">행동을 정하기엔 신호 부족</text>
<text x="1240" y="310" font-size="19">예: 브랜드 원칙에 맞게</text><text x="1240" y="340" font-size="19">해결하라</text>
<text x="1240" y="390" font-size="19">공유 맥락이 있다고 착각</text>
<text x="1240" y="440" font-size="19">경계가 없음</text><text x="1240" y="470" font-size="19">(필요하면 사람에게)</text>
<text x="1240" y="520" font-size="19">실행마다 접근이 달라짐</text>
</g>
</svg>
