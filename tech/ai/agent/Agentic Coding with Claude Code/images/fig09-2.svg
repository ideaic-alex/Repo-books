<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#555"/></marker></defs>
<rect width="1500" height="700" fill="#ffffff"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#222">
<text x="750" y="55" font-size="34" font-weight="bold" text-anchor="middle">프로젝트 스킬의 폴더 구조와 파일별 로딩 시점</text>

<rect x="40" y="100" width="560" height="330" rx="10" fill="#F5F5F5" stroke="#777" stroke-width="2"/>
<text x="320" y="140" font-size="22" font-weight="bold" text-anchor="middle">폴더 구조</text>
<text x="70" y="195" font-size="20" font-family="Consolas, Courier New, monospace">.claude/</text>
<text x="100" y="235" font-size="20" font-family="Consolas, Courier New, monospace">skills/git-pushing/</text>
<rect x="125" y="255" width="440" height="50" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
<text x="145" y="288" font-size="20" font-family="Consolas, Courier New, monospace">SKILL.md</text>
<text x="135" y="345" font-size="20" font-family="Consolas, Courier New, monospace">scripts/</text>
<rect x="165" y="360" width="400" height="50" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2"/>
<text x="185" y="393" font-size="20" font-family="Consolas, Courier New, monospace">smart_commit.sh</text>

<line x1="605" y1="280" x2="685" y2="280" stroke="#555" stroke-width="3" marker-end="url(#a)"/>

<g text-anchor="middle">
<rect x="690" y="100" width="770" height="95" rx="10" fill="#E8F0F9" stroke="#1565C0" stroke-width="2"/>
<text x="1075" y="140" font-size="20" font-weight="bold">SKILL.md 위쪽 프런트매터 (name, description)</text>
<text x="1075" y="173" font-size="19">항상 시스템 프롬프트에 있다. 스킬 선택은 여기서 결정</text>

<rect x="690" y="225" width="770" height="95" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
<text x="1075" y="265" font-size="20" font-weight="bold">SKILL.md 아래쪽 본문 (When to Use, Workflow)</text>
<text x="1075" y="298" font-size="19">스킬이 선택된 뒤에야 읽힌다. 여기를 고쳐도 선택은 안 바뀐다</text>

<rect x="690" y="350" width="770" height="95" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2"/>
<text x="1075" y="390" font-size="20" font-weight="bold">scripts/smart_commit.sh</text>
<text x="1075" y="423" font-size="19">에이전트가 실행하기로 정했을 때만 컨텍스트에 들어온다</text>

<rect x="40" y="490" width="1420" height="170" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="2"/>
<text x="750" y="530" font-size="22" font-weight="bold">경로가 틀어졌을 때</text>
<text x="750" y="575" font-size="19">smart_commit.sh를 scripts 밖으로 옮겨 경로가 틀려도 에이전트가 저장소를 살펴 찾아서 실행한다</text>
<text x="750" y="612" font-size="19">파일을 아예 지우면 실행할 대상이 없으므로 실패한다</text>
</g>
</g>
</svg>
