<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1500" height="780" fill="#FFFFFF"/><text x="750" y="62" text-anchor="middle" font-size="34" font-weight="bold" fill="#222">업무 문서 세 종류의 뼈대</text><rect x="60" y="100" width="440" height="70" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="280.0" y="144" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">이메일</text><rect x="60" y="205" width="440" height="70" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="280.0" y="247" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">1. 목적 한 문장</text><line x1="280" y1="275" x2="280" y2="305" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="305" width="440" height="70" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="280.0" y="347" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">2. 맥락 2-3문장</text><line x1="280" y1="375" x2="280" y2="405" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="405" width="440" height="70" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="280.0" y="447" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">3. 구체적인 다음 행동 하나</text><line x1="280" y1="475" x2="280" y2="505" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="505" width="440" height="70" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="280.0" y="547" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">4. 150단어 이내</text><rect x="530" y="100" width="440" height="70" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="750.0" y="144" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">메모</text><rect x="530" y="205" width="440" height="70" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="750.0" y="247" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">1. 맨 위 한 줄 요약</text><line x1="750" y1="275" x2="750" y2="305" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="530" y="305" width="440" height="70" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="750.0" y="347" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">2. 배경 (놓친 사람용)</text><line x1="750" y1="375" x2="750" y2="405" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="530" y="405" width="440" height="70" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="750.0" y="447" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">3. 결정 또는 발표</text><line x1="750" y1="475" x2="750" y2="505" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="530" y="505" width="440" height="70" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="750.0" y="547" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">4. 독자에게 바라는 행동</text><rect x="1000" y="100" width="440" height="70" rx="10" fill="#FFF3E0" stroke="#C77800" stroke-width="2.5"/><text x="1220.0" y="144" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">보고서</text><rect x="1000" y="205" width="440" height="70" rx="10" fill="#FFF3E0" stroke="#C77800" stroke-width="2.5"/><text x="1220.0" y="247" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">1. 섹션 개요 먼저 제안</text><line x1="1220" y1="275" x2="1220" y2="305" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="1000" y="305" width="440" height="70" rx="10" fill="#FFF3E0" stroke="#C77800" stroke-width="2.5"/><text x="1220.0" y="347" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">2. 개요를 읽고 조정</text><line x1="1220" y1="375" x2="1220" y2="405" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="1000" y="405" width="440" height="70" rx="10" fill="#FFF3E0" stroke="#C77800" stroke-width="2.5"/><text x="1220.0" y="447" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">3. 섹션별 초안 작성</text><line x1="1220" y1="475" x2="1220" y2="505" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="1000" y="505" width="440" height="70" rx="10" fill="#FFF3E0" stroke="#C77800" stroke-width="2.5"/><text x="1220.0" y="547" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">4. 마지막 일관성 점검</text><rect x="60" y="630" width="1380" height="100" rx="10" fill="#FDECEA" stroke="#B83A32" stroke-width="2.5"/><text x="750.0" y="688" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">맥락과 판단은 사람이 준다 - 민감한 글은 접근을 둘 이상 받아 비교하고, 보내기 전에 소리 내어 읽는다</text></svg>