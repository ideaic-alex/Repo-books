<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1500" height="800" fill="#fff"/><g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><text x="750" y="58" text-anchor="middle" font-size="34" font-weight="bold" fill="#1d2b3a">공유 프로젝트의 구조와 권한</text><rect x="480" y="110" width="540" height="230" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="750.0" y="187" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">팀 공유 프로젝트</text><text x="750.0" y="217" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">지식: 스타일 가이드, 표준 템플릿</text><text x="750.0" y="247" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">지침: 팀 합의로 쓴 사용자 지침</text><text x="750.0" y="277" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">담당자: 최신 상태 유지 책임</text><rect x="60" y="150" width="300" height="150" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/><text x="210.0" y="202" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">편집 권한</text><text x="210.0" y="232" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">팀장, 선임 1명</text><text x="210.0" y="262" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">핵심 자료를 고치는 사람</text><rect x="1140" y="150" width="300" height="150" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="1290.0" y="202" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">보기 권한</text><text x="1290.0" y="232" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">나머지 팀원 전체</text><text x="1290.0" y="262" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">읽고 활용만 한다</text><line x1="360" y1="225" x2="480" y2="225" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><line x1="1140" y1="225" x2="1020" y2="225" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><text x="420" y="205" text-anchor="middle" font-size="19" font-weight="normal" fill="#333">수정</text><text x="1080" y="205" text-anchor="middle" font-size="19" font-weight="normal" fill="#333">참조</text><text x="750" y="395" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">새 팀원을 위한 온보딩 문서</text><rect x="60" y="430" width="330" height="110" rx="10" fill="#F3E5F5" stroke="#7B3F98" stroke-width="2.5"/><text x="225.0" y="477" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">1. 공유 프로젝트 안내</text><text x="225.0" y="507" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">어디에 쓰는지</text><rect x="420" y="430" width="330" height="110" rx="10" fill="#F3E5F5" stroke="#7B3F98" stroke-width="2.5"/><text x="585.0" y="477" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">2. 핵심 표준</text><text x="585.0" y="507" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">문체, 검증, 민감정보</text><rect x="780" y="430" width="330" height="110" rx="10" fill="#F3E5F5" stroke="#7B3F98" stroke-width="2.5"/><text x="945.0" y="477" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">3. 모범 결과물</text><text x="945.0" y="507" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">품질 기준 실물</text><rect x="1140" y="430" width="330" height="110" rx="10" fill="#F3E5F5" stroke="#7B3F98" stroke-width="2.5"/><text x="1305.0" y="477" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">4. 문의 창구</text><text x="1305.0" y="507" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">물어볼 사람</text><text x="750" y="605" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">팀에서 새로 생기는 문제 네 가지</text><rect x="60" y="640" width="330" height="110" rx="10" fill="#FDECEA" stroke="#B3372B" stroke-width="2.5"/><text x="225.0" y="687" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">품질과 문체</text><text x="225.0" y="717" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">들쭉날쭉</text><rect x="420" y="640" width="330" height="110" rx="10" fill="#FDECEA" stroke="#B3372B" stroke-width="2.5"/><text x="585.0" y="687" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">중복 작업</text><text x="585.0" y="717" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">같은 것을 다시 만든다</text><rect x="780" y="640" width="330" height="110" rx="10" fill="#FDECEA" stroke="#B3372B" stroke-width="2.5"/><text x="945.0" y="687" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">지식 사일로</text><text x="945.0" y="717" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">한 사람만 아는 자료</text><rect x="1140" y="640" width="330" height="110" rx="10" fill="#FDECEA" stroke="#B3372B" stroke-width="2.5"/><text x="1305.0" y="687" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">민감정보 판단</text><text x="1305.0" y="717" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">사람마다 다르다</text></g></svg>