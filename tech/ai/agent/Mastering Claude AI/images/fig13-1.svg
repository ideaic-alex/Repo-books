<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1500" height="800" fill="#FFFFFF"/><text x="750" y="62" text-anchor="middle" font-size="34" font-weight="bold" fill="#222">마케팅 캠페인 작업 흐름</text><rect x="60" y="110" width="400" height="130" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="260.0" y="153" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">1. 브랜드 보이스 브리프</text><text x="260.0" y="182" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">성격 세 단어, 좋은 예,</text><text x="260.0" y="211" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">나쁜 예, 어휘 규칙, 독자</text><rect x="550" y="110" width="400" height="130" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="750.0" y="153" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">2. 핵심 메시지 확정</text><text x="750.0" y="182" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">가장 이해시킬 한 가지를</text><text x="750.0" y="211" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">먼저 잠근다</text><rect x="1040" y="110" width="400" height="130" rx="10" fill="#FFF3E0" stroke="#C77800" stroke-width="2.5"/><text x="1240.0" y="153" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">3. 채널별 초안</text><text x="1240.0" y="182" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">이메일, SNS, 랜딩 페이지</text><text x="1240.0" y="211" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">형식에 맞게 변주</text><line x1="460" y1="175" x2="550" y2="175" stroke="#555" stroke-width="3" marker-end="url(#a)"/><line x1="950" y1="175" x2="1040" y2="175" stroke="#555" stroke-width="3" marker-end="url(#a)"/><line x1="1240" y1="240" x2="1240" y2="330" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="1040" y="330" width="400" height="130" rx="10" fill="#F3E5F5" stroke="#7B3FA0" stroke-width="2.5"/><text x="1240.0" y="373" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">4. 교차 일관성 점검</text><text x="1240.0" y="402" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">전체 조각이 같은 메시지를</text><text x="1240.0" y="431" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">강화하는지 확인</text><rect x="550" y="330" width="400" height="130" rx="10" fill="#FDECEA" stroke="#B83A32" stroke-width="2.5"/><text x="750.0" y="373" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">5. 사실 확인 패스</text><text x="750.0" y="402" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">통계, 비교, 보장 문구는</text><text x="750.0" y="431" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">독립적으로 검증</text><rect x="60" y="330" width="400" height="130" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="260.0" y="373" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">6. 사람 승인 후 발행</text><text x="260.0" y="402" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">법적, 규제 무게가 있는</text><text x="260.0" y="431" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">주장은 권한자가 서명</text><line x1="1040" y1="395" x2="950" y2="395" stroke="#555" stroke-width="3" marker-end="url(#a)"/><line x1="550" y1="395" x2="460" y2="395" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="530" width="1380" height="200" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="750.0" y="592" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">각도를 바꿔 변주하기 (A/B 틀짜기)</text><text x="750.0" y="622" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">숫자 중심, 고객 고민 중심, 사회적 증거 중심, 질문형, 대담한 단언처럼</text><text x="750.0" y="652" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">단어가 아니라 접근을 달리해 다섯 개를 받고, 각 안에 각도 이름표를 붙인다</text><text x="750.0" y="682" text-anchor="middle" font-size="21" font-weight="normal" fill="#222">첫 묶음은 시작점일 뿐이므로 약한 안과 강한 안을 Claude에게 비평하게 한다</text></svg>