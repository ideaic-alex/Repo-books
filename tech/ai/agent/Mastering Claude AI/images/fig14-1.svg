#555" stroke-width="3" marker-end="url(#a)"/><rect x="770" y="450" width="330" height="230" rx="10" fill="#FFF3E0" stroke="#C77800" stroke-width="2.5"/><text x="935.0" y="558" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">공개, 브랜드</text><text x="935.0" y="586" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">전체 5단계 + 타인 검토</text><line x1="1100" y1="540" x2="1130" y2="500" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="1130" y="410" width="330" height="270" rx="10" fill="#FDECEA" stroke="#B83A32" stroke-width="2.5"/><text x="1295.0" y="538" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">고위험, 고노출</text><text x="1295.0" y="566" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">여러 번 패스 + 편집 검토</text></svg>