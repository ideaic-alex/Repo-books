<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="740" viewBox="0 0 1500 740" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1500" height="740" fill="#FFFFFF"/><text x="750" y="62" text-anchor="middle" font-size="34" font-weight="bold" fill="#222">자기 편집 5단계와 공들일 깊이</text><rect x="50" y="110" width="260" height="170" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="180.0" y="158" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">1 패턴</text><text x="180.0" y="188" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">군말 시작, 헤지,</text><text x="180.0" y="216" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">기계적 접속어,</text><text x="180.0" y="246" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">막연한 강조어</text><rect x="335" y="110" width="260" height="170" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="465.0" y="173" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">2 구체성</text><text x="465.0" y="202" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">어느 글에나</text><text x="465.0" y="231" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">맞는 주장 표시</text><rect x="620" y="110" width="260" height="170" rx="10" fill="#FFF3E0" stroke="#C77800" stroke-width="2.5"/><text x="750.0" y="173" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">3 목소리</text><text x="750.0" y="202" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">샘플과 비교해</text><text x="750.0" y="231" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">어긋남 표시</text><rect x="905" y="110" width="260" height="170" rx="10" fill="#F3E5F5" stroke="#7B3FA0" stroke-width="2.5"/><text x="1035.0" y="173" text-anchor="mi