<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1500" height="780" fill="#fff"/><g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><text x="750" y="58" text-anchor="middle" font-size="34" font-weight="bold" fill="#1d2b3a">정보 민감도 3단계와 다루는 방법</text><text x="230" y="115" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">단계</text><text x="750" y="115" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">예시</text><text x="1270" y="115" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">다루는 방법</text><rect x="60" y="135" width="340" height="110" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="230.0" y="197" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">낮음</text><rect x="430" y="135" width="600" height="110" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="730.0" y="182" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">일반 업무 질문, 공개 정보</text><text x="730.0" y="212" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">가상의 시나리오</text><rect x="1060" y="135" width="380" height="110" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="1250.0" y="182" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">그대로 자유롭게 공유</text><text x="1250.0" y="211" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">풍부한 맥락을 아끼지 않는다</text><line x1="400" y1="190" x2="430" y2="190" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><line x1="1030" y1="190" x2="1060" y2="190" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><rect x="60" y="270" width="340" height="110" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/><text x="230.0" y="332" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">보통</text><rect x="430" y="270" width="600" height="110" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/><text x="730.0" y="317" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">내부 전략, 비공개이지만</text><text x="730.0" y="347" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">법으로 규제되지는 않는 정보</text><rect x="1060" y="270" width="380" height="110" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/><text x="1250.0" y="317" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">신중하게 공유</text><text x="1250.0" y="346" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">세부 사항을 익명화할 수 있는지 본다</text><line x1="400" y1="325" x2="430" y2="325" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><line x1="1030" y1="325" x2="1060" y2="325" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><rect x="60" y="405" width="340" height="110" rx="10" fill="#FDECEA" stroke="#B3372B" stroke-width="2.5"/><text x="230.0" y="467" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">높음</text><rect x="430" y="405" width="600" height="110" rx="10" fill="#FDECEA" stroke="#B3372B" stroke-width="2.5"/><text x="730.0" y="452" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">고객 개인정보, 건강 정보, 계좌 정보</text><text x="730.0" y="482" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">영업 비밀, 법으로 규제되는 정보</text><rect x="1060" y="405" width="380" height="110" rx="10" fill="#FDECEA" stroke="#B3372B" stroke-width="2.5"/><text x="1250.0" y="452" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">최대한 조심한다</text><text x="1250.0" y="481" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">익명화, 자리표시자, 또는 공유 안 함</text><line x1="400" y1="460" x2="430" y2="460" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><line x1="1030" y1="460" x2="1060" y2="460" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><text x="750" y="570" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">익명화 습관: 실제 정보를 바꿔서 보낸다</text><rect x="60" y="600" width="400" height="110" rx="10" fill="#FFFFFF" stroke="#555555" stroke-width="2.5"/><text x="260.0" y="647" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">실제 정보</text><text x="260.0" y="677" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">고객 홍길동, 연매출 2억 원</text><rect x="550" y="600" width="400" height="110" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="750.0" y="647" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">자리표시자로 치환</text><text x="750.0" y="677" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">고객 A, 연매출 약 2억 원 규모</text><rect x="1040" y="600" width="400" height="110" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="1240.0" y="647" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Claude에 전달</text><text x="1240.0" y="677" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">상황의 규모와 성격은 그대로</text><line x1="460" y1="655" x2="550" y2="655" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><line x1="950" y1="655" x2="1040" y2="655" stroke="#444" stroke-width="3" marker-end="url(#ah)"/></g></svg>