<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#444"/></marker></defs>
<rect width="1500" height="600" fill="#fff"/>
<text x="750" y="55" text-anchor="middle" font-size="34" font-weight="bold" fill="#222">코딩 입문의 두 길과 작은 프로젝트 사다리</text>
<rect x="60" y="110" width="640" height="120" rx="10" fill="#E8F0F9" stroke="#2F5C8F" stroke-width="2.5"/>
<text x="380.0" y="162.35" text-anchor="middle" font-size="21" fill="#222" font-weight="bold">목표 A: 결과물이 필요하다</text>
<text x="380.0" y="192.35" text-anchor="middle" font-size="21" fill="#222">설명하고, 테스트하고, 고치는 데 집중 (19장 방식)</text>
<rect x="800" y="110" width="640" height="120" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/>
<text x="1120.0" y="162.35" text-anchor="middle" font-size="21" fill="#222" font-weight="bold">목표 B: 코딩을 배우고 싶다</text>
<text x="1120.0" y="192.35" text-anchor="middle" font-size="21" fill="#222">직접 쓰고, Claude는 안내자와 디버거</text>
<text x="750" y="275" text-anchor="middle" font-size="22" fill="#222" font-weight="bold">프롬프트에 어느 쪽인지 밝힌다</text>
<rect x="60" y="320" width="300" height="110" rx="10" fill="#F3E5F5" stroke="#7B3FA0" stroke-width="2.5"/>
<text x="210.0" y="367.35" text-anchor="middle" font-size="21" fill="#222" font-weight="bold">1. 아주 작은 프로그램</text>
<text x="210.0" y="397.35" text-anchor="middle" font-size="21" fill="#222">실행해 보기</text>
<line x1="360" y1="375" x2="415" y2="375" stroke="#444" stroke-width="3" marker-end="url(#a)"/>
<rect x="415" y="320" width="300" height="110" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/>
<text x="565.0" y="367.35" text-anchor="middle" font-size="21" fill="#222" font-weight="bold">2. 한 줄씩 설명 듣기</text>
<text x="565.0" y="397.35" text-anchor="middle" font-size="21" fill="#222">쉬운 말로</text>
<line x1="715" y1="375" x2="770" y2="375" stroke="#444" stroke-width="3" marker-end="url(#a)"/>
<rect x="770" y="320" width="300" height="110" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="2.5"/>
<text x="920.0" y="367.35" text-anchor="middle" font-size="21" fill="#222" font-weight="bold">3. 직접 고쳐 보기</text>
<text x="920.0" y="397.35" text-anchor="middle" font-size="21" fill="#222">깨지면 디버깅</text>
<line x1="1070" y1="375" x2="1125" y2="375" stroke="#444" stroke-width="3" marker-end="url(#a)"/>
<rect x="1125" y="320" width="300" height="110" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/>
<text x="1275.0" y="367.35" text-anchor="middle" font-size="21" fill="#222" font-weight="bold">4. 점점 직접 작성</text>
<text x="1275.0" y="397.35" text-anchor="middle" font-size="21" fill="#222">Claude는 조언자</text>
<rect x="150" y="490" width="1200" height="70" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/>
<text x="750.0" y="532.35" text-anchor="middle" font-size="21" fill="#222">실행 전 안전 습관: 파일 삭제, 데이터 전송, 되돌릴 수 없는 변경을 쉬운 말로 먼저 설명받는다.</text>
</svg>
