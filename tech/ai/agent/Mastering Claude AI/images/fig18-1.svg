<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#555"/></marker></defs>
<rect width="1500" height="660" fill="#fff"/>
<text x="750" y="58" text-anchor="middle" font-size="34" font-weight="bold" fill="#222">무엇을 의심하고 얼마나 확인할까</text>
<rect x="40" y="110" width="620" height="500" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="2.5"/>
<text x="350.0" y="146" text-anchor="middle" font-size="23" font-weight="bold" fill="#C0392B">더 의심할 주장</text>
<text x="350.0" y="190" text-anchor="middle" font-size="21" fill="#222">정확해 보이는 숫자와 통계</text>
<text x="350.0" y="220" text-anchor="middle" font-size="21" fill="#222">직접 인용과 출처 표기</text>
<text x="350.0" y="250" text-anchor="middle" font-size="21" fill="#222">최근 사건과 현재 상태</text>
<text x="350.0" y="280" text-anchor="middle" font-size="21" fill="#222">마이너하고 구체적인 사실</text>
<text x="350.0" y="310" text-anchor="middle" font-size="21" fill="#222">내가 듣고 싶던 대로의 주장</text>
<text x="350.0" y="340" text-anchor="middle" font-size="21" fill="#222"></text>
<text x="350.0" y="370" text-anchor="middle" font-size="21" fill="#222">덜 의심해도 되는 것</text>
<text x="350.0" y="400" text-anchor="middle" font-size="21" fill="#222">널리 알려진 불변의 사실</text>
<text x="350.0" y="430" text-anchor="middle" font-size="21" fill="#222">내가 준 자료 안의 추론</text>
<text x="350.0" y="460" text-anchor="middle" font-size="21" fill="#222">잘 알려진 개념의 일반 설명</text>
<rect x="720" y="110" width="740" height="112" rx="10" fill="#E8F0F9" stroke="#2F5D9B" stroke-width="2.5"/>
<text x="740" y="150" text-anchor="start" font-size="24" font-weight="bold" fill="#2F5D9B">가벼운 확인</text>
<text x="740" y="182" text-anchor="start" font-size="19"  fill="#222">쓰임: 일상, 개인용, 영향 작음</text>
<text x="740" y="210" text-anchor="start" font-size="19"  fill="#222">그럴듯한지만 본다</text>
<rect x="720" y="238" width="740" height="112" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/>
<text x="740" y="278" text-anchor="start" font-size="24" font-weight="bold" fill="#2E7D32">보통 확인</text>
<text x="740" y="310" text-anchor="start" font-size="19"  fill="#222">쓰임: 내부 결정, 영향 중간</text>
<text x="740" y="338" text-anchor="start" font-size="19"  fill="#222">핵심 주장을 독립 출처 1곳 이상으로</text>
<rect x="720" y="366" width="740" height="112" rx="10" fill="#FFF3E0" stroke="#E08A00" stroke-width="2.5"/>
<text x="740" y="406" text-anchor="start" font-size="24" font-weight="bold" fill="#E08A00">엄격한 확인</text>
<text x="740" y="438" text-anchor="start" font-size="19"  fill="#222">쓰임: 공개 발행, 영향 큼</text>
<text x="740" y="466" text-anchor="start" font-size="19"  fill="#222">모든 사실 주장 독립 확인 + 다른 사람 검토</text>
<rect x="720" y="494" width="740" height="112" rx="10" fill="#FDECEA" stroke="#C0392B" stroke-width="2.5"/>
<text x="740" y="534" text-anchor="start" font-size="24" font-weight="bold" fill="#C0392B">최대 확인</text>
<text x="740" y="566" text-anchor="start" font-size="19"  fill="#222">쓰임: 법률 의료 금융 안전</text>
<text x="740" y="594" text-anchor="start" font-size="19"  fill="#222">독립 확인 + 전문가 검토, Claude는 최종 권위 아님</text>
<text x="1090" y="640" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">확신에 찬 말투는 정확함의 증거가 아니다</text>
</svg>