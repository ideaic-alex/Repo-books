<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1500" height="880" fill="#fff"/><g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><text x="750" y="58" text-anchor="middle" font-size="34" font-weight="bold" fill="#1d2b3a">나만의 시스템: 조립과 유지 리듬</text><text x="730" y="112" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">조립 부품</text><rect x="60" y="150" width="330" height="150" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/><text x="225.0" y="203" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">가장 효과가 큰</text><text x="225.0" y="232" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">사용 사례 찾기</text><text x="225.0" y="260" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">자주, 많이 아끼는, 없으면 아쉬운</text><rect x="520" y="125" width="420" height="76" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="730.0" y="155" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">전용 프로젝트</text><text x="730.0" y="184" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">엄선한 지식과 지침</text><line x1="390" y1="225" x2="520" y2="163" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><rect x="520" y="215" width="420" height="76" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="730.0" y="245" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">컨텍스트 패킷</text><text x="730.0" y="274" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">반복 업무용</text><line x1="390" y1="225" x2="520" y2="253" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><rect x="520" y="305" width="420" height="76" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="730.0" y="335" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">검증 등급</text><text x="730.0" y="364" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">위험에 맞춘 단계</text><line x1="390" y1="225" x2="520" y2="343" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><rect x="520" y="395" width="420" height="76" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="730.0" y="425" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">메모리 설정</text><text x="730.0" y="454" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">일반 용도와 균형</text><line x1="390" y1="225" x2="520" y2="433" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><rect x="520" y="485" width="420" height="76" rx="10" fill="#F3E5F5" stroke="#7B3F98" stroke-width="2.5"/><text x="730.0" y="515" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">자동화, 커넥터</text><text x="730.0" y="544" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">후보 조건을 채울 때만</text><line x1="390" y1="225" x2="520" y2="523" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><rect x="1030" y="125" width="410" height="80" rx="10" fill="#FFFFFF" stroke="#555555" stroke-width="2.5"/><text x="1235.0" y="157" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">유지 리듬</text><text x="1235.0" y="187" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">달력에 넣는다</text><rect x="1030" y="225" width="110" height="70" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="1085.0" y="267" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">주간</text><rect x="1150" y="225" width="290" height="70" rx="10" fill="#FFFFFF" stroke="#555555" stroke-width="2.5"/><text x="1295.0" y="267" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">대화 이름 붙이고 정리</text><rect x="1030" y="310" width="110" height="70" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="1085.0" y="352" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">월간</text><rect x="1150" y="310" width="290" height="70" rx="10" fill="#FFFFFF" stroke="#555555" stroke-width="2.5"/><text x="1295.0" y="352" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">패킷과 프로젝트 지식 갱신</text><rect x="1030" y="395" width="110" height="70" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="1085.0" y="437" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">분기</text><rect x="1150" y="395" width="290" height="70" rx="10" fill="#FFFFFF" stroke="#555555" stroke-width="2.5"/><text x="1295.0" y="437" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">메모리, 요금제, 팀 표준 점검</text><rect x="1030" y="480" width="110" height="70" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="1085.0" y="522" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">연간</text><rect x="1150" y="480" width="290" height="70" rx="10" fill="#FFFFFF" stroke="#555555" stroke-width="2.5"/><text x="1295.0" y="522" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">종합 품질 검토, 사례 재평가</text><text x="750" y="620" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">복잡성 증식을 막는 질문</text><rect x="60" y="650" width="420" height="120" rx="10" fill="#FDECEA" stroke="#B3372B" stroke-width="2.5"/><text x="270.0" y="702" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">관리에 쓰는 시간이</text><text x="270.0" y="732" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">절약 시간보다 큰가?</text><rect x="540" y="650" width="420" height="120" rx="10" fill="#FDECEA" stroke="#B3372B" stroke-width="2.5"/><text x="750.0" y="702" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">목적을 설명 못 하는</text><text x="750.0" y="732" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">프로젝트나 자동화가 있나?</text><rect x="1020" y="650" width="420" height="120" rx="10" fill="#FDECEA" stroke="#B3372B" stroke-width="2.5"/><text x="1230.0" y="702" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">따르는 일이</text><text x="1230.0" y="732" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">숙제처럼 느껴지나?</text><text x="750" y="830" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">하나라도 해당하면 줄이거나 없앤다</text></g></svg>