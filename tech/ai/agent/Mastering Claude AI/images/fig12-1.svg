<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1500" height="720" fill="#FFFFFF"/><text x="750" y="62" text-anchor="middle" font-size="34" font-weight="bold" fill="#222">장문 글쓰기의 세 단계</text><rect x="35" y="110" width="290" height="100" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="180.0" y="152" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">1단계</text><text x="180.0" y="185" text-anchor="middle" font-size="24" font-weight="normal" fill="#222">구조 개요</text><rect x="35" y="235" width="290" height="180" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="180.0" y="303" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">섹션마다 핵심 문장</text><text x="180.0" y="332" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">주제 라벨만은 안 됨</text><text x="180.0" y="361" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">얇은 곳 표시 요청</text><rect x="415" y="110" width="290" height="100" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="560.0" y="152" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">2단계</text><text x="560.0" y="185" text-anchor="middle" font-size="24" font-weight="normal" fill="#222">섹션별 초안</text><rect x="415" y="235" width="290" height="180" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="560.0" y="303" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">한 섹션 쓰고 검토</text><text x="560.0" y="332" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">다음 섹션으로 이동</text><text x="560.0" y="361" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">앞의 결정을 명시</text><rect x="795" y="110" width="290" height="100" rx="10" fill="#FFF3E0" stroke="#C77800" stroke-width="2.5"/><text x="940.0" y="152" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">3단계</text><text x="940.0" y="185" text-anchor="middle" font-size="24" font-weight="normal" fill="#222">개정 패스</text><rect x="795" y="235" width="290" height="220" rx="10" fill="#FFF3E0" stroke="#C77800" stroke-width="2.5"/><text x="940.0" y="308" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">일관성 패스</text><text x="940.0" y="338" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">군더더기 패스</text><text x="940.0" y="366" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">목소리 패스</text><text x="940.0" y="396" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">논증 패스</text><rect x="1175" y="110" width="290" height="100" rx="10" fill="#F3E5F5" stroke="#7B3FA0" stroke-width="2.5"/><text x="1320.0" y="152" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">완성</text><text x="1320.0" y="185" text-anchor="middle" font-size="24" font-weight="normal" fill="#222">내 글</text><rect x="1175" y="235" width="290" height="180" rx="10" fill="#F3E5F5" stroke="#7B3FA0" stroke-width="2.5"/><text x="1320.0" y="303" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">구체 사례 주입</text><text x="1320.0" y="332" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">일반론 문장 표시</text><text x="1320.0" y="361" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">내 전문성이 중심</text><line x1="325" y1="160" x2="415" y2="160" stroke="#555" stroke-width="3" marker-end="url(#a)"/><line x1="705" y1="160" x2="795" y2="160" stroke="#555" stroke-width="3" marker-end="url(#a)"/><line x1="1085" y1="160" x2="1175" y2="160" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="120" y="540" width="1260" height="100" rx="10" fill="#FDECEA" stroke="#B83A32" stroke-width="2.5"/><text x="750.0" y="582" text-anchor="middle" font-size="22" font-weight="normal" fill="#222">한 번에 전체를 요청하면 논증이 얇고 구조가 반복되기 쉽다</text><text x="750.0" y="613" text-anchor="middle" font-size="22" font-weight="normal" fill="#222">"더 좋게 고쳐줘" 한 번보다 목적이 분명한 패스 여러 번이 낫다</text></svg>