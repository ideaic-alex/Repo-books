<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#444"/></marker></defs>
<rect width="1500" height="700" fill="#FFFFFF"/>
<text x="750" y="58" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="34" font-weight="bold" fill="#222">아티팩트 반복 작업 흐름</text>
<rect x="40" y="160" width="260" height="150" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/>
<text x="170.0" y="211" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222" font-weight="bold">1. 요청</text>
<text x="170.0" y="242" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222">결과물을 분명히</text>
<text x="170.0" y="274" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222">(네 가지 재료)</text>
<rect x="360" y="160" width="260" height="150" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/>
<text x="490.0" y="211" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222" font-weight="bold">2. 아티팩트 생성</text>
<text x="490.0" y="242" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222">별도 패널에서</text>
<text x="490.0" y="274" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222">미리보기 확인</text>
<rect x="680" y="160" width="260" height="150" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/>
<text x="810.0" y="211" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222" font-weight="bold">3. 직접 시험</text>
<text x="810.0" y="242" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222">눌러 보고 읽고</text>
<text x="810.0" y="274" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222">문제점 찾기</text>
<rect x="1000" y="160" width="260" height="150" rx="10" fill="#F3E5F5" stroke="#7B3F98" stroke-width="2.5"/>
<text x="1130.0" y="211" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222" font-weight="bold">4. 구체적 피드백</text>
<text x="1130.0" y="242" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222">바꿀 곳과</text>
<text x="1130.0" y="274" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222">둘 곳을 함께</text>
<line x1="300" y1="235" x2="358" y2="235" stroke="#444" stroke-width="3" marker-end="url(#ar)"/>
<line x1="620" y1="235" x2="678" y2="235" stroke="#444" stroke-width="3" marker-end="url(#ar)"/>
<line x1="940" y1="235" x2="998" y2="235" stroke="#444" stroke-width="3" marker-end="url(#ar)"/>
<path d="M1130,312 C1130,420 490,420 490,314" fill="none" stroke="#444" stroke-width="3" marker-end="url(#ar)"/>
<text x="810" y="455" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="22" fill="#222" font-weight="bold">만족할 때까지 반복 (처음부터 다시 만들지 않는다)</text>
<rect x="1320" y="160" width="150" height="150" rx="10" fill="#FDECEA" stroke="#B3372E" stroke-width="2.5"/>
<text x="1395.0" y="227" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222" font-weight="bold">5. 공유</text>
<text x="1395.0" y="258" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222">시험 뒤에만</text>
<line x1="1260" y1="235" x2="1318" y2="235" stroke="#444" stroke-width="3" marker-end="url(#ar)"/>
<rect x="40" y="520" width="1430" height="120" rx="10" fill="#FFFFFF" stroke="#555555" stroke-width="2.5" stroke-dasharray="10 6"/>
<text x="755.0" y="572" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222">좋은 피드백: 구조와 숫자는 그대로 두고 둘째 문단만 작은 비교 표로 바꿔 줘</text>
<text x="755.0" y="603" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="21" fill="#222">나쁜 피드백: 더 좋게 만들어 줘</text>
</svg>