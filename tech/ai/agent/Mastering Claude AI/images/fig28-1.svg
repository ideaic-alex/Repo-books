<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1500" height="820" fill="#fff"/><g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><text x="750" y="58" text-anchor="middle" font-size="34" font-weight="bold" fill="#1d2b3a">보정된 신뢰의 순환과 품질 표류</text><rect x="60" y="120" width="270" height="140" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="195.0" y="182" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">1. 증거 쌓기</text><text x="195.0" y="212" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">분야별로 결과를 기록</text><rect x="430" y="120" width="270" height="140" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="565.0" y="182" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">2. 검증 강도 조정</text><text x="565.0" y="212" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">분야별 실적에 맞춘다</text><rect x="800" y="120" width="270" height="140" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/><text x="935.0" y="182" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">3. 정기 표본 점검</text><text x="935.0" y="212" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">일부를 엄격히 검토</text><rect x="1170" y="120" width="270" height="140" rx="10" fill="#F3E5F5" stroke="#7B3F98" stroke-width="2.5"/><text x="1305.0" y="182" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">4. 피드백 반영</text><text x="1305.0" y="212" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">원인을 찾아 과정 수정</text><line x1="330" y1="190" x2="430" y2="190" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><line x1="700" y1="190" x2="800" y2="190" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><line x1="1070" y1="190" x2="1170" y2="190" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><path d="M1305,262 L1305,310 L195,310 L195,264" fill="none" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><text x="750" y="352" text-anchor="middle" font-size="22" font-weight="normal" fill="#333">주기적으로 되풀이하며 다시 보정한다</text><text x="750" y="425" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">표류(drift)가 생기는 세 가지 길</text><rect x="60" y="455" width="420" height="150" rx="10" fill="#FDECEA" stroke="#B3372B" stroke-width="2.5"/><text x="270.0" y="507" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">익숙함이 부주의로</text><text x="270.0" y="537" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">엄격하던 검증이</text><text x="270.0" y="567" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">형식적으로 변한다</text><rect x="540" y="455" width="420" height="150" rx="10" fill="#FDECEA" stroke="#B3372B" stroke-width="2.5"/><text x="750.0" y="507" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">낡은 자료</text><text x="750.0" y="537" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">컨텍스트 패킷과</text><text x="750.0" y="567" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">프로젝트 지식이 묵는다</text><rect x="1020" y="455" width="420" height="150" rx="10" fill="#FDECEA" stroke="#B3372B" stroke-width="2.5"/><text x="1230.0" y="507" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">표준의 침식</text><text x="1230.0" y="537" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">새 팀원이 문서 대신</text><text x="1230.0" y="567" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">관행만 배운다</text><text x="750" y="650" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">양쪽 오류를 모두 경계한다</text><rect x="60" y="680" width="660" height="100" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/><text x="390.0" y="722" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">과신</text><text x="390.0" y="752" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">검증하지 않은 것을 믿는다</text><rect x="780" y="680" width="660" height="100" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/><text x="1110.0" y="722" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">과소 신뢰</text><text x="1110.0" y="752" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">이미 믿을 만한 것을 또 확인한다</text></g></svg>