<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1500" height="720" fill="#fff"/><text x="750" y="60" font-size="34" font-weight="bold" text-anchor="middle" fill="#222">에이전트 작업의 안전장치와 책임 있는 검토</text><text x="400" y="125" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">시작 전: 가드레일 4가지</text><rect x="60" y="160" width="680" height="90" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="400.0" y="198.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">범위를 좁게 정한다</text><text x="400.0" y="226.0" font-size="20" text-anchor="middle" fill="#222">대상 기능, 건드릴 파일, 금지 구역</text><rect x="60" y="270" width="680" height="90" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/><text x="400.0" y="308.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">버전 관리를 쓴다</text><text x="400.0" y="336.0" font-size="20" text-anchor="middle" fill="#222">되돌릴 수 있는 안전망</text><rect x="60" y="380" width="680" height="90" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2.5"/><text x="400.0" y="418.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">작은 일부터 맡긴다</text><text x="400.0" y="446.0" font-size="20" text-anchor="middle" fill="#222">신뢰를 단계적으로 쌓는다</text><rect x="60" y="490" width="680" height="90" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/><text x="400.0" y="528.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">변경 내용을 본다</text><text x="400.0" y="556.0" font-size="20" text-anchor="middle" fill="#222">보고서가 아니라 diff</text><text x="1100" y="125" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">끝난 뒤: 검토 4단계</text><rect x="820" y="160" width="620" height="90" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/><text x="1130.0" y="198.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">1. 실제 변경 확인</text><text x="1130.0" y="226.0" font-size="20" text-anchor="middle" fill="#222">요약문이 아니라 diff 전체</text><rect x="820" y="270" width="620" height="90" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/><text x="1130.0" y="308.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">2. 테스트를 직접 실행</text><text x="1130.0" y="336.0" font-size="20" text-anchor="middle" fill="#222">통과했다는 말을 믿지 않는다</text><rect x="820" y="380" width="620" height="90" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/><text x="1130.0" y="418.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">3. 범위 이탈 점검</text><text x="1130.0" y="446.0" font-size="20" text-anchor="middle" fill="#222">요청 밖 수정이 없는지</text><rect x="820" y="490" width="620" height="90" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="2.5"/><text x="1130.0" y="528.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">4. 민감 영역 정밀 검토</text><text x="1130.0" y="556.0" font-size="20" text-anchor="middle" fill="#222">보안, 개인정보, 운영 시스템</text><rect x="60" y="630" width="1380" height="60" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/><text x="750.0" y="667.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">비유: 유능한 신입이 올린 풀 리퀘스트처럼, 좋을 가능성이 높아도 합치기 전에 진짜 리뷰를 한다</text></svg>