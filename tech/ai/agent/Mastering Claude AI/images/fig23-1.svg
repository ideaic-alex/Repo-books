<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1500" height="760" fill="#fff"/><text x="750" y="60" font-size="34" font-weight="bold" text-anchor="middle" fill="#222">채팅으로 코드 묻기와 Claude Code의 차이</text><text x="400" y="125" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">대화형 채팅: 사람이 중간 전달자</text><rect x="60" y="160" width="300" height="90" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2.5"/><text x="210.0" y="198.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">사람</text><text x="210.0" y="226.0" font-size="20" text-anchor="middle" fill="#222">코드를 복사해 붙여 넣는다</text><rect x="60" y="330" width="300" height="90" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="210.0" y="368.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Claude</text><text x="210.0" y="396.0" font-size="20" text-anchor="middle" fill="#222">수정안을 글로 답한다</text><rect x="60" y="500" width="300" height="90" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2.5"/><text x="210.0" y="538.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">사람</text><text x="210.0" y="566.0" font-size="20" text-anchor="middle" fill="#222">수정안을 직접 적용하고 실행</text><line x1="210" y1="250" x2="210" y2="330" stroke="#444" stroke-width="3" marker-end="url(#a)"/><line x1="210" y1="420" x2="210" y2="500" stroke="#444" stroke-width="3" marker-end="url(#a)"/><path d="M360,545 C440,545 440,205 360,205" fill="none" stroke="#444" stroke-width="3" marker-end="url(#a)"/><text x="445" y="390" font-size="19" text-anchor="start" fill="#222">결과를 다시</text><text x="445" y="418" font-size="19" text-anchor="start" fill="#222">붙여 넣어 보고</text><text x="1030" y="125" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">Claude Code: 실제 코드 폴더 안에서 반복</text><rect x="600" y="170" width="260" height="80" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/><text x="730.0" y="203.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">목표를 받음</text><text x="730.0" y="231.0" font-size="20" text-anchor="middle" fill="#222">범위와 금지 구역 포함</text><rect x="940" y="170" width="260" height="80" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/><text x="1070.0" y="203.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">파일 읽기</text><text x="1070.0" y="231.0" font-size="20" text-anchor="middle" fill="#222">관련 코드 파악</text><rect x="1240" y="170" width="200" height="80" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/><text x="1340.0" y="203.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">수정</text><text x="1340.0" y="231.0" font-size="20" text-anchor="middle" fill="#222">여러 파일</text><rect x="1240" y="330" width="200" height="80" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/><text x="1340.0" y="363.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">테스트 실행</text><text x="1340.0" y="391.0" font-size="20" text-anchor="middle" fill="#222">실제 결과 확인</text><rect x="940" y="330" width="260" height="80" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/><text x="1070.0" y="363.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">결과 관찰</text><text x="1070.0" y="391.0" font-size="20" text-anchor="middle" fill="#222">실패하면 다시 수정</text><line x1="860" y1="210" x2="940" y2="210" stroke="#444" stroke-width="3" marker-end="url(#a)"/><line x1="1200" y1="210" x2="1240" y2="210" stroke="#444" stroke-width="3" marker-end="url(#a)"/><line x1="1340" y1="250" x2="1340" y2="330" stroke="#444" stroke-width="3" marker-end="url(#a)"/><line x1="1240" y1="370" x2="1200" y2="370" stroke="#444" stroke-width="3" marker-end="url(#a)"/><path d="M1070,330 C1070,290 1300,300 1330,252" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="1085" y="305" font-size="19" text-anchor="middle" fill="#222">반복</text><rect x="600" y="500" width="840" height="100" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="2.5"/><text x="1020.0" y="543.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">사람이 검토하는 지점</text><text x="1020.0" y="571.0" font-size="20" text-anchor="middle" fill="#222">실제 변경(diff) 보기, 테스트 직접 실행, 범위 이탈 확인</text><line x1="1070" y1="410" x2="1070" y2="500" stroke="#444" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="650" width="1380" height="70" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/><text x="750.0" y="692.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">핵심: 에이전트 방식은 검토 횟수가 줄어드는 대신 한 번의 검토가 더 두꺼워져야 한다</text></svg>