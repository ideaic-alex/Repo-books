<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect width="1500" height="800" fill="#FFFFFF"/>
<text x="750" y="62" text-anchor="middle" font-size="34" font-weight="bold" fill="#222">강한 프롬프트의 네 가지 재료</text>
<rect x="40" y="120" width="310" height="230" rx="10" fill="#E8F0F9" stroke="#2F5D9B" stroke-width="2.5"/>
<text x="195.0" y="191.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">1 명확한 과제</text>
<text x="195.0" y="225.0" text-anchor="middle" font-size="20" fill="#222">무엇을 하라는가?</text>
<text x="195.0" y="259.0" text-anchor="middle" font-size="20" fill="#222">동사로 분명히</text>
<text x="195.0" y="293.0" text-anchor="middle" font-size="20" fill="#222">쓰기, 요약, 비교</text>
<line x1="195" y1="352" x2="472.5" y2="468" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="410" y="120" width="310" height="230" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/>
<text x="565.0" y="191.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">2 관련 맥락</text>
<text x="565.0" y="225.0" text-anchor="middle" font-size="20" fill="#222">내가 아는 것 중</text>
<text x="565.0" y="259.0" text-anchor="middle" font-size="20" fill="#222">Claude가 모르는 것</text>
<text x="565.0" y="293.0" text-anchor="middle" font-size="20" fill="#222">독자, 제약, 자료</text>
<line x1="565" y1="352" x2="657.5" y2="468" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="780" y="120" width="310" height="230" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/>
<text x="935.0" y="191.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">3 형식과 제약</text>
<text x="935.0" y="225.0" text-anchor="middle" font-size="20" fill="#222">어떻게 보이는가?</text>
<text x="935.0" y="259.0" text-anchor="middle" font-size="20" fill="#222">길이, 구조, 말투</text>
<text x="935.0" y="293.0" text-anchor="middle" font-size="20" fill="#222">넣을 것, 뺄 것</text>
<line x1="935" y1="352" x2="842.5" y2="468" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1150" y="120" width="310" height="230" rx="10" fill="#FDECEA" stroke="#B3372D" stroke-width="2.5"/>
<text x="1305.0" y="191.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">4 예시</text>
<text x="1305.0" y="225.0" text-anchor="middle" font-size="20" fill="#222">좋은 기준이란?</text>
<text x="1305.0" y="259.0" text-anchor="middle" font-size="20" fill="#222">좋은 예와</text>
<text x="1305.0" y="293.0" text-anchor="middle" font-size="20" fill="#222">나쁜 예를 함께</text>
<line x1="1305" y1="352" x2="1027.5" y2="468" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="400" y="470" width="700" height="110" rx="10" fill="#F3E5F5" stroke="#7B3FA0" stroke-width="2.5"/>
<text x="750.0" y="515.0" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">강한 프롬프트</text>
<text x="750.0" y="549.0" text-anchor="middle" font-size="20" fill="#222">빠진 재료 하나만 더해도 답이 달라진다</text>
<rect x="250" y="650" width="1000" height="90" rx="10" fill="#E8F0F9" stroke="#2F5D9B" stroke-width="2.5"/>
<text x="750.0" y="702.0" text-anchor="middle" font-size="20" fill="#222">역할 설정은 보조 재료: 실제 맥락과 함께 쓸 때만 효과가 있다</text>
</svg>