<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1500" height="860" fill="#fff"/><g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><text x="750" y="58" text-anchor="middle" font-size="34" font-weight="bold" fill="#1d2b3a">변하지 않는 원칙과 바뀌는 세부 사항</text><rect x="60" y="110" width="660" height="60" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="390.0" y="147" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">오래가는 원칙</text><rect x="60" y="180" width="660" height="52" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="390.0" y="213" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">네 가지 재료 프롬프트 틀 (4장)</text><rect x="60" y="242" width="660" height="52" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="390.0" y="275" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">컨텍스트 엔지니어링 원칙 (5장)</text><rect x="60" y="304" width="660" height="52" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="390.0" y="337" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">프로젝트, 메모리, 아티팩트의 구성 논리 (6-8장)</text><rect x="60" y="366" width="660" height="52" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="390.0" y="399" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">검증과 단계별 신뢰 (18, 28장)</text><rect x="60" y="428" width="660" height="52" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="390.0" y="461" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">편집, 조사, 의사결정 (14, 15, 17장)</text><rect x="60" y="490" width="660" height="52" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="390.0" y="523" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">팀 협업 원칙 (27장)</text><rect x="780" y="110" width="660" height="60" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/><text x="1110.0" y="147" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">다시 확인할 세부 사항</text><rect x="780" y="180" width="660" height="52" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/><text x="1110.0" y="213" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">모델 이름과 정확한 기능 (1장)</text><rect x="780" y="242" width="660" height="52" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/><text x="1110.0" y="275" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">요금제, 가격, 사용 한도 (2장)</text><rect x="780" y="304" width="660" height="52" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/><text x="1110.0" y="337" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">설정과 기능의 화면 위치 (2장)</text><rect x="780" y="366" width="660" height="52" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/><text x="1110.0" y="399" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">메모리, 아티팩트, 커넥터의 현재 기능 (7, 8, 20장)</text><rect x="780" y="428" width="660" height="52" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/><text x="1110.0" y="461" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">MCP 생태계와 커넥터 목록 (20, 21장)</text><rect x="780" y="490" width="660" height="52" rx="10" fill="#FFF3E0" stroke="#C77700" stroke-width="2.5"/><text x="1110.0" y="523" text-anchor="middle" font-size="19" font-weight="normal" fill="#222">API 가격과 기술 사양 (25장)</text><text x="750" y="605" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">새 기능을 만났을 때 네 단계</text><rect x="60" y="640" width="300" height="110" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="210.0" y="687" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">1. 이해</text><text x="210.0" y="717" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">공식 문서로 확인</text><rect x="430" y="640" width="300" height="110" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="580.0" y="687" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">2. 필요성</text><text x="580.0" y="717" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">실제 마찰을 푸는가</text><rect x="800" y="640" width="300" height="110" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="950.0" y="687" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">3. 시험</text><text x="950.0" y="717" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">위험 낮은 일에 먼저</text><rect x="1170" y="640" width="300" height="110" rx="10" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="2.5"/><text x="1320.0" y="687" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">4. 채택</text><text x="1320.0" y="717" text-anchor="middle" font-size="20" font-weight="normal" fill="#222">실적이 확인되면 편입</text><line x1="360" y1="695" x2="430" y2="695" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><line x1="730" y1="695" x2="800" y2="695" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><line x1="1100" y1="695" x2="1170" y2="695" stroke="#444" stroke-width="3" marker-end="url(#ah)"/><text x="750" y="810" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">핵심 두 질문: 어떤 명확함과 맥락이 필요한가? 어떤 검증이 알맞은가?</text></g></svg>