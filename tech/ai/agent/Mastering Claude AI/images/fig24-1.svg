<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1500" height="760" fill="#fff"/><text x="750" y="60" font-size="34" font-weight="bold" text-anchor="middle" fill="#222">버그를 좁혀 가는 다섯 단계</text><rect x="40" y="150" width="255" height="150" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="167.5" y="204.65" font-size="19" font-weight="bold" text-anchor="middle" fill="#222">1. 재현</text><text x="167.5" y="231.65" font-size="19" text-anchor="middle" fill="#222">매번 같은 방법으로</text><text x="167.5" y="258.65" font-size="19" text-anchor="middle" fill="#222">오류를 낸다</text><line x1="295" y1="225" x2="330" y2="225" stroke="#444" stroke-width="3" marker-end="url(#a)"/><rect x="330" y="150" width="255" height="150" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/><text x="457.5" y="204.65" font-size="19" font-weight="bold" text-anchor="middle" fill="#222">2. 최소 재현</text><text x="457.5" y="231.65" font-size="19" text-anchor="middle" fill="#222">관계없는 코드를</text><text x="457.5" y="258.65" font-size="19" text-anchor="middle" fill="#222">덜어 낸다</text><line x1="585" y1="225" x2="620" y2="225" stroke="#444" stroke-width="3" marker-end="url(#a)"/><rect x="620" y="150" width="255" height="150" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2.5"/><text x="747.5" y="204.65" font-size="19" font-weight="bold" text-anchor="middle" fill="#222">3. 가설</text><text x="747.5" y="231.65" font-size="19" text-anchor="middle" fill="#222">고치기 전에 가장</text><text x="747.5" y="258.65" font-size="19" text-anchor="middle" fill="#222">그럴듯한 원인을 정한다</text><line x1="875" y1="225" x2="910" y2="225" stroke="#444" stroke-width="3" marker-end="url(#a)"/><rect x="910" y="150" width="255" height="150" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/><text x="1037.5" y="204.65" font-size="19" font-weight="bold" text-anchor="middle" fill="#222">4. 한 가지만 수정</text><text x="1037.5" y="231.65" font-size="19" text-anchor="middle" fill="#222">가설 하나당 변경 하나</text><text x="1037.5" y="258.65" font-size="19" text-anchor="middle" fill="#222">그리고 다시 시험</text><line x1="1165" y1="225" x2="1200" y2="225" stroke="#444" stroke-width="3" marker-end="url(#a)"/><rect x="1200" y="150" width="255" height="150" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="2.5"/><text x="1327.5" y="204.65" font-size="19" font-weight="bold" text-anchor="middle" fill="#222">5. 새 가설</text><text x="1327.5" y="231.65" font-size="19" text-anchor="middle" fill="#222">틀렸으면 배운 것으로</text><text x="1327.5" y="258.65" font-size="19" text-anchor="middle" fill="#222">다시 세운다</text><path d="M1330,300 C1330,360 760,360 760,302" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="930" y="385" font-size="19" text-anchor="middle" fill="#222">가설이 틀리면 3단계로 돌아간다</text><text x="400" y="450" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">질문할 때 넣을 네 가지</text><rect x="40" y="480" width="170" height="110" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="125.0" y="528.15" font-size="19" text-anchor="middle" fill="#222">정확한 오류</text><text x="125.0" y="555.15" font-size="19" text-anchor="middle" fill="#222">메시지 전체</text><rect x="220" y="480" width="170" height="110" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="305.0" y="528.15" font-size="19" text-anchor="middle" fill="#222">관련 코드</text><text x="305.0" y="555.15" font-size="19" text-anchor="middle" fill="#222">원문</text><rect x="400" y="480" width="170" height="110" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="485.0" y="528.15" font-size="19" text-anchor="middle" fill="#222">기대한 결과와</text><text x="485.0" y="555.15" font-size="19" text-anchor="middle" fill="#222">실제 결과</text><rect x="580" y="480" width="170" height="110" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="665.0" y="528.15" font-size="19" text-anchor="middle" fill="#222">이미 시도한</text><text x="665.0" y="555.15" font-size="19" text-anchor="middle" fill="#222">것</text><text x="1100" y="450" font-size="24" font-weight="bold" text-anchor="middle" fill="#222">고친 뒤 확인할 두 가지</text><rect x="800" y="480" width="320" height="110" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="2.5"/><text x="960.0" y="528.0" font-size="20" text-anchor="middle" fill="#222">뿌리 원인을 고쳤나</text><text x="960.0" y="556.0" font-size="20" text-anchor="middle" fill="#222">증상만 가렸나</text><rect x="1140" y="480" width="320" height="110" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/><text x="1300.0" y="528.0" font-size="20" text-anchor="middle" fill="#222">왜 생겼는지</text><text x="1300.0" y="556.0" font-size="20" text-anchor="middle" fill="#222">내 말로 설명한다</text><rect x="40" y="640" width="1420" height="70" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/><text x="750.0" y="682.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">버그 종류: 문법 오류, 논리 오류, 경계 사례, 환경과 의존성, 타이밍과 순서</text></svg>