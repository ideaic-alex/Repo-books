<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1500" height="780" fill="#fff"/><text x="750" y="60" font-size="34" font-weight="bold" text-anchor="middle" fill="#222">Claude API가 필요한지 가리는 흐름</text><rect x="550" y="100" width="400" height="80" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="750.0" y="133.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">아이디어</text><text x="750.0" y="161.0" font-size="20" text-anchor="middle" fill="#222">Claude를 써서 하고 싶은 일</text><rect x="550" y="240" width="400" height="100" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2.5"/><text x="750.0" y="283.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">사람이 직접 채팅으로</text><text x="750.0" y="311.0" font-size="20" text-anchor="middle" fill="#222">해도 충분한가</text><line x1="750" y1="180" x2="750" y2="240" stroke="#444" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="240" width="380" height="100" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/><text x="250.0" y="283.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Claude.ai로 충분</text><text x="250.0" y="311.0" font-size="20" text-anchor="middle" fill="#222">프로젝트, 아티팩트, 스킬</text><line x1="550" y1="290" x2="440" y2="290" stroke="#444" stroke-width="3" marker-end="url(#a)"/><text x="495" y="270" font-size="19" text-anchor="middle" fill="#222">예</text><rect x="550" y="400" width="400" height="110" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="2.5"/><text x="750.0" y="434.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">API 신호가 있나</text><text x="750.0" y="462.0" font-size="20" text-anchor="middle" fill="#222">자동 실행, 많은 사용자,</text><text x="750.0" y="490.0" font-size="20" text-anchor="middle" fill="#222">제품 기능, 세밀한 제어</text><line x1="750" y1="340" x2="750" y2="400" stroke="#444" stroke-width="3" marker-end="url(#a)"/><text x="800" y="375" font-size="19" text-anchor="middle" fill="#222">아니오</text><rect x="1060" y="400" width="380" height="110" rx="10" fill="#E6F4EA" stroke="#2E7D32" stroke-width="2.5"/><text x="1250.0" y="434.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">아직 API 불필요</text><text x="1250.0" y="462.0" font-size="20" text-anchor="middle" fill="#222">탐색 중이거나 이미</text><text x="1250.0" y="490.0" font-size="20" text-anchor="middle" fill="#222">기존 기능으로 충족</text><line x1="950" y1="455" x2="1060" y2="455" stroke="#444" stroke-width="3" marker-end="url(#a)"/><text x="1005" y="435" font-size="19" text-anchor="middle" fill="#222">없음</text><rect x="550" y="570" width="400" height="80" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="2.5"/><text x="750.0" y="603.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">API 필요</text><text x="750.0" y="631.0" font-size="20" text-anchor="middle" fill="#222">명세 작성 후 개발자와 협업</text><line x1="750" y1="510" x2="750" y2="570" stroke="#444" stroke-width="3" marker-end="url(#a)"/><text x="790" y="545" font-size="19" text-anchor="middle" fill="#222">있음</text><rect x="1010" y="570" width="430" height="80" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/><text x="1225.0" y="603.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">사람이 계속 맡을 것</text><text x="1225.0" y="631.0" font-size="20" text-anchor="middle" fill="#222">의도, 어조, 검증 기준</text><line x1="950" y1="610" x2="1010" y2="610" stroke="#444" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="570" width="430" height="80" rx="10" fill="#E8F0F9" stroke="#2F5D8C" stroke-width="2.5"/><text x="275.0" y="603.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">비용 점검</text><text x="275.0" y="631.0" font-size="20" text-anchor="middle" fill="#222">토큰 사용량 기준 과금</text><line x1="550" y1="610" x2="490" y2="610" stroke="#444" stroke-width="3" marker-end="url(#a)"/><rect x="60" y="690" width="1380" height="60" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2.5"/><text x="750.0" y="727.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">요금은 구독이 아니라 처리한 글자 양(토큰)에 따라 늘어난다. 최신 공식 가격표로 어림 계산한다</text></svg>