<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="600" fill="#FFFFFF"/>
<text class="t" x="750" y="60" text-anchor="middle">뉴턴-오일러 알고리즘: 두 번 훑기</text>
<rect x="60" y="250" width="240" height="100" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="180" y="295" text-anchor="middle">기저 {0}</text>
<text class="b" x="180" y="328" text-anchor="middle">V₀, V̇₀ (중력 포함)</text>
<rect x="360" y="250" width="240" height="100" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="480" y="295" text-anchor="middle">링크 1</text>
<text class="b" x="480" y="328" text-anchor="middle">θ₁, 축 A₁, 관성 G₁</text>
<rect x="660" y="250" width="240" height="100" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="780" y="295" text-anchor="middle">링크 2</text>
<text class="b" x="780" y="328" text-anchor="middle">θ₂, 축 A₂, 관성 G₂</text>
<rect x="960" y="250" width="240" height="100" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="1080" y="295" text-anchor="middle">링크 n</text>
<text class="b" x="1080" y="328" text-anchor="middle">θₙ, 축 Aₙ, 관성 Gₙ</text>
<rect x="1260" y="250" width="190" height="100" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="1355" y="295" text-anchor="middle">끝점 {n+1}</text>
<text class="b" x="1355" y="328" text-anchor="middle">외력 F(n+1)</text>
<line x1="300" y1="300" x2="358" y2="300" stroke="#4A5260" stroke-width="2"/>
<line x1="600" y1="300" x2="658" y2="300" stroke="#4A5260" stroke-width="2"/>
<line x1="900" y1="300" x2="958" y2="300" stroke="#4A5260" stroke-width="2"/>
<line x1="1200" y1="300" x2="1258" y2="300" stroke="#4A5260" stroke-width="2"/>
<rect x="60" y="100" width="1390" height="100" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="755" y="140" text-anchor="middle">① 앞으로 훑기 (기저에서 끝점으로)</text>
<text class="b" x="755" y="175" text-anchor="middle">Vᵢ = Ad(Tᵢ,ᵢ₋₁) Vᵢ₋₁ + Aᵢ θ̇ᵢ,   V̇ᵢ에는 θ̈ᵢ 항이 추가된다</text>
<line x1="180" y1="205" x2="180" y2="245" stroke="#3C8D5A" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1355" y1="205" x2="1355" y2="245" stroke="#3C8D5A" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="60" y="410" width="1390" height="100" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="h" x="755" y="450" text-anchor="middle">② 뒤로 훑기 (끝점에서 기저로)</text>
<text class="b" x="755" y="485" text-anchor="middle">Fᵢ = Ad(Tᵢ₊₁,ᵢ)ᵀ Fᵢ₊₁ + Gᵢ V̇ᵢ − adᵀ(Vᵢ) Gᵢ Vᵢ,   τᵢ = Fᵢᵀ Aᵢ</text>
<line x1="480" y1="405" x2="480" y2="355" stroke="#B5524A" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="780" y1="405" x2="780" y2="355" stroke="#B5524A" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1080" y1="405" x2="1080" y2="355" stroke="#B5524A" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="750" y="560" text-anchor="middle">링크 수 n에 비례하는 계산량. 입력은 θ, θ̇, θ̈, 출력은 관절 토크 τ.</text>
</svg>
