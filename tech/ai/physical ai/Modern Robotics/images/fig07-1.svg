<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<rect width="1500" height="540" fill="#FFFFFF"/>
<text class="t" x="750" y="55" text-anchor="middle">병렬 메커니즘: 두 판을 여러 다리가 잇는다</text>
<rect x="40" y="90" width="680" height="420" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<polygon points="160,440 600,440 380,380" fill="#E8F0F9" stroke="#4A5260" stroke-width="3"/>
<polygon points="250,190 510,190 380,130" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="3"/>
<line x1="160" y1="440" x2="250" y2="190" stroke="#B8862B" stroke-width="7"/>
<line x1="600" y1="440" x2="510" y2="190" stroke="#B8862B" stroke-width="7"/>
<line x1="380" y1="380" x2="380" y2="130" stroke="#B8862B" stroke-width="7"/>
<circle cx="160" cy="440" r="11" fill="#FFFFFF" stroke="#4A5260" stroke-width="3"/>
<circle cx="600" cy="440" r="11" fill="#FFFFFF" stroke="#4A5260" stroke-width="3"/>
<circle cx="380" cy="380" r="11" fill="#FFFFFF" stroke="#4A5260" stroke-width="3"/>
<circle cx="250" cy="190" r="11" fill="#FFFFFF" stroke="#4A5260" stroke-width="3"/>
<circle cx="510" cy="190" r="11" fill="#FFFFFF" stroke="#4A5260" stroke-width="3"/>
<circle cx="380" cy="130" r="11" fill="#FFFFFF" stroke="#4A5260" stroke-width="3"/>
<text class="b" x="75" y="335">다리 1</text>
<text class="b" x="635" y="335">다리 2</text>
<text class="b" x="400" y="290">다리 3</text>
<text class="h" x="380" y="170" text-anchor="middle">움직이는 판</text>
<text class="h" x="380" y="480" text-anchor="middle">고정된 판</text>
<text class="s" x="380" y="112" text-anchor="middle">평면 3×RPR 개략도: 다리마다 길이를 늘이는 관절이 하나</text>
<rect x="760" y="90" width="700" height="420" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="1110" y="130" text-anchor="middle">그뤼블러 공식으로 자유도 세기</text>
<text class="b" x="795" y="185">dof = m(N − 1 − J) + Σ fᵢ</text>
<text class="b" x="795" y="240">평면 3×RPR</text>
<text class="b" x="815" y="272">N = 8, J = 9, m = 3 → dof = 3</text>
<text class="b" x="795" y="330">공간 6×SPS 스튜어트-고프</text>
<text class="b" x="815" y="362">N = 14, J = 18, m = 6, Σf = 42</text>
<text class="b" x="815" y="394">→ dof = 12 (다리 회전 6개는 수동)</text>
<text class="s" x="795" y="450">실제 말단 자유도는 6, 다리 길이 6개가 모두 능동 입력이다.</text>
<text class="s" x="795" y="478">N: 링크 수(지면 포함), J: 관절 수, fᵢ: 관절 자유도</text>
</svg>
