<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="640" fill="#FFFFFF"/>
<text class="t" x="750" y="55" text-anchor="middle">바퀴 종류와 로봇 부류</text>

<rect x="560" y="90" width="380" height="80" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="750" y="140" text-anchor="middle">바퀴형 이동 로봇</text>
<line x1="700" y1="172" x2="330" y2="240" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="800" y1="172" x2="1170" y2="240" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>

<rect x="40" y="245" width="580" height="340" rx="12" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="330" y="285" text-anchor="middle">전방향 로봇: 속도 제약 없음</text>
<rect x="90" y="320" width="150" height="24" rx="12" fill="#FFFFFF" stroke="#3B6EA8" stroke-width="2"/>
<line x1="165" y1="316" x2="165" y2="348" stroke="#B5524A" stroke-width="2" stroke-dasharray="4 4"/>
<text class="b" x="165" y="380" text-anchor="middle">옴니 휠 γ = 0</text>
<rect x="390" y="320" width="150" height="24" rx="12" fill="#FFFFFF" stroke="#3B6EA8" stroke-width="2"/>
<line x1="440" y1="344" x2="490" y2="320" stroke="#B5524A" stroke-width="2" stroke-dasharray="4 4"/>
<text class="b" x="465" y="380" text-anchor="middle">메카넘 휠 γ = ±45°</text>
<text class="b" x="330" y="440" text-anchor="middle">바퀴 3개 이상, u = H(φ) q̇ 의 H 가 계수 3</text>
<text class="b" x="330" y="474" text-anchor="middle">바퀴 속도 한계 → 면 2m 개의 다면체</text>
<text class="b" x="330" y="508" text-anchor="middle">9장, 10장의 계획과 선형 제어를 거의 그대로 사용</text>
<text class="s" x="330" y="558" text-anchor="middle">세 방향 모두 직접 이동 가능</text>

<rect x="660" y="245" width="800" height="340" rx="12" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="1060" y="285" text-anchor="middle">비홀로노믹 로봇: 풀파프 제약 1개 (일반 바퀴)</text>
<text class="b" x="1060" y="318" text-anchor="middle">q̇ = G(q) u, 제약식 ẋ sinφ − ẏ cosφ = 0</text>

<text class="h" x="800" y="370" text-anchor="middle">외바퀴</text>
<rect x="755" y="395" width="90" height="70" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="2"/>
<text class="s" x="800" y="495" text-anchor="middle">제어 집합: 직사각형</text>
<text class="s" x="800" y="520" text-anchor="middle">제자리 회전 가능</text>

<text class="h" x="1060" y="370" text-anchor="middle">차동 구동</text>
<polygon points="1060,395 1105,430 1060,465 1015,430" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="2"/>
<text class="s" x="1060" y="495" text-anchor="middle">제어 집합: 마름모</text>
<text class="s" x="1060" y="520" text-anchor="middle">제자리 회전 가능</text>

<text class="h" x="1320" y="370" text-anchor="middle">자동차형</text>
<polygon points="1320,430 1380,395 1380,465" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="2"/>
<polygon points="1320,430 1260,395 1260,465" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="s" x="1320" y="495" text-anchor="middle">제어 집합: 나비넥타이</text>
<text class="s" x="1320" y="520" text-anchor="middle">후진 없으면 오른쪽 절반만</text>
<text class="s" x="1060" y="565" text-anchor="middle">제어 집합 가로축 = 후진·전진 속도 v, 세로축 = 각속도 ω</text>
</svg>
