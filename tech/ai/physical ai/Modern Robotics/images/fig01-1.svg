<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="620" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">이 책의 지도: 13개 장과 다섯 개의 부</text>

<rect x="30" y="100" width="268" height="80" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="164" y="132" text-anchor="middle">1부 기초</text>
<text class="s" x="164" y="160" text-anchor="middle">배위와 강체 운동의 언어</text>
<rect x="30" y="210" width="268" height="60" rx="8" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="164" y="247" text-anchor="middle">1장 프리뷰</text>
<rect x="30" y="286" width="268" height="60" rx="8" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="164" y="323" text-anchor="middle">2장 구성 공간</text>
<rect x="30" y="362" width="268" height="60" rx="8" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="164" y="399" text-anchor="middle">3장 강체 운동</text>

<rect x="328" y="100" width="268" height="80" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="462" y="132" text-anchor="middle">2부 기구학과 정역학</text>
<text class="s" x="462" y="160" text-anchor="middle">관절 각도와 손끝 자세</text>
<rect x="328" y="210" width="268" height="60" rx="8" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="462" y="247" text-anchor="middle">4장 순기구학</text>
<rect x="328" y="286" width="268" height="60" rx="8" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="462" y="323" text-anchor="middle">5장 속도 기구학과 정역학</text>
<rect x="328" y="362" width="268" height="60" rx="8" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="462" y="399" text-anchor="middle">6장 역기구학</text>
<rect x="328" y="438" width="268" height="60" rx="8" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="462" y="475" text-anchor="middle">7장 폐연쇄 기구학</text>

<rect x="626" y="100" width="268" height="80" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="760" y="132" text-anchor="middle">3부 동역학과 궤적</text>
<text class="s" x="760" y="160" text-anchor="middle">힘과 시간을 넣는다</text>
<rect x="626" y="210" width="268" height="60" rx="8" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="760" y="247" text-anchor="middle">8장 개연쇄 동역학</text>
<rect x="626" y="286" width="268" height="60" rx="8" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="b" x="760" y="323" text-anchor="middle">9장 궤적 생성</text>

<rect x="924" y="100" width="268" height="80" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="h" x="1058" y="132" text-anchor="middle">4부 계획과 제어</text>
<text class="s" x="1058" y="160" text-anchor="middle">어디로, 어떻게 움직일까</text>
<rect x="924" y="210" width="268" height="60" rx="8" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="b" x="1058" y="247" text-anchor="middle">10장 모션 플래닝</text>
<rect x="924" y="286" width="268" height="60" rx="8" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="b" x="1058" y="323" text-anchor="middle">11장 로봇 제어</text>

<rect x="1222" y="100" width="268" height="80" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="1356" y="132" text-anchor="middle">5부 조작과 이동 로봇</text>
<text class="s" x="1356" y="160" text-anchor="middle">물체와 바퀴로 확장</text>
<rect x="1222" y="210" width="268" height="60" rx="8" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="1356" y="247" text-anchor="middle">12장 파지와 조작</text>
<rect x="1222" y="286" width="268" height="60" rx="8" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="1356" y="323" text-anchor="middle">13장 바퀴형 이동 로봇</text>

<line x1="298" y1="140" x2="326" y2="140" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="596" y1="140" x2="624" y2="140" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="894" y1="140" x2="922" y2="140" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1192" y1="140" x2="1220" y2="140" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>

<rect x="626" y="400" width="864" height="98" rx="10" fill="#FFFFFF" stroke="#4A5260" stroke-width="2" stroke-dasharray="8 6"/>
<text class="h" x="1058" y="438" text-anchor="middle">모든 장이 공유하는 뼈대</text>
<text class="b" x="1058" y="472" text-anchor="middle">3장의 회전, 변환, 트위스트, 렌치가 뒤의 모든 장에서 반복 사용된다</text>

<text class="s" x="750" y="580" text-anchor="middle">노트 작성자가 직접 그린 개념도이며 원서의 그림을 옮기지 않았다.</text>
</svg>
