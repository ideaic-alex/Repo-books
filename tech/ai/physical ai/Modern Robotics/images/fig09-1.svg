<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="560" fill="#FFFFFF"/>
<text class="t" x="750" y="60" text-anchor="middle">경로 + 시간 스케일링 = 궤적</text>
<rect x="40" y="100" width="440" height="340" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="260" y="140" text-anchor="middle">경로 θ(s), s는 0에서 1</text>
<path d="M90 380 C 150 200, 250 360, 300 270 S 400 200, 430 230" fill="none" stroke="#3B6EA8" stroke-width="4"/>
<circle cx="90" cy="380" r="9" fill="#3B6EA8"/>
<circle cx="430" cy="230" r="9" fill="#3B6EA8"/>
<text class="b" x="115" y="418" text-anchor="start">s = 0</text>
<text class="b" x="395" y="270" text-anchor="start">s = 1</text>
<text class="b" x="260" y="425" text-anchor="middle">시간과 무관한 모양</text>
<text class="t" x="530" y="285" text-anchor="middle">+</text>
<rect x="580" y="100" width="440" height="340" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="800" y="140" text-anchor="middle">시간 스케일링 s(t)</text>
<line x1="640" y1="390" x2="980" y2="390" stroke="#4A5260" stroke-width="2" marker-end="url(#ar)"/>
<line x1="640" y1="390" x2="640" y2="165" stroke="#4A5260" stroke-width="2" marker-end="url(#ar)"/>
<path d="M640 390 C 760 390, 780 190, 940 190" fill="none" stroke="#B8862B" stroke-width="4"/>
<text class="b" x="940" y="415" text-anchor="middle">t</text>
<text class="b" x="665" y="185" text-anchor="start">s</text>
<text class="b" x="940" y="175" text-anchor="middle">T</text>
<text class="b" x="800" y="425" text-anchor="middle">3차, 5차, 사다리꼴, S자</text>
<text class="t" x="1070" y="285" text-anchor="middle">=</text>
<rect x="1120" y="100" width="340" height="340" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="1290" y="140" text-anchor="middle">궤적 θ(s(t))</text>
<text class="b" x="1290" y="215" text-anchor="middle">속도: θ̇ = θ′(s) ṡ</text>
<text class="b" x="1290" y="265" text-anchor="middle">가속도:</text>
<text class="b" x="1290" y="300" text-anchor="middle">θ̈ = θ″(s) ṡ² + θ′(s) s̈</text>
<text class="b" x="1290" y="365" text-anchor="middle">시간표가 속도를 정한다</text>
<text class="s" x="750" y="500" text-anchor="middle">같은 경로라도 s(t)를 바꾸면 속도와 가속도가 달라진다.</text>
</svg>
