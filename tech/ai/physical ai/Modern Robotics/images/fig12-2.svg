<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="620" fill="#FFFFFF"/>
<text class="t" x="750" y="55" text-anchor="middle">형 폐쇄와 힘 폐쇄</text>

<rect x="30" y="90" width="700" height="440" rx="12" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="380" y="130" text-anchor="middle">형 폐쇄: 법선만 사용, 평면에 점 접촉 4개</text>
<rect x="260" y="210" width="240" height="150" rx="6" fill="#FFFFFF" stroke="#3B6EA8" stroke-width="2.5"/>
<text class="b" x="380" y="292" text-anchor="middle">물체</text>
<line x1="380" y1="150" x2="380" y2="205" stroke="#B5524A" stroke-width="3.5" marker-end="url(#ar)"/>
<line x1="380" y1="425" x2="380" y2="365" stroke="#B5524A" stroke-width="3.5" marker-end="url(#ar)"/>
<line x1="200" y1="250" x2="255" y2="250" stroke="#B5524A" stroke-width="3.5" marker-end="url(#ar)"/>
<line x1="560" y1="320" x2="505" y2="320" stroke="#B5524A" stroke-width="3.5" marker-end="url(#ar)"/>
<text class="s" x="395" y="170">접촉 법선 1</text>
<text class="s" x="395" y="410">접촉 법선 2</text>
<text class="s" x="110" y="240">3</text>
<text class="s" x="570" y="340">4</text>
<text class="b" x="380" y="470" text-anchor="middle">F k = 0, k 의 모든 성분 ≥ 1 인 해가 있고</text>
<text class="b" x="380" y="498" text-anchor="middle">F 의 계수가 3 이면 형 폐쇄</text>

<rect x="770" y="90" width="700" height="440" rx="12" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="1120" y="130" text-anchor="middle">힘 폐쇄: 마찰 포함, 평면에 접촉 2개로도 가능</text>
<rect x="1000" y="210" width="240" height="150" rx="6" fill="#FFFFFF" stroke="#3C8D5A" stroke-width="2.5"/>
<text class="b" x="1120" y="292" text-anchor="middle">물체</text>
<polygon points="1000,285 905,225 905,345" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<polygon points="1240,285 1335,225 1335,345" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<circle cx="1000" cy="285" r="6" fill="#B5524A"/>
<circle cx="1240" cy="285" r="6" fill="#B5524A"/>
<line x1="1004" y1="285" x2="1236" y2="285" stroke="#B5524A" stroke-width="2.5" stroke-dasharray="9 6"/>
<text class="s" x="1120" y="402" text-anchor="middle">서로의 접촉점이 상대 마찰 원뿔 안에서 보임</text>
<text class="b" x="1120" y="470" text-anchor="middle">마찰 접촉의 렌치 원뿔이 렌치 공간 전체를 덮음</text>
<text class="b" x="1120" y="498" text-anchor="middle">마찰이 없으면 형 폐쇄와 같아짐</text>
<text class="s" x="750" y="580" text-anchor="middle">힘 폐쇄여도 손가락이 내부 압착력을 내지 못하면 물체는 움직일 수 있다.</text>
</svg>
