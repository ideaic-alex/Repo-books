<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs>
<marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker>
<marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#3B6EA8"/></marker>
<marker id="ar2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#B5524A"/></marker>
</defs>
<rect width="1500" height="620" fill="#FFFFFF"/>
<text class="t" x="750" y="58" text-anchor="middle">D-H 매개변수 네 개의 의미</text>
<text class="s" x="750" y="88" text-anchor="middle">이웃한 두 관절 축 i-1, i 와 둘을 잇는 공통 법선 (개념도, 비례는 무관)</text>

<!-- joint axis i-1 (vertical line) -->
<line x1="260" y1="130" x2="260" y2="470" stroke="#3B6EA8" stroke-width="5"/>
<text class="b" x="260" y="115" text-anchor="middle">관절 축 i-1 (z_{i-1})</text>
<!-- joint axis i (tilted line) -->
<line x1="640" y1="470" x2="760" y2="130" stroke="#3B6EA8" stroke-width="5"/>
<text class="b" x="760" y="115" text-anchor="middle">관절 축 i (z_i)</text>
<!-- common normal -->
<line x1="260" y1="400" x2="667" y2="400" stroke="#B8862B" stroke-width="4" stroke-dasharray="10 6"/>
<circle cx="260" cy="400" r="7" fill="#B8862B"/>
<circle cx="667" cy="400" r="7" fill="#B8862B"/>
<text class="b" x="463" y="385" text-anchor="middle">공통 법선 (x_{i-1} 방향)</text>
<!-- a_{i-1} dimension -->
<line x1="260" y1="440" x2="667" y2="440" stroke="#4A5260" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text class="h" x="463" y="475" text-anchor="middle">링크 길이 a_{i-1}</text>
<!-- alpha arc -->
<path d="M 260 290 A 60 60 0 0 1 307 304" fill="none" stroke="#B5524A" stroke-width="3" marker-end="url(#ar2)"/>
<text class="h" x="335" y="290" fill="#B5524A" style="fill:#B5524A">α_{i-1}</text>
<text class="s" x="335" y="316">z_{i-1} 에서 z_i 로 (x 축 둘레)</text>
<!-- d_i : along z_i from foot to frame origin -->
<line x1="665" y1="400" x2="699" y2="303" stroke="#3C8D5A" stroke-width="6" marker-end="url(#ab)"/>
<text class="h" x="725" y="350" style="fill:#3C8D5A">d_i (z_i 방향)</text>
<text class="h" x="790" y="240" style="fill:#B5524A">θ_i (z_i 둘레)</text>

<!-- parameter table -->
<rect x="980" y="130" width="500" height="380" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="1230" y="168" text-anchor="middle">네 매개변수 요약</text>
<text class="b" x="1005" y="215">a_{i-1} 링크 길이</text>
<text class="s" x="1005" y="240">공통 법선의 길이, 보통 상수</text>
<text class="b" x="1005" y="285">α_{i-1} 링크 비틀림</text>
<text class="s" x="1005" y="310">두 관절 축 사이의 각, 상수</text>
<text class="b" x="1005" y="355">d_i 링크 오프셋</text>
<text class="s" x="1005" y="380">직동 관절이면 관절 변수</text>
<text class="b" x="1005" y="425">θ_i 관절 각</text>
<text class="s" x="1005" y="450">회전 관절이면 관절 변수</text>
<text class="s" x="1005" y="490">T = Rot(x,α) Trans(x,a) Trans(z,d) Rot(z,θ)</text>

<text class="s" x="750" y="580" text-anchor="middle">두 축이 교차하면 a = 0, 평행하면 공통 법선이 무수히 많아 편한 것을 고른다.</text>
</svg>
