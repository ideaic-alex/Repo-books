<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="620" fill="#FFFFFF"/>
<text class="t" x="750" y="60" text-anchor="middle" >계산 토크 제어의 구조</text>
<rect x="30" y="255" width="190" height="90" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="125.0" y="296.0" text-anchor="middle" >궤적 생성기</text>
<text class="s" x="125.0" y="324.0" text-anchor="middle" >θd, θ̇d, θ̈d</text>
<circle cx="310" cy="300" r="22" fill="#FFFFFF" stroke="#4A5260" stroke-width="2.5"/>
<text class="b" x="310" y="307" text-anchor="middle" >Σ</text>
<line x1="220" y1="300" x2="286" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="262" y="288" text-anchor="middle" >θd</text>
<text class="s" x="296" y="270" text-anchor="middle" >+</text>
<text class="s" x="296" y="344" text-anchor="middle" >−</text>
<line x1="332" y1="300" x2="400" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="366" y="288" text-anchor="middle" >θe</text>
<rect x="400" y="255" width="170" height="90" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="485.0" y="296.0" text-anchor="middle" >PID</text>
<text class="s" x="485.0" y="324.0" text-anchor="middle" >Kp, Ki, Kd</text>
<circle cx="650" cy="300" r="22" fill="#FFFFFF" stroke="#4A5260" stroke-width="2.5"/>
<text class="b" x="650" y="307" text-anchor="middle" >Σ</text>
<line x1="570" y1="300" x2="626" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="612" y="288" text-anchor="middle" >θ̈fb</text>
<line x1="125" y1="255" x2="125" y2="170" stroke="#4A5260" stroke-width="2.5"/>
<line x1="125" y1="170" x2="650" y2="170" stroke="#4A5260" stroke-width="2.5"/>
<line x1="650" y1="170" x2="650" y2="276" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="390" y="158" text-anchor="middle" >계획 가속도 θ̈d (피드포워드)</text>
<rect x="730" y="255" width="170" height="90" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="815.0" y="296.0" text-anchor="middle" >M̃(θ)</text>
<text class="s" x="815.0" y="324.0" text-anchor="middle" >관성 모델</text>
<line x1="672" y1="300" x2="730" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<circle cx="980" cy="300" r="22" fill="#FFFFFF" stroke="#4A5260" stroke-width="2.5"/>
<text class="b" x="980" y="307" text-anchor="middle" >Σ</text>
<line x1="900" y1="300" x2="956" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="932" y="288" text-anchor="middle" >M̃θ̈</text>
<rect x="890" y="440" width="210" height="70" rx="10" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="2"/>
<text class="h" x="995.0" y="471.0" text-anchor="middle" >h̃(θ, θ̇)</text>
<text class="s" x="995.0" y="499.0" text-anchor="middle" >코리올리·중력·마찰</text>
<line x1="995" y1="440" x2="980" y2="324" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1060" y="255" width="200" height="90" rx="10" fill="#F9E8E8" stroke="#B5524A" stroke-width="2"/>
<text class="h" x="1160.0" y="296.0" text-anchor="middle" >로봇 팔 동역학</text>
<text class="s" x="1160.0" y="324.0" text-anchor="middle" >τ → θ</text>
<line x1="1002" y1="300" x2="1060" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="1031" y="288" text-anchor="middle" >τ</text>
<line x1="1260" y1="300" x2="1420" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="b" x="1420" y="286" text-anchor="end" >θ, θ̇</text>
<line x1="1340" y1="300" x2="1340" y2="560" stroke="#4A5260" stroke-width="2.5"/>
<line x1="1340" y1="560" x2="310" y2="560" stroke="#4A5260" stroke-width="2.5"/>
<line x1="310" y1="560" x2="310" y2="322" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1340" y1="470" x2="1102" y2="470" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="820" y="590" text-anchor="middle" >센서로 측정한 관절각과 속도를 되돌려 오차를 만든다</text>
<text class="b" x="750" y="110" text-anchor="middle" >τ = M̃(θ)( θ̈d + Kp·θe + Ki·∫θe + Kd·θ̇e ) + h̃(θ, θ̇)</text>
</svg>
