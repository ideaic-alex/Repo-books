<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="540" viewBox="0 0 1500 540">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="540" fill="#FFFFFF"/>
<text class="t" x="750" y="55" text-anchor="middle">영 자세에서 스크류 축 읽기 (평면 3R 팔)</text>
<rect x="40" y="90" width="860" height="390" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<line x1="100" y1="340" x2="180" y2="340" stroke="#4A5260" stroke-width="3"/>
<line x1="110" y1="340" x2="100" y2="360" stroke="#4A5260" stroke-width="2"/>
<line x1="130" y1="340" x2="120" y2="360" stroke="#4A5260" stroke-width="2"/>
<line x1="150" y1="340" x2="140" y2="360" stroke="#4A5260" stroke-width="2"/>
<line x1="170" y1="340" x2="160" y2="360" stroke="#4A5260" stroke-width="2"/>
<line x1="140" y1="320" x2="360" y2="320" stroke="#3B6EA8" stroke-width="12" stroke-linecap="round"/>
<line x1="360" y1="320" x2="580" y2="320" stroke="#3B6EA8" stroke-width="12" stroke-linecap="round"/>
<line x1="580" y1="320" x2="770" y2="320" stroke="#3B6EA8" stroke-width="12" stroke-linecap="round"/>
<line x1="140" y1="320" x2="140" y2="215" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="b" x="160" y="225">y</text>
<circle cx="140" cy="320" r="18" fill="#FBF0DC" stroke="#B8862B" stroke-width="3"/>
<circle cx="360" cy="320" r="18" fill="#FBF0DC" stroke="#B8862B" stroke-width="3"/>
<circle cx="580" cy="320" r="18" fill="#FBF0DC" stroke="#B8862B" stroke-width="3"/>
<circle cx="140" cy="320" r="4" fill="#B8862B"/><circle cx="360" cy="320" r="4" fill="#B8862B"/><circle cx="580" cy="320" r="4" fill="#B8862B"/>
<rect x="760" y="310" width="20" height="20" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="3"/>
<text class="h" x="140" y="270" text-anchor="middle">관절 1</text>
<text class="h" x="360" y="270" text-anchor="middle">관절 2</text>
<text class="h" x="580" y="270" text-anchor="middle">관절 3</text>
<text class="b" x="250" y="365" text-anchor="middle">L₁</text>
<text class="b" x="470" y="365" text-anchor="middle">L₂</text>
<text class="b" x="675" y="365" text-anchor="middle">L₃</text>
<text class="b" x="140" y="410" text-anchor="middle">{s}: 관절 1과 같은 위치</text>
<text class="b" x="770" y="365" text-anchor="middle">{b}</text>
<text class="b" x="770" y="410" text-anchor="middle">M: 영 자세의 말단 프레임</text>
<text class="s" x="470" y="455" text-anchor="middle">모든 관절축은 화면 밖(z 방향)을 향한다. 각 축이 지나는 점 q가 읽는 기준이다.</text>
<rect x="940" y="90" width="520" height="390" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="1200" y="132" text-anchor="middle">영 자세에서 읽는 값</text>
<text class="b" x="975" y="180">S₁ = (0, 0, 1, 0, 0, 0)</text>
<text class="b" x="975" y="220">S₂ = (0, 0, 1, 0, −L₁, 0)</text>
<text class="b" x="975" y="260">S₃ = (0, 0, 1, 0, −L₁−L₂, 0)</text>
<text class="b" x="975" y="310">M = 회전 I, 위치 (L₁+L₂+L₃, 0, 0)</text>
<text class="b" x="975" y="360">v = −ω × q  (q는 축 위의 한 점)</text>
<text class="b" x="975" y="415">T(θ) = e^[S₁]θ₁ e^[S₂]θ₂ e^[S₃]θ₃ M</text>
<text class="s" x="975" y="455">프레임을 링크마다 붙일 필요가 없다.</text>
</svg>
