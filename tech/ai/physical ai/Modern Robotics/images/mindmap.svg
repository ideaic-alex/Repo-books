<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600">
  <style>
    text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
    .t{font-size:34px;font-weight:700}
    .h{font-size:20px;font-weight:700}
    .b{font-size:17px}
    .s{font-size:16px;fill:#666}
  </style>
  <rect width="1500" height="600" fill="#FFFFFF"/>
  <text class="t" x="750" y="58" text-anchor="middle">Modern Robotics 학습 노트 한눈에 보기</text>
  <rect x="560" y="90" width="380" height="64" rx="12" fill="#2B2F36"/>
  <text class="h" x="750" y="130" text-anchor="middle" style="fill:#FFFFFF">Modern Robotics</text>
  <path d="M750 154 V180 H166 V204" fill="none" stroke="#9AA1AB" stroke-width="2"/>
  <rect x="30" y="204" width="272" height="48" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
  <text class="h" x="166" y="235" text-anchor="middle">1부 기초</text>
  <rect x="30" y="272" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#3B6EA8" stroke-width="1.5"/>
  <text class="b" x="166" y="299" text-anchor="middle">1장 프리뷰</text>
  <rect x="30" y="324" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#3B6EA8" stroke-width="1.5"/>
  <text class="b" x="166" y="351" text-anchor="middle">2장 구성 공간</text>
  <rect x="30" y="376" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#3B6EA8" stroke-width="1.5"/>
  <text class="b" x="166" y="403" text-anchor="middle">3장 강체 운동</text>
  <path d="M750 154 V180 H458 V204" fill="none" stroke="#9AA1AB" stroke-width="2"/>
  <rect x="322" y="204" width="272" height="48" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
  <text class="h" x="458" y="235" text-anchor="middle">2부 기구학과 정역학</text>
  <rect x="322" y="272" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#3E8A5A" stroke-width="1.5"/>
  <text class="b" x="458" y="299" text-anchor="middle">4장 순기구학</text>
  <rect x="322" y="324" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#3E8A5A" stroke-width="1.5"/>
  <text class="b" x="458" y="351" text-anchor="middle">5장 속도 기구학·정역학</text>
  <rect x="322" y="376" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#3E8A5A" stroke-width="1.5"/>
  <text class="b" x="458" y="403" text-anchor="middle">6장 역기구학</text>
  <rect x="322" y="428" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#3E8A5A" stroke-width="1.5"/>
  <text class="b" x="458" y="455" text-anchor="middle">7장 폐연쇄 기구학</text>
  <path d="M750 154 V180 H750 V204" fill="none" stroke="#9AA1AB" stroke-width="2"/>
  <rect x="614" y="204" width="272" height="48" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
  <text class="h" x="750" y="235" text-anchor="middle">3부 동역학과 궤적</text>
  <rect x="614" y="272" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#B8862B" stroke-width="1.5"/>
  <text class="b" x="750" y="299" text-anchor="middle">8장 개연쇄 동역학</text>
  <rect x="614" y="324" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#B8862B" stroke-width="1.5"/>
  <text class="b" x="750" y="351" text-anchor="middle">9장 궤적 생성</text>
  <path d="M750 154 V180 H1042 V204" fill="none" stroke="#9AA1AB" stroke-width="2"/>
  <rect x="906" y="204" width="272" height="48" rx="10" fill="#F3E8F7" stroke="#8A5AA8" stroke-width="2"/>
  <text class="h" x="1042" y="235" text-anchor="middle">4부 계획과 제어</text>
  <rect x="906" y="272" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#8A5AA8" stroke-width="1.5"/>
  <text class="b" x="1042" y="299" text-anchor="middle">10장 모션 플래닝</text>
  <rect x="906" y="324" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#8A5AA8" stroke-width="1.5"/>
  <text class="b" x="1042" y="351" text-anchor="middle">11장 로봇 제어</text>
  <path d="M750 154 V180 H1334 V204" fill="none" stroke="#9AA1AB" stroke-width="2"/>
  <rect x="1198" y="204" width="272" height="48" rx="10" fill="#FBE8E8" stroke="#B85A5A" stroke-width="2"/>
  <text class="h" x="1334" y="235" text-anchor="middle">5부 조작과 이동 로봇</text>
  <rect x="1198" y="272" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#B85A5A" stroke-width="1.5"/>
  <text class="b" x="1334" y="299" text-anchor="middle">12장 파지와 조작</text>
  <rect x="1198" y="324" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#B85A5A" stroke-width="1.5"/>
  <text class="b" x="1334" y="351" text-anchor="middle">13장 바퀴형 이동 로봇</text>
  <rect x="30" y="500" width="1440" height="48" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="b" x="750" y="530" text-anchor="middle">부록 A~D: 유용한 공식 요약 · 회전의 다른 표현 · 데나빗-하텐버그와 PoE · 최적화와 라그랑주 승수</text>
  <text class="s" x="750" y="580" text-anchor="middle">※ 부 구분은 노트 작성자가 정한 것이다(원서는 13개 장과 부록 A~D로 구성). 각 장은 이 노트가 풀어 정리한 문서로 연결된다.</text>
</svg>
