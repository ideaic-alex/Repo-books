<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="660" fill="#FFFFFF"/>
<text class="t" x="750.0" y="62.0" text-anchor="middle">Jenkins 원격 접근 API: 호출 도구와 대표 엔드포인트</text>
<rect x="50" y="150" width="330" height="120" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="215.0" y="203.0" text-anchor="middle">curl</text>
<text class="b" x="215.0" y="232.0" text-anchor="middle">명령줄 REST 클라이언트</text>
<rect x="50" y="400" width="330" height="120" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="215.0" y="453.0" text-anchor="middle">python-jenkins</text>
<text class="b" x="215.0" y="482.0" text-anchor="middle">파이썬 래퍼 라이브러리</text>
<rect x="500" y="250" width="280" height="170" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="640.0" y="313.5" text-anchor="middle">Jenkins</text>
<text class="b" x="640.0" y="342.5" text-anchor="middle">원격 접근 API</text>
<text class="b" x="640.0" y="371.5" text-anchor="middle">(REST 방식)</text>
<line x1="382" y1="210" x2="498" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="382" y1="460" x2="498" y2="380" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="900" y="120" width="560" height="100" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="b" x="1180.0" y="163.0" text-anchor="middle">GET  /job/이름/config.xml</text>
<text class="s" x="1180.0" y="192.0" text-anchor="middle">작업 설정 조회</text>
<line x1="782" y1="335" x2="898" y2="170" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="900" y="240" width="560" height="100" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="b" x="1180.0" y="283.0" text-anchor="middle">POST /createItem?name=이름</text>
<text class="s" x="1180.0" y="312.0" text-anchor="middle">새 작업 생성</text>
<line x1="782" y1="335" x2="898" y2="290" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="900" y="360" width="560" height="100" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="b" x="1180.0" y="403.0" text-anchor="middle">POST /job/이름/build</text>
<text class="s" x="1180.0" y="432.0" text-anchor="middle">일반 작업 실행</text>
<line x1="782" y1="335" x2="898" y2="410" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="900" y="480" width="560" height="100" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="b" x="1180.0" y="523.0" text-anchor="middle">POST /job/이름/buildWithParameters</text>
<text class="s" x="1180.0" y="552.0" text-anchor="middle">매개변수 작업 실행</text>
<line x1="782" y1="335" x2="898" y2="530" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="750.0" y="620.0" text-anchor="middle">모든 호출에는 권한 있는 사용자의 이름과 API 토큰이 필요하다.</text>
</svg>
