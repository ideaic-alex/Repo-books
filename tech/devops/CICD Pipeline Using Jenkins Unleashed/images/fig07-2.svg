<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<rect width="1500" height="560" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">Authorization 기본 옵션별 접근 범위</text>
<rect x="60" y="105" width="440" height="60" rx="8" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="280" y="143" text-anchor="middle">옵션</text>
<rect x="510" y="105" width="440" height="60" rx="8" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="730" y="143" text-anchor="middle">익명 사용자</text>
<rect x="960" y="105" width="480" height="60" rx="8" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="1200" y="143" text-anchor="middle">로그인 사용자</text>
<rect x="60" y="180" width="440" height="100" rx="8" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="b" x="280" y="238" text-anchor="middle">Anyone can do anything</text>
<rect x="510" y="180" width="440" height="100" rx="8" fill="#FBE5E3" stroke="#C0504D" stroke-width="2"/>
<text class="b" x="730" y="238" text-anchor="middle">전체 권한 (위험)</text>
<rect x="960" y="180" width="480" height="100" rx="8" fill="#FBE5E3" stroke="#C0504D" stroke-width="2"/>
<text class="b" x="1200" y="238" text-anchor="middle">전체 권한</text>
<rect x="60" y="295" width="440" height="100" rx="8" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="b" x="280" y="353" text-anchor="middle">Legacy mode</text>
<rect x="510" y="295" width="440" height="100" rx="8" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="730" y="353" text-anchor="middle">읽기 전용</text>
<rect x="960" y="295" width="480" height="100" rx="8" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="1200" y="343" text-anchor="middle">관리자 역할만 전체 권한</text>
<text class="b" x="1200" y="372" text-anchor="middle">나머지는 읽기 전용</text>
<rect x="60" y="410" width="440" height="100" rx="8" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="b" x="280" y="468" text-anchor="middle">Logged in users can do anything</text>
<rect x="510" y="410" width="440" height="100" rx="8" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="b" x="730" y="458" text-anchor="middle">Allow anonymous read access</text>
<text class="b" x="730" y="487" text-anchor="middle">켜면 읽기 전용, 끄면 접근 불가</text>
<rect x="960" y="410" width="480" height="100" rx="8" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="b" x="1200" y="468" text-anchor="middle">전체 권한</text>
</svg>
