<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="520" fill="#FFFFFF"/>
<text class="t" x="750.0" y="62" text-anchor="middle">프리스타일 잡 설정 화면의 구성</text>
<rect x="50" y="150" width="240" height="150" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="170.0" y="203.5" text-anchor="middle">General</text>
<text class="b" x="170.0" y="232.5" text-anchor="middle">이름 설명 보관 규칙</text>
<text class="s" x="170.0" y="261.5" text-anchor="middle">동시 실행 작업 공간</text>
<rect x="340" y="150" width="240" height="150" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="460.0" y="203.5" text-anchor="middle">Source Code</text>
<text class="b" x="460.0" y="232.5" text-anchor="middle">Management</text>
<text class="s" x="460.0" y="261.5" text-anchor="middle">Git 주소 인증 브랜치</text>
<rect x="630" y="150" width="240" height="150" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="750.0" y="203.5" text-anchor="middle">Build Triggers</text>
<text class="b" x="750.0" y="232.5" text-anchor="middle">언제 시작할까</text>
<text class="s" x="750.0" y="261.5" text-anchor="middle">SCM 폴링 주기 원격</text>
<rect x="920" y="150" width="240" height="150" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="1040.0" y="203.5" text-anchor="middle">Build Step</text>
<text class="b" x="1040.0" y="232.5" text-anchor="middle">무엇을 실행할까</text>
<text class="s" x="1040.0" y="261.5" text-anchor="middle">배치 명령 Maven</text>
<rect x="1210" y="150" width="240" height="150" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="1330.0" y="203.5" text-anchor="middle">Post-build</text>
<text class="b" x="1330.0" y="232.5" text-anchor="middle">Actions</text>
<text class="s" x="1330.0" y="261.5" text-anchor="middle">끝난 뒤 처리 메일</text>
<line x1="292" y1="225" x2="338" y2="225" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="582" y1="225" x2="628" y2="225" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="872" y1="225" x2="918" y2="225" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1162" y1="225" x2="1208" y2="225" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="750" y="360" text-anchor="middle">설정 화면은 위에서 아래로, 잡이 실행되는 순서와 거의 같은 방향으로 구성되어 있다.</text>
<text class="s" x="750" y="392" text-anchor="middle">트리거는 시작 조건, 빌드 단계는 본 작업, 빌드 후 동작은 마무리를 정한다.</text>
<rect x="300" y="430" width="900" height="60" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="b" x="750.0" y="467.5" text-anchor="middle">잡 = 위 설정 묶음 / 빌드 = 그 잡을 한 번 실행한 기록</text>
</svg>
