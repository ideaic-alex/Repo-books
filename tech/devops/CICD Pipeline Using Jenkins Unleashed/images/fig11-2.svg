<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="620" fill="#FFFFFF"/>
<text class="t" x="750.0" y="62" text-anchor="middle">Maven 생명주기: 단계를 지정하면 앞 단계가 모두 실행</text>
<rect x="30" y="170" width="180" height="110" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="120.0" y="218.0" text-anchor="middle">의존성 준비</text>
<text class="s" x="120.0" y="247.0" text-anchor="middle">resources</text>
<rect x="240" y="170" width="180" height="110" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="330.0" y="218.0" text-anchor="middle">소스 컴파일</text>
<text class="s" x="330.0" y="247.0" text-anchor="middle">compile</text>
<rect x="450" y="170" width="180" height="110" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="540.0" y="218.0" text-anchor="middle">테스트 컴파일</text>
<text class="s" x="540.0" y="247.0" text-anchor="middle">test-compile</text>
<rect x="660" y="170" width="180" height="110" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="750.0" y="218.0" text-anchor="middle">단위 테스트</text>
<text class="s" x="750.0" y="247.0" text-anchor="middle">test (surefire)</text>
<rect x="870" y="170" width="180" height="110" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="960.0" y="218.0" text-anchor="middle">JAR 생성</text>
<text class="s" x="960.0" y="247.0" text-anchor="middle">package</text>
<rect x="1080" y="170" width="180" height="110" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="1170.0" y="218.0" text-anchor="middle">로컬 설치</text>
<text class="s" x="1170.0" y="247.0" text-anchor="middle">install</text>
<rect x="1290" y="170" width="180" height="110" rx="10" fill="#FBE9E7" stroke="#B5483A" stroke-width="2"/>
<text class="h" x="1380.0" y="218.0" text-anchor="middle">원격 배포</text>
<text class="s" x="1380.0" y="247.0" text-anchor="middle">deploy</text>
<line x1="212" y1="225" x2="238" y2="225" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="422" y1="225" x2="448" y2="225" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="632" y1="225" x2="658" y2="225" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="842" y1="225" x2="868" y2="225" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1052" y1="225" x2="1078" y2="225" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1262" y1="225" x2="1288" y2="225" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="750" y="140" text-anchor="middle">mvn clean 은 이전 산출물을 지우고 새로 시작하는 별도 단계</text>
<path d="M30 320 L30 340 L1010 340 L1010 320" fill="none" stroke="#3B6EA8" stroke-width="2.5"/>
<text class="b" x="520" y="375" text-anchor="middle">mvn package: 여기까지 모두 실행</text>
<path d="M30 410 L30 430 L1430 430 L1430 410" fill="none" stroke="#B5483A" stroke-width="2.5"/>
<text class="b" x="730" y="465" text-anchor="middle">mvn deploy: 끝까지 실행하고 JAR를 원격 저장소에 올림</text>
<text class="s" x="750" y="540" text-anchor="middle">앞 단계가 실패하면(예: 단위 테스트 실패) 뒤 단계는 실행되지 않는다.</text>
<text class="s" x="750" y="570" text-anchor="middle">산출물 위치: 컴파일 결과는 target/classes, JAR는 target 폴더</text>
</svg>
