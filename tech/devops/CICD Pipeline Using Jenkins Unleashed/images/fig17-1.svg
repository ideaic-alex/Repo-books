<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="660" fill="#FFFFFF"/>
<text class="t" x="750.0" y="62.0" text-anchor="middle">Jenkins 분산 빌드: 컨트롤러와 에이전트</text>
<rect x="520" y="110" width="460" height="120" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="750.0" y="163.0" text-anchor="middle">Jenkins 컨트롤러 (마스터)</text>
<text class="b" x="750.0" y="192.0" text-anchor="middle">작업 정의, 빌드 단계를 에이전트에 분배</text>
<rect x="60" y="400" width="400" height="130" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="260.0" y="443.5" text-anchor="middle">에이전트 Node1</text>
<text class="b" x="260.0" y="472.5" text-anchor="middle">라벨 CalculatorAPI_Node</text>
<text class="b" x="260.0" y="501.5" text-anchor="middle">SSH로 연결</text>
<rect x="550" y="400" width="400" height="130" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="750.0" y="443.5" text-anchor="middle">에이전트 Node3</text>
<text class="b" x="750.0" y="472.5" text-anchor="middle">라벨 JNLPNode</text>
<text class="b" x="750.0" y="501.5" text-anchor="middle">에이전트가 먼저 접속</text>
<rect x="1040" y="400" width="400" height="130" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="1240.0" y="443.5" text-anchor="middle">그 밖의 에이전트</text>
<text class="b" x="1240.0" y="472.5" text-anchor="middle">라벨로 그룹화 (예: linux docker)</text>
<text class="b" x="1240.0" y="501.5" text-anchor="middle">서로 다른 OS와 도구</text>
<line x1="640" y1="232" x2="300" y2="398" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="408.9" y="302.0" width="122.2" height="26" rx="5" fill="#FFFFFF" stroke="#D0D4DA"/>
<text class="s" x="470.0" y="321.0" text-anchor="middle">빌드 단계 전달</text>
<line x1="750" y1="232" x2="750" y2="398" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="688.9" y="302.0" width="122.2" height="26" rx="5" fill="#FFFFFF" stroke="#D0D4DA"/>
<text class="s" x="750.0" y="321.0" text-anchor="middle">빌드 단계 전달</text>
<line x1="860" y1="232" x2="1200" y2="398" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="968.9" y="302.0" width="122.2" height="26" rx="5" fill="#FFFFFF" stroke="#D0D4DA"/>
<text class="s" x="1030.0" y="321.0" text-anchor="middle">빌드 단계 전달</text>
<text class="s" x="750.0" y="590.0" text-anchor="middle">에이전트는 여러 대가 단계를 병렬로 실행해 전체 빌드 시간을 줄이고, 필요한 소프트웨어를 한 대에 몰아 설치하지 않아도 된다.</text>
</svg>
