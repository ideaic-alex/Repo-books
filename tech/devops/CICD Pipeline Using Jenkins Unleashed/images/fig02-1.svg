<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="600" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">Jenkins가 변경 하나에 반응하는 과정</text>
<rect x="40" y="110" width="330" height="110" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="205.0" y="146.0" text-anchor="middle">개발자 푸시</text>
<text class="b" x="205.0" y="176.0" text-anchor="middle">브랜치 변경이 중앙</text>
<text class="b" x="205.0" y="206.0" text-anchor="middle">저장소에 반영된다</text>
<rect x="585" y="110" width="330" height="110" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="750.0" y="146.0" text-anchor="middle">Jenkins 알림 수신</text>
<text class="b" x="750.0" y="176.0" text-anchor="middle">브랜치 변경 소식을</text>
<text class="b" x="750.0" y="206.0" text-anchor="middle">받는다</text>
<rect x="1130" y="110" width="330" height="110" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="1295.0" y="146.0" text-anchor="middle">잡(job) 실행</text>
<text class="b" x="1295.0" y="176.0" text-anchor="middle">정해진 단계를</text>
<text class="b" x="1295.0" y="206.0" text-anchor="middle">순서대로 수행</text>
<line x1="372" y1="165" x2="583" y2="165" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="917" y1="165" x2="1128" y2="165" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="40" y="330" width="160" height="90" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="120.0" y="382" text-anchor="middle">1 가져오기</text>
<line x1="202" y1="375" x2="218" y2="375" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="220" y="330" width="160" height="90" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="300.0" y="382" text-anchor="middle">2 컴파일</text>
<line x1="382" y1="375" x2="398" y2="375" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="400" y="330" width="160" height="90" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="480.0" y="382" text-anchor="middle">3 단위·통합 테스트</text>
<line x1="562" y1="375" x2="578" y2="375" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="580" y="330" width="160" height="90" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="660.0" y="382" text-anchor="middle">4 정적 분석</text>
<line x1="742" y1="375" x2="758" y2="375" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="760" y="330" width="160" height="90" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="840.0" y="382" text-anchor="middle">5 패키징</text>
<line x1="922" y1="375" x2="938" y2="375" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="940" y="330" width="160" height="90" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="1020.0" y="382" text-anchor="middle">6 배포</text>
<line x1="1102" y1="375" x2="1118" y2="375" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1120" y="330" width="160" height="90" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="1200.0" y="382" text-anchor="middle">7 E2E 테스트</text>
<line x1="1282" y1="375" x2="1298" y2="375" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1300" y="330" width="160" height="90" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="b" x="1380.0" y="382" text-anchor="middle">8 메일 알림</text>
<line x1="1295" y1="222" x2="1295" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1295" y1="300" x2="120" y2="300" stroke="#4A5260" stroke-width="2.5"/>
<line x1="120" y1="300" x2="120" y2="328" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="750" y="480" text-anchor="middle">각 단계는 앞 단계의 결과물을 받아 처리한다. 한 단계가 실패하면 뒤 단계는 실행되지 않고 빌드가 실패한다.</text>
<text class="s" x="750" y="520" text-anchor="middle">(컴파일은 Maven 같은 빌드 도구, 정적 분석은 SonarQube, E2E는 Selenium 같은 도구를 플러그인으로 부른다)</text>
</svg>
