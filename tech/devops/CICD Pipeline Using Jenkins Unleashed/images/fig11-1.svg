<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="600" fill="#FFFFFF"/>
<text class="t" x="750.0" y="62" text-anchor="middle">Maven 프로젝트의 구조</text>
<rect x="80" y="130" width="620" height="100" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="390.0" y="173.0" text-anchor="middle">CalculatorAPI (프로젝트 폴더)</text>
<text class="s" x="390.0" y="202.0" text-anchor="middle">폴더 이름은 ArtifactId</text>
<rect x="80" y="270" width="620" height="110" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="390.0" y="303.5" text-anchor="middle">src/main/java</text>
<text class="b" x="390.0" y="332.5" text-anchor="middle">소스 코드: Calculator.java</text>
<text class="s" x="390.0" y="361.5" text-anchor="middle">패키지는 GroupId와 ArtifactId</text>
<rect x="80" y="420" width="620" height="110" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="390.0" y="453.5" text-anchor="middle">src/test/java</text>
<text class="b" x="390.0" y="482.5" text-anchor="middle">단위 테스트: TestNG 테스트 파일</text>
<text class="s" x="390.0" y="511.5" text-anchor="middle">기능별로 파일을 나눔</text>
<line x1="390" y1="232" x2="390" y2="268" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="390" y1="382" x2="390" y2="418" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="830" y="130" width="600" height="400" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="1130.0" y="221.5" text-anchor="middle">pom.xml (Project Object Model)</text>
<text class="b" x="1130.0" y="250.5" text-anchor="middle">1. 프로젝트 식별</text>
<text class="s" x="1130.0" y="279.5" text-anchor="middle">GroupId ArtifactId Version</text>
<text class="b" x="1130.0" y="308.5" text-anchor="middle">2. properties</text>
<text class="s" x="1130.0" y="337.5" text-anchor="middle">Java 버전 소스 인코딩</text>
<text class="b" x="1130.0" y="366.5" text-anchor="middle">3. dependencies</text>
<text class="s" x="1130.0" y="395.5" text-anchor="middle">외부 라이브러리와 scope(test 등)</text>
<text class="b" x="1130.0" y="424.5" text-anchor="middle">4. build</text>
<text class="s" x="1130.0" y="453.5" text-anchor="middle">단계별 플러그인과 버전</text>
<line x1="702" y1="325" x2="828" y2="325" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="750" y="570" text-anchor="middle">pom.xml이 프로젝트의 빌드 방식을, 두 폴더가 코드와 테스트를 담는다.</text>
</svg>
