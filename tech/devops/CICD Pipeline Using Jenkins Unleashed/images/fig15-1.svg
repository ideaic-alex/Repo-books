<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="620" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">상위 잡에서 하위 잡으로 이어지는 흐름</text>
<rect x="45" y="130" width="300" height="120" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="195" y="182" text-anchor="middle">웹 앱 저장소</text>
<text class="b" x="195" y="212" text-anchor="middle">master에 푸시</text>
<rect x="415" y="130" width="300" height="120" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="565" y="182" text-anchor="middle">상위 잡</text>
<text class="b" x="565" y="212" text-anchor="middle">빌드와 배포</text>
<rect x="785" y="130" width="300" height="120" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="935" y="182" text-anchor="middle">하위 잡</text>
<text class="b" x="935" y="212" text-anchor="middle">Selenium UI 테스트</text>
<rect x="1155" y="130" width="300" height="120" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="1305" y="182" text-anchor="middle">이메일 알림</text>
<text class="b" x="1305" y="212" text-anchor="middle">HTML 보고서 첨부</text>
<line x1="347" y1="190" x2="413" y2="190" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="717" y1="190" x2="783" y2="190" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="1087" y1="190" x2="1153" y2="190" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="375" y="330" width="380" height="150" rx="10" fill="#F4F5F7" stroke="#6B7280" stroke-width="2"/>
<text class="b" x="565" y="368" text-anchor="middle">Poll SCM으로 변경 감지</text>
<text class="b" x="565" y="400" text-anchor="middle">배포 폴더 정리 후 복사</text>
<text class="b" x="565" y="432" text-anchor="middle">Calculator.html을 IIS에 배포</text>
<text class="b" x="565" y="464" text-anchor="middle">TestType 값을 하위 잡에 전달</text>
<rect x="765" y="330" width="380" height="150" rx="10" fill="#F4F5F7" stroke="#6B7280" stroke-width="2"/>
<text class="b" x="935" y="368" text-anchor="middle">폴링 없음, 호출될 때만 실행</text>
<text class="b" x="935" y="400" text-anchor="middle">가상 환경 만들고 패키지 설치</text>
<text class="b" x="935" y="432" text-anchor="middle">AllTests면 전체, 아니면 pytest -m</text>
<text class="b" x="935" y="464" text-anchor="middle">결과 파일 TestTypeResult.html</text>
<line x1="565" y1="252" x2="565" y2="328" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="935" y1="252" x2="935" y2="328" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="750" y="540" text-anchor="middle">선택 가능한 TestType 값: AllTests, RegressionTest, SmokeTest. 파이프라인 버전도 같은 구조다.</text>
</svg>
