<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="660" fill="#FFFFFF"/>
<text class="t" x="750.0" y="62.0" text-anchor="middle">Jenkins CLI 접속 방식 세 가지</text>
<rect x="60" y="130" width="520" height="120" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="320.0" y="183.0" text-anchor="middle">A. jenkins-cli.jar + HTTP</text>
<text class="b" x="320.0" y="212.0" text-anchor="middle">-auth 사용자:API 토큰, -webSocket</text>
<rect x="60" y="290" width="520" height="120" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="320.0" y="343.0" text-anchor="middle">B. OpenSSH 클라이언트</text>
<text class="b" x="320.0" y="372.0" text-anchor="middle">ssh 사용자@호스트 -p 포트 -i 키 build 작업</text>
<rect x="60" y="450" width="520" height="120" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="320.0" y="503.0" text-anchor="middle">C. jenkins-cli.jar + SSH</text>
<text class="b" x="320.0" y="532.0" text-anchor="middle">-ssh -user 사용자 -i 키 -p 포트</text>
<rect x="1000" y="190" width="440" height="300" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="1220.0" y="289.5" text-anchor="middle">Jenkins 서버</text>
<text class="b" x="1220.0" y="318.5" text-anchor="middle">HTTP 포트 8080</text>
<text class="b" x="1220.0" y="347.5" text-anchor="middle">SSH Server 포트 9090 (고정)</text>
<text class="b" x="1220.0" y="376.5" text-anchor="middle">API 토큰 발급</text>
<text class="b" x="1220.0" y="405.5" text-anchor="middle">사용자 설정에 SSH 공개키 등록</text>
<line x1="582" y1="190" x2="998" y2="250" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="698.2" y="207.0" width="183.7" height="26" rx="5" fill="#FFFFFF" stroke="#D0D4DA"/>
<text class="s" x="790.0" y="226.0" text-anchor="middle">HTTP 8080 + API 토큰</text>
<line x1="582" y1="350" x2="998" y2="350" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="711.9" y="337.0" width="156.2" height="26" rx="5" fill="#FFFFFF" stroke="#D0D4DA"/>
<text class="s" x="790.0" y="356.0" text-anchor="middle">SSH 9090 + 개인키</text>
<line x1="582" y1="510" x2="998" y2="450" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="711.9" y="467.0" width="156.2" height="26" rx="5" fill="#FFFFFF" stroke="#D0D4DA"/>
<text class="s" x="790.0" y="486.0" text-anchor="middle">SSH 9090 + 개인키</text>
<text class="s" x="750.0" y="625.0" text-anchor="middle">인증 없이 호출하면 anonymous 사용자로 처리되어 권한 오류가 난다. 책은 비밀번호보다 API 토큰을 권한다.</text>
</svg>
