<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="560" fill="#FFFFFF"/>
<text class="t" x="750.0" y="62" text-anchor="middle">잡과 빌드의 관계</text>
<rect x="80" y="210" width="340" height="140" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="250.0" y="258.5" text-anchor="middle">잡 (Job)</text>
<text class="b" x="250.0" y="287.5" text-anchor="middle">설정은 하나</text>
<text class="s" x="250.0" y="316.5" text-anchor="middle">트리거 빌드 단계 후처리</text>
<rect x="620" y="110" width="360" height="100" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="800.0" y="153.0" text-anchor="middle">빌드 #1</text>
<text class="s" x="800.0" y="182.0" text-anchor="middle">실행 한 번에 번호 하나</text>
<line x1="422" y1="280" x2="618" y2="160" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1100" y="110" width="330" height="100" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="b" x="1265.0" y="153.0" text-anchor="middle">콘솔 로그</text>
<text class="b" x="1265.0" y="182.0" text-anchor="middle">산출물 (Artifact)</text>
<line x1="982" y1="160" x2="1098" y2="160" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="620" y="250" width="360" height="100" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="800.0" y="293.0" text-anchor="middle">빌드 #2</text>
<text class="s" x="800.0" y="322.0" text-anchor="middle">실행 한 번에 번호 하나</text>
<line x1="422" y1="280" x2="618" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1100" y="250" width="330" height="100" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="b" x="1265.0" y="293.0" text-anchor="middle">콘솔 로그</text>
<text class="b" x="1265.0" y="322.0" text-anchor="middle">산출물 (Artifact)</text>
<line x1="982" y1="300" x2="1098" y2="300" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="620" y="390" width="360" height="100" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="800.0" y="433.0" text-anchor="middle">빌드 #3</text>
<text class="s" x="800.0" y="462.0" text-anchor="middle">실행 한 번에 번호 하나</text>
<line x1="422" y1="280" x2="618" y2="440" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1100" y="390" width="330" height="100" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="b" x="1265.0" y="433.0" text-anchor="middle">콘솔 로그</text>
<text class="b" x="1265.0" y="462.0" text-anchor="middle">산출물 (Artifact)</text>
<line x1="982" y1="440" x2="1098" y2="440" stroke="#4A5260" stroke-width="2.5" marker-end="url(#ar)"/>
<text class="s" x="750" y="530" text-anchor="middle">같은 잡을 다시 실행하면 새 번호의 빌드가 생기고, 로그와 산출물이 번호별로 따로 보관된다.</text>
</svg>
