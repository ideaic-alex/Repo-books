<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600">
<style>
text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#2B2F36}
.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:19px}.s{font-size:16px;fill:#666}
</style>
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 z" fill="#4A5260"/></marker></defs>
<rect width="1500" height="600" fill="#FFFFFF"/>
<text class="t" x="750" y="62" text-anchor="middle">Plugin Manager의 네 개 탭</text>
<rect x="40" y="110" width="330" height="230" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="205.0" y="178.0" text-anchor="middle">Updates</text>
<text class="b" x="205.0" y="208.0" text-anchor="middle">설치된 플러그인의</text>
<text class="b" x="205.0" y="238.0" text-anchor="middle">새 버전 목록</text>
<text class="b" x="205.0" y="268.0" text-anchor="middle">Download now and</text>
<text class="b" x="205.0" y="298.0" text-anchor="middle">install after restart</text>
<rect x="405" y="110" width="330" height="230" rx="10" fill="#E8F0F9" stroke="#3B6EA8" stroke-width="2"/>
<text class="h" x="570.0" y="178.0" text-anchor="middle">Available</text>
<text class="b" x="570.0" y="208.0" text-anchor="middle">새 플러그인 검색</text>
<text class="b" x="570.0" y="238.0" text-anchor="middle">설치 방식 선택:</text>
<text class="b" x="570.0" y="268.0" text-anchor="middle">Install without restart /</text>
<text class="b" x="570.0" y="298.0" text-anchor="middle">재시작 후 설치</text>
<rect x="770" y="110" width="330" height="230" rx="10" fill="#E5F2E8" stroke="#3E8A5A" stroke-width="2"/>
<text class="h" x="935.0" y="192.0" text-anchor="middle">Installed</text>
<text class="b" x="935.0" y="222.0" text-anchor="middle">설치 목록과 버전</text>
<text class="b" x="935.0" y="252.0" text-anchor="middle">Uninstall 또는</text>
<text class="b" x="935.0" y="282.0" text-anchor="middle">체크 해제로 Disable</text>
<rect x="1135" y="110" width="330" height="230" rx="10" fill="#ECEEF1" stroke="#6B7280" stroke-width="2"/>
<text class="h" x="1300.0" y="178.0" text-anchor="middle">Advanced</text>
<text class="b" x="1300.0" y="208.0" text-anchor="middle">HTTP Proxy 설정</text>
<text class="b" x="1300.0" y="238.0" text-anchor="middle">HPI 파일 직접 업로드</text>
<text class="b" x="1300.0" y="268.0" text-anchor="middle">Update Site URL,</text>
<text class="b" x="1300.0" y="298.0" text-anchor="middle">Check Now</text>
<text class="s" x="750" y="400" text-anchor="middle">경로: Manage Jenkins > Manage Plugins</text>
<rect x="250" y="440" width="1000" height="100" rx="10" fill="#FBF0DC" stroke="#B8862B" stroke-width="2"/>
<text class="h" x="750.0" y="485.0" text-anchor="middle">플러그인이 하는 일</text>
<text class="b" x="750.0" y="515.0" text-anchor="middle">Jenkins가 Git, Maven, 메일 같은 외부 도구와 연결되도록 이어 주는 부품</text>
</svg>
